      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --bg: #0c0f14; --panel: #151a22; --panel2: #1c222c; --line: #262d39; --tx: #eef1f6; --mut: #8b95a7; color-scheme: dark; }
      }
      :root[data-theme='dark'] { --bg: #0c0f14; --panel: #151a22; --panel2: #1c222c; --line: #262d39; --tx: #eef1f6; --mut: #8b95a7; color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--tx); font: 400 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      .wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); }
      .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .logo { display: inline-block; width: 34px; height: 34px; flex: none; } .logo svg { width: 100%; height: 100%; display: block; }
      .top h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; } .top h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--mut); }
      .top .sp { flex: 1; }
      .ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; height: 36px; padding: 0 12px; font-weight: 600; font-size: 13px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
      .card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
      .card h2 .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px; display: grid; place-items: center; flex: none; }
      .muted { color: var(--mut); } .small { font-size: 13px; }
      .in { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); padding: 0 12px; font-size: 16px; outline: none; }
      .in:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
      .meter { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .meter > div { background: var(--panel2); border-radius: 12px; padding: 10px 12px; }
      .meter small { display: block; font-size: 12px; color: var(--mut); }
      .meter b { font: 500 17px var(--mono); }
      .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; transition: width .3s; }
      .bar i.hi { background: var(--warn); } .bar i.full { background: var(--dn); }
      .res { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .pl { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
      .pl.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: color-mix(in srgb, var(--brand) 8%, var(--panel)); }
      .av { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--brand) 18%, var(--panel2)); color: var(--brand); display: grid; place-items: center; font-weight: 700; flex: none; text-transform: uppercase; }
      .pl .t { display: flex; flex-direction: column; min-width: 0; text-align: left; } .pl b { font-size: 14.5px; } .pl small { font-size: 12.5px; color: var(--mut); }
      .picked { display: flex; align-items: center; gap: 10px; }
      .picked .x { margin-left: auto; }

  <body>
    <div id="root"></div>
    <script>
      (() => {
        'use strict';
        const API = 'https://amnbnuabxoxhggidlhcn.supabase.co/rest/v1/rpc/';
        const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtbmJudWFieG94aGdnaWRsaGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjc5ODAsImV4cCI6MjEwNTYwMzk4MH0.WwHTYzYEwKtW2_fjoyPiltnxI331-Ve5IGolTpavISo';
        const LOGO = "<svg viewBox=\"0 0 64 64\"><defs><linearGradient id=\"pbLgH\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffb52e\"/><stop offset=\"1\" stop-color=\"#ff5e1a\"/></linearGradient></defs><rect width=\"64\" height=\"64\" rx=\"15\" fill=\"url(#pbLgH)\"/><path d=\"M13.5 14.5c.6 8.4 5.6 12.5 12.5 12.5h12c6.9 0 11.9-4.1 12.5-12.5\" stroke=\"#fff\" stroke-width=\"5.2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M21.2 25.5h21.6l-3.6 18.2c-1 4.9-3.8 7.8-7.2 7.8s-6.2-2.9-7.2-7.8z\" fill=\"#fff\"/><path d=\"M28.3 30.5v13.5M35.7 27.5v12.5\" stroke=\"#16c784\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><rect x=\"26.5\" y=\"33\" width=\"3.6\" height=\"8.5\" rx=\"1.3\" fill=\"#16c784\"/><rect x=\"33.9\" y=\"29.8\" width=\"3.6\" height=\"8\" rx=\"1.3\" fill=\"#16c784\"/></svg>";
        const ITEMS = [{"k": "pu_xp", "n": "XP Booster", "t": "power", "d": "2\u00d7 XP for 15 minutes.", "i": 0}, {"k": "pu_refresh", "n": "Pack Refresh", "t": "power", "d": "Makes your free pack ready right now.", "i": 1}, {"k": "pu_streak", "n": "Streak Saver", "t": "power", "d": "Keeps your login streak alive if you miss a day. Used automatically.", "i": 2}, {"k": "egg_speckled", "n": "Speckled Egg", "t": "egg", "d": "The cheapest egg. Almost always a Common pet.", "i": 3}, {"k": "egg_c", "n": "Pet Egg", "t": "egg", "d": "Mostly Common pets. Rare if you\u2019re lucky.", "i": 4}, {"k": "tr_snack", "n": "Snack", "t": "treat", "d": "+30 happiness.", "i": 5}, {"k": "tr_toy", "n": "Squeaky Toy", "t": "treat", "d": "+55 happiness.", "i": 6}, {"k": "tr_apple", "n": "Apple", "t": "treat", "d": "+20 happiness.", "i": 7}, {"k": "tr_bone", "n": "Chew Bone", "t": "treat", "d": "+40 happiness.", "i": 8}, {"k": "av_bull", "n": "Bull", "t": "avatar", "d": "", "i": 9}, {"k": "av_bear", "n": "Bear", "t": "avatar", "d": "", "i": 10}, {"k": "av_fox", "n": "Fox", "t": "avatar", "d": "", "i": 11}, {"k": "av_frog", "n": "Frog", "t": "avatar", "d": "", "i": 12}, {"k": "av_cowboy", "n": "Cowboy", "t": "avatar", "d": "", "i": 13}, {"k": "av_panda", "n": "Panda", "t": "avatar", "d": "", "i": 14}, {"k": "av_koala", "n": "Koala", "t": "avatar", "d": "", "i": 15}, {"k": "av_chef", "n": "Chef", "t": "avatar", "d": "", "i": 16}, {"k": "av_pirate", "n": "Pirate", "t": "avatar", "d": "", "i": 17}, {"k": "th_amber", "n": "Amber", "t": "theme", "d": "", "i": 18}, {"k": "th_mint", "n": "Mint", "t": "theme", "d": "", "i": 19}, {"k": "th_lime", "n": "Lime", "t": "theme", "d": "", "i": 20}, {"k": "th_coral", "n": "Coral", "t": "theme", "d": "", "i": 21}, {"k": "th_sky", "n": "Sky", "t": "theme", "d": "", "i": 22}, {"k": "th_peach", "n": "Peach", "t": "theme", "d": "", "i": 23}, {"k": "sk_classic", "n": "Classic", "t": "skin", "d": "", "i": 24}, {"k": "sk_retro", "n": "Retro Terminal", "t": "skin", "d": "", "i": 25}, {"k": "sk_sunset", "n": "Sunset", "t": "skin", "d": "", "i": 26}, {"k": "sk_forest", "n": "Forest Floor", "t": "skin", "d": "", "i": 27}, {"k": "sk_berry", "n": "Berry", "t": "skin", "d": "", "i": 28}]; // the only items a helper can ever give (the server checks this list too)
        const COLS = 6;
        const IT = {};

        const $ = (s, r = document) => r.querySelector(s),
          $$ = (s, r = document) => [...r.querySelectorAll(s)];
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);

        const ERR = {
          bad_code: 'Wrong code.',
          locked: 'Too many wrong codes. Try again in 15 minutes.',

          no_user: 'Couldn’t find that player.',
          over_gift: 'That’s more than a helper can give at once.',
          day_gifts: 'You’ve used all your gifts for today. More tomorrow!',
          day_coins: 'You’ve given all the coins you can today.',
          day_xp: 'You’ve given all the XP you can today.',

          bad_item: 'Helpers can’t give that item.',

          self_gift: 'You can’t gift your own game account.',
          network: 'Can’t reach the server. Check your internet.',
          not_ready: 'The helper panel isn’t switched on yet. Ask the owner.',
          too_long: 'That message is too long.',
        };
        async function rpc(fn, args = {}) {
          let r;
          try {
            r = await fetch(API + fn, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
          } catch (e) {
            throw Object.assign(new Error(ERR.network), { code: 'network' });
          }
          const t = await r.text();
          let j = null;
          try {
            j = t ? JSON.parse(t) : null;
          } catch (e) {}
          if (!r.ok) {
            let code = (j && j.message) || 'error';
            if (r.status === 404 || (j && /PGRST202|Could not find the function/.test((j.code || '') + (j.message || '')))) code = 'not_ready';
            if (code === 'helper_auth') setTimeout(() => signOut(true), 0);
            throw Object.assign(new Error(ERR[code] || 'Something went wrong (' + code + ')'), { code, left: j && j.details && /^\d+$/.test(j.details) ? +j.details : null });
          }
          if (j && j.error) throw Object.assign(new Error(ERR[j.error] || j.error), { code: j.error, left: j.left });
          return j;
        }
        const S = { token: null, me: null, kind: 'coins', amount: 0, item: null, user: null };
        try {
          S.token = sessionStorage.getItem('pbh.t');
        } catch (e) {}
        const H = (fn, a = {}) => rpc(fn, Object.assign({ p_token: S.token }, a));
        function toast(msg, kind) {
          $$('.toast').forEach(t => t.remove());
          const t = document.createElement('div');
          t.className = 'toast ' + (kind || '');
          t.setAttribute('role', 'status');
          t.textContent = msg;
          document.body.appendChild(t);
          setTimeout(() => t.remove(), kind === 'err' ? 4500 : 2800);
        }
        const art = k => (IT[k] ? `<span class="ia" style="--x:${IT[k].i % COLS};--y:${Math.floor(IT[k].i / COLS)}"></span>` : '');

        /* ---------- sign in ---------- */
        const LEN = 6;
        function login() {
          const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'];
          $('#root').innerHTML = `<div class="login"><form class="lcard" id="lf" autocomplete="off"><span class="logo">${LOGO}</span><h1>Helper</h1><p>Enter your ${LEN}-digit helper code</p>
            <label class="pin" id="pin">${Array.from({ length: LEN }, () => '<i></i>').join('')}<input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="${LEN}" autocomplete="one-time-code" aria-label="Helper code"></label>
            <div class="err" id="le" role="alert"></div>
            <div class="pad" id="pad">${keys.map(k => `<button type="button" data-k="${k}" class="${k.length > 1 ? 'fn' : ''}" aria-label="${k === 'del' ? 'Delete' : k === 'clr' ? 'Clear' : k}">${k === 'del' ? '⌫' : k === 'clr' ? 'Clear' : k}</button>`).join('')}</div>

          const inp = $('#code'),
            pin = $('#pin'),
            er = $('#le');

          const go = async () => {
            if (busy || inp.value.length !== LEN) return;

            }

            inp.value = inp.value.replace(/\D/g, '').slice(0, LEN);

            if (inp.value.length === LEN) go();

          $('#pad').onclick = e => {
            const k = e.target.closest('button')?.dataset.k;

        function signOut(expired) {
          const t = S.token;

          try {

        /* ---------- the panel ---------- */

        function panel() {

            <div class="card"><div class="meter" id="meter"></div></div>
            <div class="card"><h2><span class="n">1</span>Who gets it?</h2>
              <div id="who"></div></div>

          paintWhat();
          loadLog();
        }
        function paintMeter() {

          let rows = [];

        function paintWhat() {

          paintSum();

        const what = () => (S.kind === 'item' ? (S.item ? IT[S.item].n : '') : S.amount ? `${num(S.amount)} ${S.kind === 'coins' ? 'coins' : 'XP'}` : '');
        function paintSum() {
          const w = what(),
            ok = S.user && w && today().gifts < cfg().gifts_day;

          if (!s) return;
          s.innerHTML = today().gifts >= cfg().gifts_day ? '<b>You’ve used all your gifts for today.</b> More tomorrow!' : `${S.user ? `<b>@${esc(S.user.username)}</b>` : '<span class="muted">Pick a player</span>'} ${w ? `gets <b>${esc(w)}</b>` : '<span class="muted">· pick a gift</span>'}`;
          $('#give').disabled = !ok;
        }
        let giving = false;
        async function give() {
          if (giving || !S.user || !what()) return;
          giving = true;
          const b = $('#give');
          b.disabled = true;
          b.textContent = 'Giving…';
          $('#gerr').textContent = '';
          try {
            const r = await H('pbh_give', { p_user: S.user.id, p_kind: S.kind, p_amount: S.kind === 'item' ? null : S.amount, p_item_id: S.kind === 'item' ? S.item : null, p_message: $('#msg').value.trim() || null });
            toast(`Sent ${what()} to @${S.user.username}!`);
            if (r && r.today) S.me.today = r.today;
            S.user = null;
            S.amount = 0;
            S.item = null;
            $('#msg').value = '';
            paintMeter();
            paintWho();
            paintWhat();
            loadLog();
          } catch (e) {
            $('#gerr').textContent = e.message;
          }
          b.textContent = 'Give gift';
          giving = false;
          paintSum();
        }
        async function loadLog() {
          const box = $('#log');
          try {
            const L = (await H('pbh_log')) || [];
            if (!$('#log')) return;
            box.innerHTML = L.length ? L.map(x => `<div><span>@${esc(x.username)} got <b>${esc(x.what)}</b></span><time>${new Date(x.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</time></div>`).join('') : '<span class="muted small">Nothing yet today.</span>';
          } catch (e) {
            box.innerHTML = `<span class="muted small">${esc(e.message)}</span>`;
          }
        }
        (async () => {
          if (S.token) {
            try {
              return await start();
            } catch (e) {
              S.token = null;
              try {
                sessionStorage.removeItem('pbh.t');
              } catch (e2) {}
            }
          }
          login();
        })();
      })();
    </script>
  </body>
</html>
