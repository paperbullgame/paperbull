      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']) { --bg: #0c0f14; --panel: #151a22; --panel2: #1c222c; --line: #262d39; --tx: #eef1f6; --mut: #8b95a7; color-scheme: dark; }
      }
      :root[data-theme='dark'] { --bg: #0c0f14; --panel: #151a22; --panel2: #1c222c; --line: #262d39; --tx: #eef1f6; --mut: #8b95a7; color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--tx); font: 400 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }
      .wrap { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 32px); }
      .top { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .logo { display: inline-block; width: 34px; height: 34px; flex: none; } .logo svg { width: 100%; height: 100%; display: block; }
      .top h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; } .top h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--mut); }
      .top .sp { flex: 1; }
      .ghost { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; height: 36px; padding: 0 12px; font-weight: 600; font-size: 13px; }
      .card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
      .card h2 { font-size: 15px; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
      .card h2 .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px; display: grid; place-items: center; flex: none; }
      .muted { color: var(--mut); } .small { font-size: 13px; }
      .in { width: 100%; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel2); padding: 0 12px; font-size: 16px; outline: none; }
      .in:focus { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
      .meter { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .meter > div { background: var(--panel2); border-radius: 12px; padding: 10px 12px; }
      .meter small { display: block; font-size: 12px; color: var(--mut); }
      .meter b { font: 500 17px var(--mono); }
      .bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 6px; overflow: hidden; }
      .bar i { display: block; height: 100%; background: var(--brand); border-radius: 3px; transition: width .3s; }
      .bar i.hi { background: var(--warn); } .bar i.full { background: var(--dn); }
      .res { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
      .pl { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); }
      .pl.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); background: color-mix(in srgb, var(--brand) 8%, var(--panel)); }
      .av { width: 34px; height: 34px; border-radius: 50%; background: color-mix(in srgb, var(--brand) 18%, var(--panel2)); color: var(--brand); display: grid; place-items: center; font-weight: 700; flex: none; text-transform: uppercase; }
      .pl .t { display: flex; flex-direction: column; min-width: 0; text-align: left; } .pl b { font-size: 14.5px; } .pl small { font-size: 12.5px; color: var(--mut); }
      .picked { display: flex; align-items: center; gap: 10px; }
      .picked .x { margin-left: auto; }
      .tabs { display: flex; gap: 4px; background: var(--panel2); padding: 4px; border-radius: 12px; margin-bottom: 12px; }
      .tabs button { flex: 1; height: 36px; border: 0; border-radius: 9px; background: none; font-weight: 600; font-size: 14px; color: var(--mut); }
      .tabs button.on { background: var(--panel); color: var(--tx); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; }
      .chip { height: 40px; min-width: 64px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); font: 500 15px var(--mono); }
      .chip.on { border-color: var(--brand); background: color-mix(in srgb, var(--brand) 12%, var(--panel)); color: var(--brand); }
      .chip:disabled { opacity: .35; cursor: not-allowed; }
      .items { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 6px; max-height: 330px; overflow-y: auto; padding: 2px; }
      .it { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); text-align: center; }
      .it.on { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
      .it small { font-size: 11.5px; line-height: 1.2; }
      .ia { width: 48px; height: 48px; background: var(--spr) no-repeat; background-size: calc(48px * 6) auto; background-position: calc(var(--x) * -48px) calc(var(--y) * -48px); border-radius: 10px; flex: none; }
      .go { width: 100%; height: 52px; border: 0; border-radius: 14px; background: var(--brand); color: #fff; font-weight: 700; font-size: 16px; margin-top: 4px; box-shadow: 0 8px 22px -10px var(--brand); }
      .go:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
      .sum { margin: 12px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--panel2); font-size: 14px; }
      .err { color: var(--dn); font-size: 13.5px; min-height: 1.2em; margin-top: 8px; }
      .log { display: flex; flex-direction: column; } .log > div { display: flex; gap: 10px; align-items: baseline; padding: 8px 0; border-top: 1px solid var(--line); font-size: 14px; } .log > div:first-child { border-top: 0; }
      .log time { margin-left: auto; font-size: 12px; color: var(--mut); white-space: nowrap; }
      .rules { font-size: 13px; color: var(--mut); margin: 0; padding-left: 18px; } .rules li { margin: 2px 0; }
      .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 20px); transform: translateX(-50%); z-index: 50; padding: 12px 16px; border-radius: 12px; background: var(--tx); color: var(--bg); font-weight: 600; font-size: 14px; max-width: calc(100vw - 32px); box-shadow: 0 10px 30px rgba(0, 0, 0, .25); animation: tIn .2s ease-out; }
      .toast.err { background: var(--dn); color: #fff; }
      @keyframes tIn { from { opacity: 0; transform: translate(-50%, 8px); } }
      /* login */
      .login { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 16px; }
      .lcard { width: min(360px, 100%); text-align: center; }
      .lcard .logo { display: block; width: 56px; height: 56px; margin: 0 auto 10px; }
      .lcard h1 { margin: 0; font-size: 22px; } .lcard p { margin: 4px 0 18px; color: var(--mut); }
      .pin { display: flex; gap: 8px; justify-content: center; position: relative; margin-bottom: 8px; }
      .pin i { width: 42px; height: 52px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; }
      .pin i.on::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--tx); }
      .pin i.cur { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 20%, transparent); }
      .pin input { position: absolute; inset: 0; opacity: 0; width: 100%; font-size: 16px; caret-color: transparent; border: 0; }
      .pin.shake { animation: shk .35s; } @keyframes shk { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
      .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; }
      .pad button { height: 54px; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); font-size: 20px; font-weight: 600; }
      .pad button.fn { font-size: 14px; color: var(--mut); }
      .lfoot { margin-top: 16px; font-size: 13px; } .lfoot a { color: var(--mut); }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        'use strict';
        const API = 'https://amnbnuabxoxhggidlhcn.supabase.co/rest/v1/rpc/';
        const ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFtbmJudWFieG94aGdnaWRsaGNuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwMjc5ODAsImV4cCI6MjEwNTYwMzk4MH0.WwHTYzYEwKtW2_fjoyPiltnxI331-Ve5IGolTpavISo';
        const LOGO = "<svg viewBox=\"0 0 64 64\"><defs><linearGradient id=\"pbLgH\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\"><stop offset=\"0\" stop-color=\"#ffb52e\"/><stop offset=\"1\" stop-color=\"#ff5e1a\"/></linearGradient></defs><rect width=\"64\" height=\"64\" rx=\"15\" fill=\"url(#pbLgH)\"/><path d=\"M13.5 14.5c.6 8.4 5.6 12.5 12.5 12.5h12c6.9 0 11.9-4.1 12.5-12.5\" stroke=\"#fff\" stroke-width=\"5.2\" fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path d=\"M21.2 25.5h21.6l-3.6 18.2c-1 4.9-3.8 7.8-7.2 7.8s-6.2-2.9-7.2-7.8z\" fill=\"#fff\"/><path d=\"M28.3 30.5v13.5M35.7 27.5v12.5\" stroke=\"#16c784\" stroke-width=\"1.5\" stroke-linecap=\"round\"/><rect x=\"26.5\" y=\"33\" width=\"3.6\" height=\"8.5\" rx=\"1.3\" fill=\"#16c784\"/><rect x=\"33.9\" y=\"29.8\" width=\"3.6\" height=\"8\" rx=\"1.3\" fill=\"#16c784\"/></svg>";
        const ITEMS = [{"k": "pu_xp", "n": "XP Booster", "t": "power", "d": "2\u00d7 XP for 15 minutes.", "i": 0}, {"k": "pu_refresh", "n": "Pack Refresh", "t": "power", "d": "Makes your free pack ready right now.", "i": 1}, {"k": "pu_streak", "n": "Streak Saver", "t": "power", "d": "Keeps your login streak alive if you miss a day. Used automatically.", "i": 2}, {"k": "egg_speckled", "n": "Speckled Egg", "t": "egg", "d": "The cheapest egg. Almost always a Common pet.", "i": 3}, {"k": "egg_c", "n": "Pet Egg", "t": "egg", "d": "Mostly Common pets. Rare if you\u2019re lucky.", "i": 4}, {"k": "tr_snack", "n": "Snack", "t": "treat", "d": "+30 happiness.", "i": 5}, {"k": "tr_toy", "n": "Squeaky Toy", "t": "treat", "d": "+55 happiness.", "i": 6}, {"k": "tr_apple", "n": "Apple", "t": "treat", "d": "+20 happiness.", "i": 7}, {"k": "tr_bone", "n": "Chew Bone", "t": "treat", "d": "+40 happiness.", "i": 8}, {"k": "av_bull", "n": "Bull", "t": "avatar", "d": "", "i": 9}, {"k": "av_bear", "n": "Bear", "t": "avatar", "d": "", "i": 10}, {"k": "av_fox", "n": "Fox", "t": "avatar", "d": "", "i": 11}, {"k": "av_frog", "n": "Frog", "t": "avatar", "d": "", "i": 12}, {"k": "av_cowboy", "n": "Cowboy", "t": "avatar", "d": "", "i": 13}, {"k": "av_panda", "n": "Panda", "t": "avatar", "d": "", "i": 14}, {"k": "av_koala", "n": "Koala", "t": "avatar", "d": "", "i": 15}, {"k": "av_chef", "n": "Chef", "t": "avatar", "d": "", "i": 16}, {"k": "av_pirate", "n": "Pirate", "t": "avatar", "d": "", "i": 17}, {"k": "th_amber", "n": "Amber", "t": "theme", "d": "", "i": 18}, {"k": "th_mint", "n": "Mint", "t": "theme", "d": "", "i": 19}, {"k": "th_lime", "n": "Lime", "t": "theme", "d": "", "i": 20}, {"k": "th_coral", "n": "Coral", "t": "theme", "d": "", "i": 21}, {"k": "th_sky", "n": "Sky", "t": "theme", "d": "", "i": 22}, {"k": "th_peach", "n": "Peach", "t": "theme", "d": "", "i": 23}, {"k": "sk_classic", "n": "Classic", "t": "skin", "d": "", "i": 24}, {"k": "sk_retro", "n": "Retro Terminal", "t": "skin", "d": "", "i": 25}, {"k": "sk_sunset", "n": "Sunset", "t": "skin", "d": "", "i": 26}, {"k": "sk_forest", "n": "Forest Floor", "t": "skin", "d": "", "i": 27}, {"k": "sk_berry", "n": "Berry", "t": "skin", "d": "", "i": 28}]; // the only items a helper can ever give (the server checks this list too)
        const COLS = 6;
        const IT = {};
        ITEMS.forEach(i => (IT[i.k] = i));
        const $ = (s, r = document) => r.querySelector(s),
          $$ = (s, r = document) => [...r.querySelectorAll(s)];
        const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
        const num = n => (+n || 0).toLocaleString('en-US');
        const ERR = {
          bad_code: 'Wrong code.',
          locked: 'Too many wrong codes. Try again in 15 minutes.',
          helper_auth: 'You were signed out. Enter your code again.',
          disabled: 'This helper account is turned off.',
          no_user: 'Couldn’t find that player.',
          over_gift: 'That’s more than a helper can give at once.',
          day_gifts: 'You’ve used all your gifts for today. More tomorrow!',
          day_coins: 'You’ve given all the coins you can today.',
          day_xp: 'You’ve given all the XP you can today.',
          same_player: 'You already gave this player a gift today.',
          bad_item: 'Helpers can’t give that item.',
          bad_kind: 'Pick coins, XP or an item.',
          self_gift: 'You can’t gift your own game account.',
          network: 'Can’t reach the server. Check your internet.',
          not_ready: 'The helper panel isn’t switched on yet. Ask the owner.',
          too_long: 'That message is too long.',
        };
        async function rpc(fn, args = {}) {
          let r;
          try {
            r = await fetch(API + fn, { method: 'POST', headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
          } catch (e) {
            throw Object.assign(new Error(ERR.network), { code: 'network' });
          }
          const t = await r.text();
          let j = null;
          try {
            j = t ? JSON.parse(t) : null;
          } catch (e) {}
          if (!r.ok) {
            let code = (j && j.message) || 'error';
            if (r.status === 404 || (j && /PGRST202|Could not find the function/.test((j.code || '') + (j.message || '')))) code = 'not_ready';
            if (code === 'helper_auth') setTimeout(() => signOut(true), 0);
            throw Object.assign(new Error(ERR[code] || 'Something went wrong (' + code + ')'), { code, left: j && j.details && /^\d+$/.test(j.details) ? +j.details : null });
          }
          if (j && j.error) throw Object.assign(new Error(ERR[j.error] || j.error), { code: j.error, left: j.left });
          return j;
        }
        const S = { token: null, me: null, kind: 'coins', amount: 0, item: null, user: null };
        try {
          S.token = sessionStorage.getItem('pbh.t');
        } catch (e) {}
        const H = (fn, a = {}) => rpc(fn, Object.assign({ p_token: S.token }, a));
        function toast(msg, kind) {
          $$('.toast').forEach(t => t.remove());
          const t = document.createElement('div');
          t.className = 'toast ' + (kind || '');
          t.setAttribute('role', 'status');
          t.textContent = msg;
          document.body.appendChild(t);
          setTimeout(() => t.remove(), kind === 'err' ? 4500 : 2800);
        }
        const art = k => (IT[k] ? `<span class="ia" style="--x:${IT[k].i % COLS};--y:${Math.floor(IT[k].i / COLS)}"></span>` : '');

        /* ---------- sign in ---------- */
        const LEN = 6;
        function login() {
          const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'];
          $('#root').innerHTML = `<div class="login"><form class="lcard" id="lf" autocomplete="off"><span class="logo">${LOGO}</span><h1>Helper</h1><p>Enter your ${LEN}-digit helper code</p>
            <label class="pin" id="pin">${Array.from({ length: LEN }, () => '<i></i>').join('')}<input id="code" inputmode="numeric" pattern="[0-9]*" maxlength="${LEN}" autocomplete="one-time-code" aria-label="Helper code"></label>
            <div class="err" id="le" role="alert"></div>
            <div class="pad" id="pad">${keys.map(k => `<button type="button" data-k="${k}" class="${k.length > 1 ? 'fn' : ''}" aria-label="${k === 'del' ? 'Delete' : k === 'clr' ? 'Clear' : k}">${k === 'del' ? '⌫' : k === 'clr' ? 'Clear' : k}</button>`).join('')}</div>
            <div class="lfoot"><a href="./">Back to the game</a></div></form></div>`;
          const inp = $('#code'),
            pin = $('#pin'),
            er = $('#le');
          let busy = false;
          const paint = () => $$('#pin i').forEach((d, i) => (d.classList.toggle('on', i < inp.value.length), d.classList.toggle('cur', i === inp.value.length && document.activeElement === inp)));
          const go = async () => {
            if (busy || inp.value.length !== LEN) return;
            busy = true;
            er.textContent = '';
            try {
              const r = await rpc('pbh_login', { p_code: inp.value });
              S.token = r.token;
              try {
                sessionStorage.setItem('pbh.t', r.token);
              } catch (e) {}
              await start();
            } catch (e) {
              pin.classList.remove('shake');
              void pin.offsetWidth;
              pin.classList.add('shake');
              er.textContent = e.code === 'bad_code' && e.left != null ? `Wrong code. ${e.left} ${e.left === 1 ? 'try' : 'tries'} left.` : e.message;
              inp.value = '';
              paint();
              inp.focus();
            }
            busy = false;
          };
          inp.oninput = () => {
            inp.value = inp.value.replace(/\D/g, '').slice(0, LEN);
            paint();
            if (inp.value.length === LEN) go();
          };
          inp.onfocus = inp.onblur = paint;
          $('#pad').onclick = e => {
            const k = e.target.closest('button')?.dataset.k;
            if (!k || busy) return;
            if (k === 'del') inp.value = inp.value.slice(0, -1);
            else if (k === 'clr') inp.value = '';
            else if (inp.value.length < LEN) inp.value += k;
            inp.dispatchEvent(new Event('input'));
          };
          $('#lf').onsubmit = e => (e.preventDefault(), go());
          paint();
          setTimeout(() => inp.focus(), 50);
        }
        function signOut(expired) {
          const t = S.token;
          S.token = null;
          try {
            sessionStorage.removeItem('pbh.t');
          } catch (e) {}
          if (t && !expired) rpc('pbh_logout', { p_token: t }).catch(() => {});
          login();
          if (expired) toast(ERR.helper_auth, 'err');
        }

        /* ---------- the panel ---------- */
        async function start() {
          S.me = await H('pbh_me');
          S.user = null;
          S.kind = 'coins';
          S.amount = 0;
          S.item = null;
          panel();
        }
        const cfg = () => S.me.cfg;
        const today = () => S.me.today || { gifts: 0, coins: 0, xp: 0 };
        function panel() {
          const c = cfg();
          $('#root').innerHTML = `<div class="wrap">
            <div class="top"><span class="logo">${LOGO}</span><h1>PAPERBULL Helper<small>Signed in as ${esc(S.me.name)}</small></h1><span class="sp"></span><button class="ghost" id="out">Sign out</button></div>
            <div class="card"><div class="meter" id="meter"></div></div>
            <div class="card"><h2><span class="n">1</span>Who gets it?</h2>
              <div id="who"></div></div>
            <div class="card"><h2><span class="n">2</span>What to give</h2>
              <div class="tabs" id="tabs">${[['coins', 'Coins'], ['xp', 'XP'], ['item', 'Item']].map(([k, l]) => `<button type="button" data-k="${k}">${l}</button>`).join('')}</div>
              <div id="what"></div>
              <input class="in" id="msg" maxlength="100" placeholder="Message (optional)" style="margin-top:12px">
              <div class="sum" id="sum"></div>
              <div class="err" id="gerr" role="alert"></div>
              <button class="go" id="give">Give gift</button></div>
            <div class="card"><h2>Your gifts today</h2><div class="log" id="log"><span class="muted small">Loading…</span></div></div>
            <div class="card"><h2>Helper rules</h2><ul class="rules">
              <li>Up to ${num(c.coin_max)} coins or ${num(c.xp_max)} XP per gift, or one basic item.</li>
              <li>${num(c.gifts_day)} gifts a day, ${num(c.coins_day)} coins a day in total.</li>
              ${c.one_per_player ? '<li>Each player can get one helper gift a day.</li>' : ''}
              <li>No cash, rare pets or bans. The owner sees every gift you give.</li></ul></div></div>`;
          $('#out').onclick = () => signOut();
          $('#tabs').onclick = e => {
            const b = e.target.closest('[data-k]');
            if (!b) return;
            S.kind = b.dataset.k;
            S.amount = 0;
            S.item = null;
            paintWhat();
          };
          $('#give').onclick = give;
          paintMeter();
          paintWho();
          paintWhat();
          loadLog();
        }
        function paintMeter() {
          const c = cfg(),
            t = today();
          const cell = (label, used, max) => {
            const p = max ? Math.min(100, (used / max) * 100) : 100;
            return `<div><small>${label}</small><b>${num(Math.max(0, max - used))}</b> <span class="muted small">left of ${num(max)}</span><div class="bar"><i class="${p >= 100 ? 'full' : p >= 75 ? 'hi' : ''}" style="width:${p}%"></i></div></div>`;
          };
          $('#meter').innerHTML = cell('Gifts today', t.gifts, c.gifts_day) + cell('Coins today', t.coins, c.coins_day);
        }
        let seq = 0;
        function paintWho() {
          const box = $('#who');
          if (S.user) {
            box.innerHTML = `<div class="pl on picked"><span class="av">${esc((S.user.name || S.user.username)[0])}</span><span class="t"><b>${esc(S.user.name || S.user.username)}</b><small>@${esc(S.user.username)} · level ${num(S.user.level)}</small></span><button class="ghost x" id="chg">Change</button></div>`;
            $('#chg').onclick = () => ((S.user = null), paintWho(), paintSum(), $('#q').focus());
            return paintSum();
          }
          box.innerHTML = `<input class="in" id="q" placeholder="Search a player’s username" autocomplete="off" autocapitalize="off" spellcheck="false"><div class="res" id="res"></div>`;
          let rows = [];
          const q = $('#q');
          let tm;
          q.oninput = () => {
            clearTimeout(tm);
            const v = q.value.trim();
            if (v.length < 2) return ($('#res').innerHTML = v ? '<span class="muted small">Type at least 2 letters</span>' : '');
            tm = setTimeout(async () => {
              const my = ++seq;
              try {
                rows = (await H('pbh_find', { p_q: v })) || [];
              } catch (e) {
                rows = [];
                if (my === seq) $('#res').innerHTML = `<span class="err">${esc(e.message)}</span>`;
                return;
              }
              if (my !== seq || !$('#res')) return;
              $('#res').innerHTML = rows.length ? rows.map((u, i) => `<button type="button" class="pl" data-i="${i}"><span class="av">${esc((u.name || u.username)[0])}</span><span class="t"><b>${esc(u.name || u.username)}</b><small>@${esc(u.username)} · level ${num(u.level)}</small></span></button>`).join('') : '<span class="muted small">No players found</span>';
            }, 250);
          };
          $('#res').onclick = e => {
            const b = e.target.closest('[data-i]');
            if (!b) return;
            S.user = rows[+b.dataset.i];
            paintWho();
          };
          paintSum();
        }
        function paintWhat() {
          const c = cfg(),
            t = today(),
            box = $('#what');
          $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.k === S.kind));
          if (S.kind === 'coins' || S.kind === 'xp') {
            const max = S.kind === 'coins' ? Math.min(c.coin_max, Math.max(0, c.coins_day - t.coins)) : c.xp_max;
            const opts = (S.kind === 'coins' ? [25, 50, 100, 250, 500, 1000] : [50, 100, 250, 500, 1000]).filter(v => v <= (S.kind === 'coins' ? c.coin_max : c.xp_max));
            box.innerHTML = `<div class="chips">${opts.map(v => `<button type="button" class="chip${S.amount === v ? ' on' : ''}" data-a="${v}" ${v > max ? 'disabled' : ''}>${num(v)}</button>`).join('')}</div>
              <p class="muted small" style="margin:8px 0 0">${S.kind === 'coins' ? `Max ${num(c.coin_max)} coins per gift` : `Max ${num(c.xp_max)} XP per gift`}${S.kind === 'coins' && max < c.coin_max ? ` · ${num(max)} left today` : ''}</p>`;
            box.querySelector('.chips').onclick = e => {
              const b = e.target.closest('[data-a]');
              if (!b || b.disabled) return;
              S.amount = +b.dataset.a;
              paintWhat();
            };
          } else {
            const list = ITEMS.filter(i => (c.items || []).includes(i.k));
            box.innerHTML = list.length
              ? `<div class="items">${list.map(i => `<button type="button" class="it${S.item === i.k ? ' on' : ''}" data-it="${i.k}" title="${esc(i.d || i.n)}">${art(i.k)}<small>${esc(i.n)}</small></button>`).join('')}</div>`
              : '<p class="muted small">The owner hasn’t turned on any items for helpers.</p>';
            const g = box.querySelector('.items');
            if (g)
              g.onclick = e => {
                const b = e.target.closest('[data-it]');
                if (!b) return;
                S.item = b.dataset.it;
                paintWhat();
              };
          }
          paintSum();
        }
        const what = () => (S.kind === 'item' ? (S.item ? IT[S.item].n : '') : S.amount ? `${num(S.amount)} ${S.kind === 'coins' ? 'coins' : 'XP'}` : '');
        function paintSum() {
          const w = what(),
            ok = S.user && w && today().gifts < cfg().gifts_day;
          const s = $('#sum');
          if (!s) return;
          s.innerHTML = today().gifts >= cfg().gifts_day ? '<b>You’ve used all your gifts for today.</b> More tomorrow!' : `${S.user ? `<b>@${esc(S.user.username)}</b>` : '<span class="muted">Pick a player</span>'} ${w ? `gets <b>${esc(w)}</b>` : '<span class="muted">· pick a gift</span>'}`;
          $('#give').disabled = !ok;
        }
        let giving = false;
        async function give() {
          if (giving || !S.user || !what()) return;
          giving = true;
          const b = $('#give');
          b.disabled = true;
          b.textContent = 'Giving…';
          $('#gerr').textContent = '';
          try {
            const r = await H('pbh_give', { p_user: S.user.id, p_kind: S.kind, p_amount: S.kind === 'item' ? null : S.amount, p_item_id: S.kind === 'item' ? S.item : null, p_message: $('#msg').value.trim() || null });
            toast(`Sent ${what()} to @${S.user.username}!`);
            if (r && r.today) S.me.today = r.today;
            S.user = null;
            S.amount = 0;
            S.item = null;
            $('#msg').value = '';
            paintMeter();
            paintWho();
            paintWhat();
            loadLog();
          } catch (e) {
            $('#gerr').textContent = e.message;
          }
          b.textContent = 'Give gift';
          giving = false;
          paintSum();
        }
        async function loadLog() {
          const box = $('#log');
          try {
            const L = (await H('pbh_log')) || [];
            if (!$('#log')) return;
            box.innerHTML = L.length ? L.map(x => `<div><span>@${esc(x.username)} got <b>${esc(x.what)}</b></span><time>${new Date(x.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</time></div>`).join('') : '<span class="muted small">Nothing yet today.</span>';
          } catch (e) {
            box.innerHTML = `<span class="muted small">${esc(e.message)}</span>`;
          }
        }
        (async () => {
          if (S.token) {
            try {
              return await start();
            } catch (e) {
              S.token = null;
              try {
                sessionStorage.removeItem('pbh.t');
              } catch (e2) {}
            }
          }
          login();
        })();
      })();
    </script>
  </body>
</html>
