      :root {
        --bg: #f5f6f9;
        --panel: #fff;
        --panel2: #f3f4f8;
        --line: #e7e8ef;
        --line2: #d9dbe6;
        --tx: #151827;
        --mut: #61677c;
        --dim: #9aa0b2;
        --brand: #f06a0f;
        --brand-d: #d95d08;
        --brand-soft: #fff1e3;
        --up: #0f9f76;
        --up-soft: #e3f6ef;
        --dn: #e5484d;
        --dn-soft: #fdeceb;
        --warn: #c27c0e;
        --warn-soft: #fdf3dc;
        --info: #2f6fe4;
        --info-soft: #e7effd;
        --shadow: 0 1px 2px rgba(16, 20, 40, 0.05), 0 6px 20px -12px rgba(16, 20, 40, 0.18);
        --r: 14px;
        --sans: 'PB Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: 'PB Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --c1: #f07a12;
        --c2: #0f9f76;
        --c3: #7c5cff;
        --c4: #2f6fe4;
        --c5: #d9467a;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #07070b;
        --panel: #111116;
        --panel2: #18181f;
        --line: rgba(255, 255, 255, 0.075);
        --line2: rgba(255, 255, 255, 0.13);
        --tx: #f3f4f8;
        --mut: #8f94a5;
        --dim: #5c6173;
        --brand: #ff9a26;
        --brand-d: #ff7a14;
        --brand-soft: rgba(255, 150, 40, 0.12);
        --up: #22d67a;
        --up-soft: rgba(34, 214, 122, 0.12);
        --dn: #ff5b4f;
        --dn-soft: rgba(255, 91, 79, 0.13);
        --warn: #ffc043;
        --warn-soft: rgba(255, 192, 67, 0.13);
        --info: #6d9eff;
        --info-soft: rgba(109, 158, 255, 0.13);
        --shadow: 0 14px 34px -24px rgba(0, 0, 0, 0.9);
        --c1: #ff9a26;
        --c2: #22d67a;
        --c3: #9d7bff;
        --c4: #6d9eff;
        --c5: #ff5b8a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font: 14px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--brand);
      }
      a.btn {
        text-decoration: none;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--mut);
      }
      .small {
        font-size: 12.5px;
      }
      svg.i {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- auth ---------- */
      .auth {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(900px 400px at 50% -120px, var(--brand-soft), transparent 70%), var(--bg);
      }
      .auth-card {
        width: min(400px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px;
        box-shadow: var(--shadow);
      }
      .auth-card h1 {
        margin: 14px 0 4px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .auth-card p {
        margin: 0 0 18px;
        color: var(--mut);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .logo .mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: block;
        overflow: hidden;
        flex: none;
        box-shadow: 0 4px 12px -4px rgba(65, 34, 201, 0.5);
      }
      .logo .mark svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .logo small {
        font-weight: 700;
        color: var(--mut);
        font-size: 11px;
        border: 1px solid var(--line2);
        border-radius: 6px;
        padding: 1px 6px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      label.f {
        display: block;
        margin-bottom: 12px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--mut);
      }
      label.f > span {
        display: block;
        margin-bottom: 5px;
      }
      .in,
      select.in,
      textarea.in {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line2);
        border-radius: 10px;
        background: var(--panel);
        padding: 0 12px;
        outline: 0;
        color: var(--tx);
        font-size: 14px;
      }
      textarea.in {
        height: auto;
        min-height: 90px;
        padding: 10px 12px;
        resize: vertical;
        line-height: 1.5;
      }
      .in:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      .err {
        color: var(--dn);
        font-size: 13px;
        min-height: 18px;
        margin: 4px 0 8px;
      }

      /* ---------- buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--line2);
        background: var(--panel);
        color: var(--tx);
        font-weight: 650;
        font-size: 13.5px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover {
        background: var(--panel2);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.pri {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .btn.pri:hover {
        background: var(--brand-d);
      }
      .btn.dan {
        background: var(--dn);
        border-color: var(--dn);
        color: #fff;
      }
      .btn.dan:hover {
        filter: brightness(0.95);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--panel2);
      }
      .btn.sm {
        height: 30px;
        padding: 0 10px;
        font-size: 12.5px;
        border-radius: 8px;
      }
      .btn.block {
        width: 100%;
        height: 42px;
      }
      .btn.icon {
        width: 36px;
        padding: 0;
      }
      .btn.sm.icon {
        width: 30px;
      }

      /* ---------- layout ---------- */
      .app {
        display: grid;
        grid-template-columns: 248px 1fr;
        min-height: 100%;
      }
      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        z-index: 40;
      }
      .side .logo {
        padding: 4px 8px 18px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: auto;
        flex: 1;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        border-radius: 10px;
        color: var(--mut);
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        position: relative;
      }
      .nav a:hover {
        background: var(--panel2);
        color: var(--tx);
      }
      .nav a.on {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .nav a.on::before {
        content: '';
        position: absolute;
        left: -12px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--brand);
      }
      .nav .sec {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 14px 12px 6px;
      }
      .nav .cnt {
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        background: var(--dn);
        color: #fff;
        border-radius: 8px;
        padding: 0 6px;
      }
      .me {
        border-top: 1px solid var(--line);
        padding: 12px 6px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand);
        display: grid;
        place-items: center;
        font-weight: 800;
        flex: none;
        text-transform: uppercase;
      }
      .me b {
        display: block;
        font-size: 13.5px;
      }
      .me .role {
        font-size: 11.5px;
      }
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .search {
        position: relative;
        flex: 1;
        max-width: 520px;
      }
      .search .in {
        padding-left: 38px;
        height: 38px;
        background: var(--panel);
      }
      .search svg {
        position: absolute;
        left: 12px;
        top: 10px;
        color: var(--dim);
      }
      .search kbd {
        position: absolute;
        right: 10px;
        top: 9px;
        font: 11px var(--mono);
        color: var(--dim);
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 1px 5px;
      }
      .top .sp {
        flex: 1;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 13px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .pill i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .p-ok {
        background: var(--up-soft);
        color: var(--up);
      }
      .p-dn {
        background: var(--dn-soft);
        color: var(--dn);
      }
      .p-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .p-info {
        background: var(--info-soft);
        color: var(--info);
      }
      .p-mut {
        background: var(--panel2);
        color: var(--mut);
      }
      .p-brand {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .burger {
        display: none;
      }
      .view {
        padding: 24px;
        max-width: 1360px;
        width: 100%;
        margin: 0 auto;
      }
      .ph {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .ph h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .ph p {
        margin: 4px 0 0;
        color: var(--mut);
      }
      .ph .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---------- cards, kpis ---------- */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 18px;
        min-width: 0;
      }
      .card + .card {
        margin-top: 16px;
      }
      .card-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .card-h h3 {
        margin: 0;
        font-size: 15px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .kpi small {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mut);
        font-weight: 650;
        font-size: 12.5px;
      }
      .kpi small .ic {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand);
      }
      .kpi b {
        display: block;
        font-size: 26px;
        letter-spacing: -0.02em;
        margin: 10px 0 2px;
        font-weight: 750;
      }
      .kpi em {
        font-style: normal;
        font-size: 12.5px;
        color: var(--mut);
      }
      .kpi em .up {
        color: var(--up);
        font-weight: 700;
      }
      .kpi.c2 small .ic {
        background: var(--up-soft);
        color: var(--up);
      }
      .kpi.c3 small .ic {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .kpi.c4 small .ic {
        background: var(--info-soft);
        color: var(--info);
      }
      .kpi.c5 small .ic {
        background: var(--dn-soft);
        color: var(--dn);
      }

      /* ---------- tables ---------- */
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .tools .in {
        height: 36px;
        width: auto;
        min-width: 200px;
        flex: 1;
        max-width: 320px;
      }
      .tools select.in {
        min-width: 140px;
        flex: none;
      }
      .tabs {
        display: inline-flex;
        background: var(--panel2);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 0;
        background: transparent;
        padding: 6px 12px;
        border-radius: 8px;
        font-weight: 650;
        font-size: 13px;
        color: var(--mut);
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--panel);
        color: var(--tx);
        box-shadow: 0 1px 2px rgba(16, 20, 40, 0.12);
      }
      .tw {
        overflow-x: auto;
        margin: 0 -18px;
        padding: 0 18px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        font-weight: 750;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        user-select: none;
      }
      th.s {
        cursor: pointer;
      }
      th.s:hover {
        color: var(--tx);
      }
      th.s::after {
        content: '';
        display: inline-block;
        width: 0;
        height: 0;
        margin-left: 6px;
        border: 4px solid transparent;
        vertical-align: 1px;
        opacity: 0.35;
        border-top-color: currentColor;
        border-bottom: 0;
      }
      th.s.asc::after {
        border-top: 0;
        border-bottom: 4px solid currentColor;
        opacity: 1;
      }
      th.s.desc::after {
        opacity: 1;
      }
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr.click {
        cursor: pointer;
      }
      tbody tr.click:hover td {
        background: var(--panel2);
      }
      td.r,
      th.r {
        text-align: right;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .who .av {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
      .who b {
        display: block;
        font-size: 13.5px;
      }
      .who small {
        color: var(--mut);
        font-size: 12px;
      }
      .pos {
        color: var(--up);
      }
      .neg {
        color: var(--dn);
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
        color: var(--mut);
        font-size: 13px;
      }
      .pager .btns {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .empty {
        text-align: center;
        color: var(--mut);
        padding: 32px 12px;
      }
      .loading {
        padding: 30px;
        text-align: center;
        color: var(--mut);
      }
      .skel {
        height: 14px;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--panel2), var(--line), var(--panel2));
        background-size: 200% 100%;
        animation: sk 1.2s infinite;
      }
      @keyframes sk {
        to {
          background-position: -200% 0;
        }
      }

      /* ---------- charts ---------- */
      .chart {
        width: 100%;
        height: 220px;
        position: relative;
      }
      .chart svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .chart .grid line {
        stroke: var(--line);
        stroke-width: 1;
      }
      .chart .ax {
        fill: var(--dim);
        font: 10.5px var(--mono);
      }
      .chart .tip {
        position: absolute;
        pointer-events: none;
        background: var(--tx);
        color: var(--panel);
        font-size: 12px;
        padding: 6px 9px;
        border-radius: 8px;
        white-space: nowrap;
        transform: translate(-50%, -110%);
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 2;
      }
      .chart .tip b {
        font-family: var(--mono);
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--mut);
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }

      /* ---------- lists ---------- */
      .list {
        display: flex;
        flex-direction: column;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .li:last-child {
        border-bottom: 0;
      }
      .li .t {
        flex: 1;
        min-width: 0;
      }
      .li .t > b {
        display: block;
        font-size: 13.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .li .t small {
        color: var(--mut);
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }

      /* ---------- profile ---------- */
      .prof {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .prof .av {
        width: 56px;
        height: 56px;
        font-size: 20px;
      }
      .prof h2 {
        margin: 0;
        font-size: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .stat {
        background: var(--panel2);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .stat small {
        display: block;
        color: var(--mut);
        font-size: 11.5px;
        font-weight: 650;
      }
      .stat b {
        font-size: 16px;
      }
      .actbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .tl {
        position: relative;
        padding-left: 18px;
      }
      .tl::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--line);
      }
      .tl .e {
        position: relative;
        padding: 6px 0 10px;
      }
      .tl .e::before {
        content: '';
        position: absolute;
        left: -18px;
        top: 11px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--brand);
      }
      .tl .e b {
        font-size: 13px;
      }
      .tl .e small {
        display: block;
        color: var(--mut);
        font-size: 12px;
      }
      .kv {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 8px 12px;
        font-size: 13.5px;
      }
      .kv dt {
        color: var(--mut);
      }
      .kv dd {
        margin: 0;
        min-width: 0;
        word-break: break-word;
      }

      /* ---------- switches ---------- */
      .sw {
        position: relative;
        display: inline-block;
        vertical-align: middle;
        width: 42px;
        height: 24px;
        flex: none;
      }
      .sw input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: var(--line2);
        border-radius: 12px;
        transition: 0.18s;
        cursor: pointer;
      }
      .sw span::after {
        content: '';
        position: absolute;
        left: 3px;
        top: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: 0.18s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .sw input:checked + span {
        background: var(--up);
      }
      .sw input:checked + span::after {
        transform: translateX(18px);
      }
      .sw input:disabled + span {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .sto-steps {
        margin: 0 0 14px;
        padding-left: 20px;
        display: grid;
        gap: 8px;
        font-size: 13px;
        line-height: 1.5;
      }
      .sto-steps .mono {
        font-size: 12px;
        padding: 1px 5px;
        border-radius: 6px;
        background: var(--panel2);
        word-break: break-all;
      }
      .sto-live.on {
        border-color: color-mix(in srgb, var(--up) 45%, var(--line));
      }
      .qa {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 0 0 16px;
      }
      .qa-l {
        grid-column: 1 / -1;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mut);
      }
      .qa-l em {
        font-style: normal;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
      }
      .qa-b {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        column-gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--tx);
        font: inherit;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        transition: border-color 0.15s, transform 0.15s, background 0.15s;
      }
      .qa-b:hover {
        border-color: var(--brand);
        transform: translateY(-1px);
      }
      .qa-b .ni {
        grid-row: 1 / 3;
      }
      .qa-b b {
        font-size: 13.5px;
      }
      .qa-b small {
        font-size: 11.5px;
        color: var(--mut);
      }
      @media (max-width: 900px) {
        .qa {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .live {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 10px 4px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel2);
        font-size: 12px;
      }
      .live i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--mut);
        flex: none;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      }
      .live[data-s='on'] i {
        background: #22c55e;
        animation: livePulse 2.4s ease-out infinite;
      }
      .live[data-s='off'] i {
        background: var(--warn);
      }
      .live.blip i {
        animation: liveBlip 0.9s ease-out;
      }
      .live b {
        display: block;
        font-size: 12px;
      }
      .live small {
        display: block;
        color: var(--mut);
        font-size: 11px;
        line-height: 1.25;
      }
      @keyframes livePulse {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
        70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      @keyframes liveBlip {
        0% { transform: scale(1); background: #fff; }
        100% { transform: scale(1); }
      }
      .ovin {
        width: 110px;
        text-align: right;
        padding: 6px 8px;
      }
      .ovin.set {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      tr.off td {
        opacity: 0.55;
      }
      tr.off td:last-child {
        opacity: 1;
      }
      .feat {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .feat:last-child {
        border-bottom: 0;
      }
      .feat .t {
        flex: 1;
      }
      .feat b {
        display: block;
      }
      .feat small {
        color: var(--mut);
      }
      .danger-zone {
        border-color: color-mix(in srgb, var(--dn) 40%, var(--line));
      }
      .mbig {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border-radius: 12px;
        background: var(--panel2);
        margin-bottom: 12px;
      }
      .mbig.on {
        background: var(--dn-soft);
      }
      .mbig .t {
        flex: 1;
      }
      .mbig b {
        font-size: 16px;
      }

      /* ---------- modal + toast ---------- */
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 12, 22, 0.45);
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 16px;
        animation: fi 0.15s ease-out;
      }
      @keyframes fi {
        from {
          opacity: 0;
        }
      }
      .modal {
        width: min(520px, 100%);
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5);
        animation: mi 0.18s ease-out;
      }
      @keyframes mi {
        from {
          transform: translateY(8px) scale(0.98);
          opacity: 0;
        }
      }
      .modal.wide {
        width: min(760px, 100%);
      }
      .mh {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 20px 0;
      }
      .mh h3 {
        margin: 0;
        font-size: 17px;
        flex: 1;
      }
      .mb {
        padding: 14px 20px;
      }
      .mf {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 20px 18px;
        flex-wrap: wrap;
      }
      .warnbox {
        display: flex;
        gap: 10px;
        padding: 12px;
        border-radius: 10px;
        background: var(--dn-soft);
        color: var(--dn);
        font-size: 13px;
        margin-bottom: 12px;
      }
      .toasts {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, calc(100vw - 32px));
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--up);
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.35);
        animation: mi 0.2s ease-out;
        font-size: 13.5px;
      }
      .toast.err {
        border-left-color: var(--dn);
      }
      .toast svg {
        margin-top: 1px;
      }
      .toast.ok svg {
        color: var(--up);
      }
      .toast.err svg {
        color: var(--dn);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--brand-soft);
        color: var(--brand);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 12.5px;
        font-weight: 650;
      }
      .chip button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        line-height: 1;
      }
      .pick {
        position: relative;
      }
      .pick .drop {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        box-shadow: var(--shadow);
        z-index: 5;
        max-height: 220px;
        overflow: auto;
      }
      .pick .drop button {
        display: flex;
        width: 100%;
        gap: 10px;
        align-items: center;
        border: 0;
        background: none;
        padding: 8px 12px;
        text-align: left;
        cursor: pointer;
      }
      .pick .drop button:hover {
        background: var(--panel2);
      }
      .sr h4 {
        margin: 18px 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mut);
      }
      pre.json {
        margin: 0;
        font: 12px/1.5 var(--mono);
        background: var(--panel2);
        border-radius: 8px;
        padding: 8px 10px;
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 520px;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 1100px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 264px;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          box-shadow: 20px 0 40px rgba(0, 0, 0, 0.2);
        }
        .app.open .side {
          transform: none;
        }
        .scrim {
          position: fixed;
          inset: 0;
          background: rgba(10, 12, 22, 0.4);
          z-index: 35;
        }
        .burger {
          display: inline-flex;
        }
        .g2,
        .g3 {
          grid-template-columns: 1fr;
        }
        .top {
          padding: 10px 14px;
        }
        .view {
          padding: 16px 14px;
        }
        .search kbd {
          display: none;
        }
        .top .sp {
          display: none;
        }
        .search {
          max-width: none;
        }
      }
      @media (max-width: 560px) {
        .kpis {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .kpi {
          padding: 12px;
        }
        .kpi b {
          font-size: 21px;
        }
        .card {
          padding: 14px;
        }
        .tw {
          margin: 0 -14px;
          padding: 0 14px;
        }
        .ph h1 {
          font-size: 21px;
        }
        .tools .in {
          max-width: none;
          min-width: 0;
          width: 100%;
          flex-basis: 100%;
        }
        .top .role-pill {
          display: none;
        }
        .kv {
          grid-template-columns: 1fr;
        }
        .kv dt {
          margin-top: 6px;
        }
        .in,
        select.in,
        textarea.in {
          font-size: 16px;
        }
        .mf .btn {
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      /* ---------- PackVerse look ---------- */
      :root {
        --vg: linear-gradient(95deg, #ffb52e 0%, #ff6a1f 100%);
        --vglow: 0 8px 24px -8px rgba(255, 120, 30, 0.6);
      }

      /* ---------- v3 polish ---------- */
      @keyframes gFloat {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(18px, -22px) scale(1.08);
        }
      }
      @keyframes gShake {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(5px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-9px);
        }
        40%,
        60% {
          transform: translateX(9px);
        }
      }
      @keyframes gPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @keyframes gIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* code gate */
      .gate {
        position: relative;
        overflow: hidden;
      }
      .gate-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        animation: gFloat 14s ease-in-out infinite;
      }
      .gate-orb.o1 {
        width: 420px;
        height: 420px;
        background: rgba(255, 130, 30, 0.22);
        top: -140px;
        left: 50%;
        margin-left: -300px;
      }
      .gate-orb.o2 {
        width: 360px;
        height: 360px;
        background: rgba(122, 76, 255, 0.2);
        bottom: -120px;
        right: -80px;
        animation-delay: -6s;
      }
      .gate-card {
        position: relative;
        z-index: 1;
        max-width: 380px;
        text-align: center;
        padding: 34px 28px 24px;
        border-radius: 24px;
        backdrop-filter: blur(14px);
        box-shadow:
          0 30px 80px -30px rgba(0, 0, 0, 0.7),

      }
      .gate-logo .mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: inline-grid;
        place-items: center;
        box-shadow:
          0 14px 40px -10px rgba(255, 110, 30, 0.85),

      }
      .gate-logo .mark svg,
      .gate-logo .mark img {
        width: 100%;
        height: 100%;

      .gate-brand {
        margin-top: 14px;
        font-weight: 900;
        letter-spacing: 0.14em;
        font-size: 12px;
        color: var(--mut);
      }
      .gate-brand span {
        background: var(--vg);

        background-clip: text;
        color: transparent;
      }
      .gate-card h1 {
        margin: 10px 0 6px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .gate-card > p {
        margin: 0 0 20px;
      }
      .pin {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 0 auto 6px;
        cursor: text;
      }
      .pin input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        font-size: 16px;
        caret-color: transparent;
      }
      .pin i {
        width: 50px;
        height: 60px;
        border-radius: 14px;
        border: 1.5px solid var(--line);
        background: var(--panel2);
        display: grid;
        place-items: center;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          transform 0.15s;
      }
      .pin i::after {
        content: '';
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--vg);
        transform: scale(0);
        transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
        box-shadow: 0 0 14px rgba(255, 140, 40, 0.8);
      }
      .pin i.on::after {
        transform: scale(1);
      }
      .pin i.on {
        border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
      }
      .pin i.cur {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px var(--brand-soft);
        transform: translateY(-2px);
      }
      .pin.busy i::after {
        animation: gPulse 0.8s infinite;
      }
      .pin.ok i {
        border-color: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
      }
      .pin.ok i::after {
        background: #22c55e;
        box-shadow: 0 0 14px rgba(34, 197, 94, 0.8);
      }
      .pin.shake {
        animation: gShake 0.45s;
      }
      .pin.shake i {
        border-color: var(--dn, #ef4444);
      }
      .gate .err {

      .keypad button {

      .keypad button:hover {

      /* dashboard hero */
      .hero {

      /* KPI cards */
      .kpi {
        position: relative;
        overflow: hidden;
        transition:
          transform 0.18s,
          border-color 0.18s,
          box-shadow 0.18s;
        animation: gIn 0.4s ease both;
      }
      .kpi:nth-child(2) {
        animation-delay: 0.03s;
      }
      .kpi:nth-child(3) {
        animation-delay: 0.06s;
      }
      .kpi:nth-child(4) {
        animation-delay: 0.09s;
      }
      .kpi:nth-child(5) {
        animation-delay: 0.12s;
      }
      .kpi:nth-child(6) {
        animation-delay: 0.15s;
      }
      .kpi:nth-child(7) {
        animation-delay: 0.18s;
      }
      .kpi:nth-child(8) {
        animation-delay: 0.21s;
      }
      .kpi::before {
        content: '';

        inset: 0 0 auto 0;
        height: 2px;
        background: var(--vg);
        opacity: 0;
        transition: opacity 0.18s;

      .kpi b {

      .kspark {

      .kspark .a {

      }
      .kpi.c2 .kspark .l {
        stroke: #8b5cf6;
      }
      .kpi.c2 .kspark .a {
        fill: #8b5cf6;
      }
      .kpi.c4 .kspark .l {
        stroke: #22c55e;
      }
      .kpi.c4 .kspark .a {
        fill: #22c55e;
      }
      .kpi.c5 .kspark .l {
        stroke: #ec4899;
      }
      .kpi.c5 .kspark .a {
        fill: #ec4899;
      }

      /* headings, cards, tables, nav */
      .ph h1 {

      .card {

          .gate {

      /* nav tile icons */
      .ni {

      /* ================= v4: calm + simple ================= */
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --panel2: #f1f3f6;
        --line: #e6e8ee;
        --line2: #d6d9e1;
        --tx: #14161f;
        --mut: #5f6577;
        --dim: #9197a8;
        --brand: #e2640c;
        --brand-d: #c85708;
        --brand-soft: #fdf0e6;
        --shadow: 0 1px 2px rgba(16, 20, 40, 0.04);
        --r: 12px;
        --c1: #e2640c;
        --c2: #0f9f76;
        --c3: #7c5cff;
        --c4: #2f6fe4;
      }
      :root[data-theme='dark'] {
        --bg: #0c0d11;
        --panel: #14151b;
        --panel2: #1b1d24;
        --line: rgba(255, 255, 255, 0.07);
        --line2: rgba(255, 255, 255, 0.12);
        --tx: #eceef3;
        --mut: #9096a6;
        --dim: #62687a;
        --brand: #ff9a3c;
        --brand-d: #ff8a1f;
        --brand-soft: rgba(255, 154, 60, 0.12);
        --shadow: none;
        --c1: #ff9a3c;
        --c2: #34d399;
        --c3: #a78bfa;
        --c4: #60a5fa;
      }
      :root[data-theme='dark'] body,
      body {
        background: var(--bg);
        background-attachment: initial;
      }
      :root[data-theme='dark'] .card,
      :root[data-theme='dark'] .kpi,
      :root[data-theme='dark'] .modal,
      .card,
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .card:hover {
        border-color: var(--line);
      }
      .kpi,
      .view {
        animation: none;
      }
      .kpi::before {
        display: none;
      }
      .kpi:hover {
        transform: none;
        box-shadow: var(--shadow);
        border-color: var(--line);
      }
      a.kpi {
        display: block;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      a.kpi:hover {
        border-color: var(--line2);
      }
      .kpi small,
      .stat small,
      th,
      label.f > span {
        text-transform: none;
        letter-spacing: 0;
        font-size: 12.5px;
        font-weight: 600;
      }
      th {
        font-size: 12px;
      }
      .kpi small .ic,
      :root[data-theme='dark'] .kpi small .ic {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--panel2);
        color: var(--mut);
      }
      .kpi small .ic svg {
        width: 15px;
        height: 15px;
      }
      .kpi b {
        font-size: 28px;
        margin: 8px 0 2px;
        font-weight: 700;
      }
      .kpi em {
        color: var(--mut);
      }
      .ph h1 {
        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        color: var(--tx);
        font-size: 22px;
      }
      .ph {
        margin-bottom: 16px;
        align-items: center;

  /* ---------------- mutations ----------------
     Every mutation = a gradient-map recolor of the pet (SVG filter on the body only)
     + its own animated layers drawn INSIDE the pet's SVG:
       back  – behind the pet (auras, rays, wings, moons, flame rings)
       over  – masked to the pet's own silhouette (sheens, textures, goo, galaxies)
       front – on top, free (crystals, horns, halos, particles)
     `w` = roll weight, `mult` = perk multiplier (rarer = stronger).
     `bg`/`ink` = the mutation pill's look. */
  const MUTS = [
    { id: 'gold', name: 'Golden', mult: 1.5, c: '#ffc53d', w: 16, bg: 'linear-gradient(135deg,#fff3b0,#ffc53d 45%,#c98a00)', ink: '#3a2400' },

    { id: 'candy', name: 'Candy', mult: 1.4, c: '#ff9ed8', w: 12, bg: 'linear-gradient(135deg,#ffd1ee,#ff9ed8 40%,#a8e8ff)', ink: '#4a1040' },
    { id: 'sakura', name: 'Sakura', mult: 1.45, c: '#ff8ab8', w: 11, bg: 'linear-gradient(135deg,#fff0f6,#ffb3d1 45%,#e0508a)', ink: '#4a0a28' },
    { id: 'shadow', name: 'Shadow', mult: 1.5, c: '#9b5cff', w: 10, bg: 'linear-gradient(135deg,#6b3dcc,#2a1250 60%,#0a0418)', ink: '#e6d6ff' },

    { id: 'electric', name: 'Electric', mult: 1.55, c: '#4db8ff', w: 9, bg: 'linear-gradient(135deg,#e8fbff,#6fd0ff 40%,#1f5fff)', ink: '#020a33' },

    { id: 'pixel', name: '8-Bit', mult: 1.7, c: '#39ff88', w: 7, bg: 'linear-gradient(90deg,#39ff88 0 25%,#3de7ff 25% 50%,#ffe23d 50% 75%,#ff3d9a 75%)', ink: '#0a0a1a' },

    { id: 'lava', name: 'Molten', mult: 1.8, c: '#ff5a1a', w: 6, bg: 'linear-gradient(135deg,#ffcf3d,#ff5a1a 35%,#2a0c04 80%)', ink: '#ffe6c8' },
    { id: 'rainbow', name: 'Rainbow', mult: 2, c: '#ff7ae6', w: 5, bg: 'linear-gradient(90deg,#ff5e7e,#ffb13d,#fff36b,#6fff8a,#3de7ff,#8a7cff,#ff7ae6)', ink: '#1a0a24' },

    { id: 'aurora', name: 'Aurora', mult: 2.4, c: '#5cffc4', w: 3.5, bg: 'linear-gradient(120deg,#8affd6,#1affb0 30%,#3dc8ff 65%,#c08aff)', ink: '#021a14' },
    { id: 'diamond', name: 'Diamond', mult: 2.5, c: '#bff4ff', w: 3, bg: 'linear-gradient(135deg,#ffffff,#bff4ff 40%,#7ab8e0 70%,#ffffff)', ink: '#0a2a44' },
    { id: 'holo', name: 'Holographic', mult: 2.75, c: '#c8b8ff', w: 2.5, bg: 'linear-gradient(115deg,#ffd1f4,#d6fff6 30%,#fff6c2 50%,#c8d8ff 70%,#f0c8ff)', ink: '#2a2440' },
    { id: 'cosmic', name: 'Cosmic', mult: 3, c: '#7b6cff', w: 1.5, bg: 'radial-gradient(circle at 30% 30%,#ff7ae6,transparent 45%),linear-gradient(135deg,#3b2aff,#12083a)', ink: '#ffffff' },
    { id: 'solar', name: 'Solar', mult: 3.5, c: '#ffb31a', w: 1.2, bg: 'radial-gradient(circle at 50% 50%,#fffbe0,#ffd23d 40%,#ff6a00)', ink: '#3a1000' },
    { id: 'celestial', name: 'Celestial', mult: 4, c: '#fff1b0', w: 0.5, bg: 'linear-gradient(135deg,#ffffff,#fff1b0 45%,#e0b84d)', ink: '#3a2a00' },
    { id: 'void', name: 'Void', mult: 5, c: '#8a5cff', w: 0.3, bg: 'radial-gradient(circle at 50% 50%,#000 30%,#3a1a6b 60%,#ff8a3d)', ink: '#e6d6ff' },
  ];
  const MUT = Object.fromEntries(MUTS.map(m => [m.id, m]));

  /* ---- mutation art kit (u = unique id prefix for this copy) ---- */
  const r1 = v => Math.round(v * 10) / 10;
  const pt = (a, r, cx = 32, cy = 36) => [r1(cx + Math.cos((a * Math.PI) / 180) * r), r1(cy + Math.sin((a * Math.PI) / 180) * r)];
  const dl = (d, x = '') => `style="animation-delay:${d}s${x ? ';' + x : ''}"`;
  const hexs = (stops, i) => stops.map(h => (parseInt(h.slice(1 + i * 2, 3 + i * 2), 16) / 255).toFixed(3)).join(' ');
  const LUM = '<feColorMatrix type="matrix" values=".2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 .2126 .7152 .0722 0 0 0 0 0 1 0"/>';
  // gradient map: luminance → the mutation's palette (dark → light), optionally blended with the original colors
  // one filter on the pet's body: gradient-map recolor + optional solid rims / offset ghosts under it
  // (edges: [{ r: dilate radius, dx, dy, c: colour, o: opacity }]) — no masks, no extra copies of the pet
  const GMAP = (id, stops, mix = 1, edges = []) => {
    let f = `<filter id="${id}" filterUnits="userSpaceOnUse" x="-20" y="-20" width="104" height="104" color-interpolation-filters="sRGB">`;
    if (stops)
      f +=
        `${LUM}<feComponentTransfer${mix < 1 || edges.length ? ' result="g"' : ''}><feFuncR type="table" tableValues="${hexs(stops, 0)}"/><feFuncG type="table" tableValues="${hexs(stops, 1)}"/><feFuncB type="table" tableValues="${hexs(stops, 2)}"/></feComponentTransfer>` +
        (mix < 1 ? `<feComposite in="g" in2="SourceGraphic" operator="arithmetic" k2="${mix}" k3="${r1((1 - mix) * 100) / 100}" result="g"/>` : '');
    if (edges.length) {
      edges.forEach((e, i) => {
        f += e.r ? `<feMorphology in="SourceAlpha" operator="dilate" radius="${e.r}" result="a${i}"/>` : `<feOffset in="SourceAlpha" dx="${e.dx || 0}" dy="${e.dy || 0}" result="a${i}"/>`;
        f += `<feFlood flood-color="${e.c}" flood-opacity="${e.o || 1}"/><feComposite in2="a${i}" operator="in" result="e${i}"/>`;
      });
      f += `<feMerge>${edges.map((_, i) => `<feMergeNode in="e${i}"/>`).join('')}<feMergeNode in="${stops ? 'g' : 'SourceGraphic'}"/></feMerge>`;
    }
    return f + '</filter>';
  };
  // exotics animate their whole body every frame, and table/merge filters are slow to re-run.
  // For them the gradient map is approximated by ONE colour matrix (a line through the palette's
  // 2nd and 4th stops, clamped), which Chrome runs as a cheap colour filter.
  const LW = [0.2126, 0.7152, 0.0722];
  const MAT = (id, stops, mix = 1, sat = 0) => {
    let v = '';
    if (stops) {
      const ch = (h, i) => parseInt(h.slice(1 + i * 2, 3 + i * 2), 16) / 255;
      for (let c = 0; c < 3; c++) {
        const a = ch(stops[1], c), b = ch(stops[3], c), k = 2 * (b - a);
        v += LW.map((w, i) => (mix * k * w + (i === c ? 1 - mix : 0)).toFixed(3)).join(' ') + ` 0 ${(mix * (a - 0.5 * (b - a))).toFixed(3)} `;
      }
      v += '0 0 0 1 0';
    }
    return `<filter id="${id}" filterUnits="userSpaceOnUse" x="-20" y="-20" width="104" height="104" color-interpolation-filters="sRGB">${stops ? `<feColorMatrix type="matrix" values="${v}"/>` : `<feColorMatrix type="saturate" values="${sat || 1}"/>`}</filter>`;
  };
  // …and their rims / chromatic ghosts become cheap static head rings instead of morphology filters
  const xEdges = edges =>
    (edges || [])
      .map(e => (e.r ? `<circle cx="32" cy="${HY}" r="${HR + e.r * 0.7}" fill="none" stroke="${e.c}" stroke-width="${r1(e.r * 1.3)}" opacity="${e.o || 1}"/>` : `<circle cx="${32 + (e.dx || 0)}" cy="${HY + (e.dy || 0)}" r="${HR + 1}" fill="${e.c}" opacity="${e.o || 1}"/>`))
      .join('');
  const glow = (u, c, r = 30, o = 0.6, cls = '') => `<circle cx="32" cy="36" r="${r}" fill="url(#${u}gl)" opacity="${o}"${cls ? ` class="${cls}"` : ''}/>`;
  const glowDef = (u, c) => `<radialGradient id="${u}gl">${ST(0, c, 0.85)}${ST(0.45, c, 0.35)}${ST(1, c, 0)}</radialGradient>`;
  const pop = (x, y, r, c, d, o = 1) => `<g class="mx-pop" ${dl(d)}>${star4(x, y, r, c, o)}</g>`;
  const band = (u, id, w = 9, o = 0.85) => `<g class="mx-sweep"><rect x="-6" y="-14" width="${w}" height="96" fill="url(#${u}${id})" transform="rotate(22 32 36)" opacity="${o}"/></g>`;
  const bandDef = (u, id, c = '#ffffff', a = 0.9) => `<linearGradient id="${u}${id}" x1="0" y1="0" x2="1" y2="0">${ST(0, c, 0)}${ST(0.5, c, a)}${ST(1, c, 0)}</linearGradient>`;
  const zig = (a1, a2, r, n, amp, cx = 32, cy = 36) => {
    let d = '';
    for (let i = 0; i <= n; i++) {
      const [x, y] = pt(a1 + ((a2 - a1) * i) / n, r + (i % 2 ? amp : -amp) * (i % 3 === 2 ? 0.4 : 1), cx, cy);
      d += (i ? 'L' : 'M') + x + ' ' + y;
    }
    return d;
  };
  const spiral = (turns, r0, r1_, rot, n = 28) => {
    let d = '';
    for (let i = 0; i <= n; i++) {
      const t = i / n, [x, y] = pt(rot + t * turns * 360, r0 + (r1_ - r0) * t);
      d += (i ? 'L' : 'M') + x + ' ' + y;
    }
    return d;
  };
  const FACETS = (() => {
    const P = [];
    for (let j = 0; j <= 5; j++) for (let i = 0; i <= 5; i++) P.push([r1(6 + i * 10.4 + (i % 5 ? (((i * 7 + j * 13) % 5) - 2) * 1.4 : 0)), r1(8 + j * 10.4 + (j % 5 ? (((i * 11 + j * 5) % 5) - 2) * 1.4 : 0))]);
    const tri = (a, b, c, o) => `<path d="M${a}L${b}L${c}z" fill="#fff" fill-opacity="${o}"/>`;
    let s = '';
    for (let j = 0; j < 5; j++)
      for (let i = 0; i < 5; i++) {
        const a = P[j * 6 + i], b = P[j * 6 + i + 1], c = P[(j + 1) * 6 + i], d = P[(j + 1) * 6 + i + 1];
        s += tri(a, b, d, (((i + j) % 3) * 0.16).toFixed(2)) + tri(a, d, c, (((i + 2 * j + 1) % 3) * 0.13 + 0.04).toFixed(2));
      }
    return s;
  })();
  const STARS = (() => {
    let s = '';
    for (let i = 0; i < 26; i++) s += `<circle cx="${r1(((i * 37) % 60) + 2)}" cy="${r1(((i * 23 + 7) % 56) + 6)}" r="${[0.45, 0.7, 0.35, 0.9][i % 4]}" fill="#fff"/>`;
    return s;
  })();
  const blossom = (x, y, s) => `<g transform="translate(${x} ${y}) scale(${s})">${[0, 72, 144, 216, 288].map(a => `<ellipse cx="0" cy="-2.7" rx="2.1" ry="3" fill="#ffc6de" stroke="#ff6fa8" stroke-width=".35" transform="rotate(${a})"/>`).join('')}<circle r="1.3" fill="#ffd34d"/><circle r=".5" fill="#ff8a3d"/></g>`;
  const petal = (x, y, d, s = 1) => `<g transform="translate(${x} ${y})"><path class="mx-petal" ${dl(d)} d="M0 0c1.6-1.8 4-.6 3.4 1.7S.2 3.2 0 0z" fill="#ffb8d6" stroke="#ff7ab0" stroke-width=".3" transform="scale(${s})"/></g>`;
  const flake = (x, y, d, s = 1) => `<g transform="translate(${x} ${y}) scale(${s})"><path class="mx-fall" ${dl(d)} d="M0-2.6V2.6M-2.25-1.3 2.25 1.3M-2.25 1.3 2.25-1.3" stroke="#fff" stroke-width=".8" stroke-linecap="round"/></g>`;
  const rise = (x, y, r, c, d, cls = 'mx-rise') => `<circle class="${cls}" ${dl(d)} cx="${x}" cy="${y}" r="${r}" fill="${c}"/>`;
  const bubble = (x, y, r, d, c = '#fff') => `<circle class="mx-bub" ${dl(d)} cx="${x}" cy="${y}" r="${r}" fill="${c}" fill-opacity=".18" stroke="${c}" stroke-opacity=".85" stroke-width=".6"/>`;
  // top coat with drips (goo / icing / blood), masked to the body
  const coat = (fill, y = 18) => `<path d="M-4-4H68V${y}c-3 0-3.4 5-6.4 5s-2.6-7-6-7-2.6 10-6.2 10-3-6-6.2-6-2.4 11-6 11-3.2-9-6.2-9-2.6 6-6 6-3-10-6.2-10-3 6-6.8 6V-4z" fill="${fill}"/>`;

  const MUT_FX = {
    gold: u => ({
      f: ['#2a1400', '#8a5200', '#e0a01a', '#ffd84d', '#fff8d6'],
      defs: glowDef(u, '#ffc53d') + bandDef(u, 'sh', '#fffbe6', 0.95),
      back: glow(u, 0, 31, 0.55),
      over: `<path d="M-4 48q10-4 20 0t20 0 20 0 20 0V70H-4z" fill="#8a5200" opacity=".28"/>`,
      shine: band(u, 'sh', 10),
      front: pop(12, 16, 3.2, '#fff6c8', 0) + pop(53, 24, 2.6, '#ffe27a', -0.8) + pop(47, 55, 2.8, '#fff6c8', -1.6) + pop(20, 50, 1.8, '#ffd34d', -2.1),
    }),
    frozen: u => ({
      f: ['#06234a', '#1f6fb8', '#6fc8f0', '#d6f6ff', '#ffffff'],
      mix: 0.9,
      defs: glowDef(u, '#7fd7ff') + bandDef(u, 'sh', '#ffffff', 0.7) + LG(`${u}ic`, [ST(0, '#ffffff'), ST(0.5, '#bff0ff'), ST(1, '#4dbaf0')]) + RG(`${u}fr`, [ST(0, '#ffffff', 0.85), ST(1, '#ffffff', 0)], 0.3, 0.2, 0.55),
      back: glow(u, 0, 31, 0.5),
      over: `<rect x="0" y="0" width="64" height="40" fill="url(#${u}fr)"/><path d="M14 22l5 3 2 5M19 25l5-1M44 20l-3 5 2 5M41 25l-5 1M24 46l4-2 4 3M46 44l-3 3" stroke="#fff" stroke-opacity=".75" stroke-width=".7" fill="none" stroke-linecap="round"/>`,
      shine: band(u, 'sh', 7, 0.8),
      front:
        [[-150, 9, 0], [-128, 12, 1], [-104, 8, 0], [-76, 10, 1], [-52, 12, 0], [-30, 9, 1]]
          .map(([a, L, k]) => { const [x, y] = pt(a, 18); return `<path d="M-2.4 0L0-${L}L2.4 0L0 2.4z" fill="url(#${u}ic)" stroke="#fff" stroke-width=".6" stroke-linejoin="round" transform="translate(${x} ${y}) rotate(${a + 90})"${k ? ' opacity=".92"' : ''}/>`; })
          .join('') +
        `<path d="M22 55l1.4 5 1.4-5zM29 56l1.2 6.5 1.2-6.5zM36 56l1.2 5 1.2-5zM42 55l1 4 1-4z" fill="url(#${u}ic)" stroke="#fff" stroke-width=".4"/>` +
        flake(10, 18, 0, 1.1) + flake(54, 30, -1.4) + flake(48, 10, -2.6, 0.8) + flake(16, 44, -3.3, 0.8),
    }),
    inferno: u => ({
      f: ['#1a0300', '#8a1500', '#e84a0a', '#ffa31a', '#fff3b0'],
      mix: 0.9,
      defs: glowDef(u, '#ff6a1a') + `<linearGradient id="${u}fl" x1="0" y1="1" x2="0" y2="0">${ST(0, '#fff3a0')}${ST(0.35, '#ffb13d')}${ST(0.7, '#ff4a0a', 0.9)}${ST(1, '#c21a00', 0)}</linearGradient>` + LG(`${u}ht`, [ST(0.4, '#ff6a1a', 0), ST(1, '#ffd23d', 0.75)]),
      back:
        glow(u, 0, 32, 0.7) +
        [0, 1]

    return (
      head[0].replace('<svg', `<svg data-mut="${mut}"`) +
      defs + own + pre +
      // exotics already carry a glowing aura: skip the extra back glow (saves a full-size gradient fill per frame)
      `<g class="mx-back">${exo ? (fx.back || '').replace(/<circle cx="32" cy="36" r="[\d.]+" fill="url\(#[^)]+gl\)"[^>]*\/>/g, '') + xEdges(fx.edges) : fx.back || ''}</g>` +
      body +
      (fx.over ? `<g class="mx-over" ${overMask ? `mask="url(#${u}k)"` : `clip-path="url(#${u}c)"`}>${fx.over}</g>` : '') +
      (fx.shine ? `<g class="mx-shine" clip-path="url(#${u}c)">${fx.shine}</g>` : '') +
      `<g class="mx-front">${fx.front || ''}</g></svg>`
    );
  }
  window.ExoticArt = { PETS, MUTS, MUT, svg, mutate };

   above the app but below modals, packs, toasts and the tutorial.
   20 effect types. Pauses when the tab is hidden, calms way down for
   reduced motion, and flashes are short, soft and rate-limited.
   Perf: the canvas renders at DPR 1, draws are batched into a handful of
   paths per frame (no per-particle strokes / style strings), and an

    sprite('cloud', 360, 160, (g, w, h) => {

  /* ---------- shared helpers ---------- */
  const N = (base, cap = base * 2.2) => Math.max(8, Math.min(cap, Math.round(base * ((W * H) / (1280 * 800)) * inten * LV[lvl].n * (reduced() ? 0.18 : 1))));
  const arr = (n, f) => Array.from({ length: n }, (_, i) => f(i));
  function bolt(x0, y0, y1, spread) {
    // midpoint-displacement lightning with a couple of branches
    let pts = [
      [x0, y0],
      [x0 + rnd(-spread, spread), y1],
    ];
    for (let k = 0; k < 6; k++) {
      const out = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const [ax, ay] = pts[i - 1],
          [bx, by] = pts[i];
        out.push([(ax + bx) / 2 + rnd(-1, 1) * spread * 0.5 ** k, (ay + by) / 2 + rnd(-1, 1) * 6], [bx, by]);
      }
      pts = out;
    }
    const br = [];
    for (let b = 0; b < 3; b++) {
      const s = pts[Math.floor(rnd(pts.length * 0.2, pts.length * 0.8))],
        len = rnd(40, 140),
        a = rnd(0.3, 1.2) * (R() < 0.5 ? -1 : 1);
      const bp = [s];
      for (let i = 1; i < 6; i++) bp.push([s[0] + Math.sin(a) * len * (i / 5) + rnd(-8, 8), s[1] + Math.cos(Math.abs(a)) * len * (i / 5)]);
      br.push(bp);
    }
    return { pts, br, life: 0.28, t: 0 };
  }
  function drawBolt(b, col) {
    const a = Math.max(0, 1 - b.t / b.life);
    const path = p => {
      ctx.beginPath();
      ctx.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0], p[i][1]);
      ctx.stroke();
    };
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = col;
    ctx.globalAlpha = 0.25 * a;
    ctx.lineWidth = 12;
    path(b.pts);
    ctx.globalAlpha = 0.55 * a;
    ctx.lineWidth = 4;
    path(b.pts);
    b.br.forEach(path);
    ctx.globalAlpha = a;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.6;
    path(b.pts);
    ctx.lineWidth = 1;
    b.br.forEach(path);
    ctx.restore();
  }
  // rain: drops sorted into 6 (alpha × width) buckets, one stroke per bucket
  const RA = [0.4, 0.62, 0.85];
  function rain(n, col, ang, v0, v1, l0, l1) {
    const lm = (l0 + l1) / 2,
      B = arr(6, () => []);
    for (let i = 0; i < n; i++) {
      const d = { x: rnd(-W * 0.3, W * 1.1), y: rnd(-H, H), v: rnd(v0, v1), l: rnd(l0, l1) };
      B[Math.floor(R() * 3) * 2 + (d.l > lm ? 1 : 0)].push(d);
    }
    const sx = Math.sin(ang),
      cy = Math.cos(ang);
    return {
      step(dt) {
        ctx.strokeStyle = col;
        ctx.lineCap = 'butt';
        for (let b = 0; b < 6; b++) {
          const p = B[b];
          if (!p.length) continue;
          ctx.globalAlpha = RA[b >> 1];
          ctx.lineWidth = b & 1 ? 1.6 : 1.1;
          ctx.beginPath();
          for (const d of p) {
            d.x += sx * d.v * dt;
            d.y += cy * d.v * dt;
            if (d.y > H + 20) {
              d.y = rnd(-80, -10);
              d.x = rnd(-W * 0.3, W * 1.05);
            }
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - sx * d.l, d.y - cy * d.l);
          }
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      },
    };
  }
  function fallers(n, sprs, v0, v1, sway = 30, spin = 2) {
    const p = arr(n, () => ({ s: sprs[Math.floor(R() * sprs.length)], x: rnd(0, W), y: rnd(-H, H), v: rnd(v0, v1), r: rnd(0, TAU), vr: rnd(-spin, spin), ph: rnd(0, TAU), sc: rnd(0.7, 1.15) }));
    return {
      p,
      step(dt) {
        for (const d of p) {
          d.y += d.v * dt;
          d.r += d.vr * dt;
          d.ph += dt * 2;
          if (d.y > H + 40) {
            d.y = rnd(-120, -30);
            d.x = rnd(0, W);
          }
          const w = d.s.width * d.sc,
            h = d.s.height * d.sc,
            c = Math.cos(d.r) * dpr,
            sn = Math.sin(d.r) * dpr,
            sy = 0.55 + 0.45 * Math.abs(Math.cos(d.ph * 0.8));
          ctx.setTransform(c, sn, -sn * sy, c * sy, (d.x + Math.sin(d.ph) * sway) * dpr, d.y * dpr);
          ctx.drawImage(d.s, -w / 2, -h / 2, w, h);
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      },
    };
  }
  function risers(n, drawFn, v0, v1, sway = 20) {
    const p = arr(n, () => ({ x: rnd(0, W), y: rnd(0, H + 100), v: rnd(v0, v1), ph: rnd(0, TAU), s: rnd(0.5, 1.3), k: R() }));
    return {
      step(dt) {
        for (const d of p) {
          d.y -= d.v * dt;
          d.ph += dt * 1.6;
          if (d.y < -40) {
            d.y = H + rnd(10, 80);
            d.x = rnd(0, W);

          drawFn(d.x + Math.sin(d.ph) * sway, d.y, d, dt);
        }
      },
    };
  }
  // twinkles: 4-point sparkles, batched per (color × 3 alpha steps)
  function twinkles(n, cols) {
    const p = arr(n, () => ({ x: rnd(0, W), y: rnd(0, H), ph: rnd(0, TAU), s: rnd(0.6, 1.8), c: Math.floor(R() * cols.length) }));
    const AL = [0.3, 0.65, 1];
    return {
      step(dt) {
        for (const d of p) d.ph += dt * 3;

          ctx.fillStyle = cols[c];
          for (let k = 0; k < 3; k++) {
            ctx.globalAlpha = AL[k];

            for (const d of p) {
              if (d.c !== c) continue;
              const a = 0.5 + 0.5 * Math.sin(d.ph);

              const r = d.s * (1 + a);

              ctx.lineTo(d.x - r * 0.5, d.y);
              ctx.closePath();
              ctx.moveTo(d.x - r * 2.2, d.y);
              ctx.lineTo(d.x, d.y + r * 0.5);
              ctx.lineTo(d.x + r * 2.2, d.y);
              ctx.lineTo(d.x, d.y - r * 0.5);
              ctx.closePath();
            }
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1;
      },
    };
  }
  function every(min, max, fn) {
    let next = rnd(min * 0.4, max * 0.6);

      next -= dt;
      if (next <= 0) {
        next = rnd(min, max);
        fn();
      }
    };
  }
  function dasher(kind, e, dir, size) {
    const s = lootSprite(kind, size, e);

    return {
      go() {
        d = { x: dir > 0 ? -size : W + size, y: rnd(H * 0.2, H * 0.85), v: rnd(700, 1000) * dir };

      step(dt) {
        if (!d) return;

        ctx.save();
        ctx.globalAlpha = 0.25;
        for (let i = 1; i < 5; i++) ctx.drawImage(s, d.x - (d.v / Math.abs(d.v)) * i * 22 - size / 2, d.y - size / 2 + Math.sin(i + T * 20) * 2, size, size);

        ctx.save();
        ctx.translate(d.x, d.y + Math.abs(Math.sin(T * 18)) * -8);

        ctx.drawImage(s, -size / 2, -size / 2, size, size);
        ctx.restore();
        if (d.x < -size * 3 || d.x > W + size * 3) d = null;

  }

  /* ---------- the 20 effects ---------- */
  const MAKE = {
    bloodrain() {
      const r1 = rain(N(260, 520), 'rgba(255,40,60,1)', 0.22, 1000, 1500, 16, 30);
      const r2 = rain(N(90, 200), 'rgba(160,0,20,1)', 0.22, 700, 900, 8, 14);
      let bolts = [];
      const strike = every(1.7, 3.6, () => {
        bolts.push(bolt(rnd(W * 0.1, W * 0.9), -10, rnd(H * 0.55, H * 0.95), W * 0.12));
        if (R() < 0.35) bolts.push(bolt(rnd(W * 0.1, W * 0.9), -10, rnd(H * 0.4, H * 0.8), W * 0.1));
        flash('#ff2d3d', 0.3);
        shake(260);
      });
      const drops = arr(N(24, 50), () => ({ x: rnd(0, W), t: rnd(0, 1) }));

        r2.step(dt);

        bolts.forEach(b => drawBolt(b, '#ff3048'));
      };
    },
    thunder() {
      const r1 = rain(N(240, 480), 'rgba(170,200,255,1)', 0.12, 900, 1300, 14, 26);
      const cl = cloud(),
        clouds = arr(7, i => ({ x: (i / 7) * W * 1.3 - 100, y: rnd(-60, 40), s: rnd(1, 1.8), v: rnd(8, 22) }));
      let bolts = [];
      const strike = every(2, 4.5, () => {
        bolts.push(bolt(rnd(W * 0.1, W * 0.9), 20, rnd(H * 0.6, H), W * 0.14));

    },
    moneyrain() {

        tw.step(dt);
        f.step(dt);
      };
    },
    meteor() {

      let ms = [],
        rings = [];
      const spawn = every(0.25, 0.8, () => {
        const v = rnd(650, 1000);
        ms.push({ x: rnd(W * 0.2, W * 1.2), y: rnd(-80, H * 0.2), vx: -v * 0.7, vy: v * 0.7, r: rnd(2.5, 5), end: rnd(H * 0.7, H * 1.05) });

    disco() {

    blizzard() {

        B[k].push({ x: rnd(0, W), y: rnd(0, H), r: rnd(0.8, 1.3) + k * 0.95, v: rnd(60, 160), ph: rnd(0, TAU) });

    inferno() {
      const em = glow('rgba(255,150,40,1)', 24);

    void() {

      return dt => {

          rg.addColorStop(1, 'rgba(120,60,255,0)');
          g.setTransform(1, 0, 0, 0.62, 0, 0);
          g.fillStyle = rg;
          g.fillRect(0, 0, sz, sz);
        }
        ctx.globalAlpha = 0.78 + 0.22 * Math.sin(T * 3);
        ctx.drawImage(ring, cx - ring.width / 2, cy - ring.height / 2);
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.arc(cx, cy, R0, 0, TAU);
        ctx.fill();
      };
    },
    midas() {
      const f = fallers(N(40, 80), [coin()], 90, 180, 20, 3);
      const tw = twinkles(N(90), ['#fff6c8', '#ffd34d', '#fff']);
      return dt => {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const cx = W / 2;
        for (let i = 0; i < 9; i++) {
          const a = T * 0.15 + (i / 9) * TAU;
          ctx.fillStyle = 'rgba(255,210,90,.06)';
          ctx.beginPath();
          ctx.moveTo(cx, -40);
          ctx.lineTo(cx + Math.cos(a) * W * 1.4, Math.abs(Math.sin(a)) * H * 1.6);
          ctx.lineTo(cx + Math.cos(a + 0.12) * W * 1.4, Math.abs(Math.sin(a + 0.12)) * H * 1.6);
          ctx.fill();
        }
        ctx.restore();
        tw.step(dt);
        f.step(dt);
      };
    },
    toxic() {
      let bp = [null, null];
      const b = risers(
        N(90, 180),
        (x, y, d) => {
          const r = 3 + d.s * 7,
            k = d.k < 0.5 ? 0 : 1,
            pa = bp[k] || (bp[k] = new Path2D());
          pa.moveTo(x + r, y);
          pa.arc(x, y, r, 0, TAU);
        },
        40,
        120,
        14
      );
      const bubbles = dt => {
        bp[0] = bp[1] = null;
        b.step(dt);
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.5;
        ctx.fillStyle = 'rgba(125,255,61,.18)';
        ['#7dff3d', '#d4ff3d'].forEach((c, i) => bp[i] && (ctx.fill(bp[i]), (ctx.strokeStyle = c), ctx.stroke(bp[i])));
        ctx.globalAlpha = 1;
      };
      const drips = arr(Math.max(8, Math.round(W / 70)), i => ({ x: ((i + rnd(0.2, 0.8)) / Math.round(W / 70)) * W, l: rnd(0, 60), v: rnd(10, 40), drop: null }));
      return dt => {
        bubbles(dt);
        ctx.fillStyle = '#7dff3d';
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        for (const d of drips) {
          d.l += d.v * dt;
          if (d.l > 90 && !d.drop) {
            d.drop = { y: d.l, v: 0 };
            d.l = 10;
          }
          ctx.moveTo(d.x - 5, 0);
          ctx.quadraticCurveTo(d.x - 3, d.l * 0.7, d.x, d.l);
          ctx.quadraticCurveTo(d.x + 3, d.l * 0.7, d.x + 5, 0);
          ctx.closePath();
          ctx.moveTo(d.x + 4, d.l);
          ctx.arc(d.x, d.l, 4, 0, TAU);
          if (d.drop) {
            d.drop.v += 900 * dt;
            d.drop.y += d.drop.v * dt;
            ctx.moveTo(d.x + 3.4, d.drop.y);
            ctx.arc(d.x, d.drop.y, 3.4, 0, TAU);
            if (d.drop.y > H + 10) d.drop = null;
          }
        }
        ctx.fill();
        ctx.globalAlpha = 1;
      };
    },
    quake() {
      const dust = fallers(
        N(110, 220),
        [
          sprite('dust', 6, 6, g => {
            g.fillStyle = '#c8a27a';
            g.fillRect(0, 0, 6, 6);
          }),
        ],
        80,
        260,
        6,
        4
      );
      let cracks = [];
      const hit = every(2.2, 4, () => {
        if (!reduced()) shake(700, 'quake');
        for (let k = 0; k < 2; k++) {
          const edge = Math.floor(R() * 4),
            p0 = [
              [rnd(0, W), 0],
              [W, rnd(0, H)],
              [rnd(0, W), H],
              [0, rnd(0, H)],
            ][edge];
          const pts = [p0];
          let [x, y] = p0,
            a = Math.atan2(H / 2 - y, W / 2 - x);
          for (let i = 0; i < 14; i++) {
            a += rnd(-0.6, 0.6);
            x += Math.cos(a) * rnd(20, 50);
            y += Math.sin(a) * rnd(20, 50);
            pts.push([x, y]);
          }
          cracks.push({ pts, t: 0 });
        }
      });
      return dt => {
        dust.step(dt);
        hit(dt);
        ctx.lineJoin = 'round';
        for (const c of cracks) {
          c.t += dt;
          const a = c.t < 0.2 ? c.t / 0.2 : Math.max(0, 1 - (c.t - 1.4) / 1.2);
          ctx.globalAlpha = a;
          ctx.strokeStyle = 'rgba(20,10,4,.85)';
          ctx.lineWidth = 3.2;
          ctx.beginPath();
          c.pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
          ctx.stroke();
          ctx.strokeStyle = 'rgba(255,190,120,.6)';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        cracks = cracks.filter(c => c.t < 2.6);
      };
    },
    gravity() {
      const cols = ['rgba(138,215,255,1)', 'rgba(201,184,255,1)', 'rgba(255,158,210,1)', 'rgba(255,255,255,1)'];
      const orbs = cols.map(c => glow(c, 40));
      const r = risers(
        N(90, 180),
        (x, y, d) => {
          const s = 10 + d.s * 22;
          ctx.globalAlpha = 0.55;
          ctx.drawImage(orbs[Math.floor(d.k * orbs.length)], x - s / 2, y - s / 2, s, s);
        },
        12,
        45,
        40
      );
      const rocks = arr(N(10, 20), () => ({ x: rnd(0, W), y: rnd(0, H), r: rnd(0, TAU), vr: rnd(-0.6, 0.6), vx: rnd(-14, 14), vy: rnd(-18, -6), s: rnd(6, 16) }));
      return dt => {
        r.step(dt);
        ctx.globalAlpha = 0.6;
        ctx.fillStyle = '#8a8fb0';
        for (const k of rocks) {
          k.x += k.vx * dt;
          k.y += k.vy * dt;
          k.r += k.vr * dt;
          if (k.y < -30) (k.y = H + 30), (k.x = rnd(0, W));
          ctx.save();
          ctx.translate(k.x, k.y);
          ctx.rotate(k.r);
          ctx.beginPath();
          ctx.moveTo(-k.s, -k.s * 0.4);
          ctx.lineTo(-k.s * 0.2, -k.s);
          ctx.lineTo(k.s, -k.s * 0.3);
          ctx.lineTo(k.s * 0.6, k.s);
          ctx.lineTo(-k.s * 0.7, k.s * 0.7);
          ctx.fill();
          ctx.restore();
        }
        ctx.globalAlpha = 1;
      };
    },
    mutation() {
      const cols = ['rgba(57,255,176,1)', 'rgba(107,31,255,1)', 'rgba(255,61,240,1)', 'rgba(61,231,255,1)', 'rgba(255,211,77,1)'];
      const orbs = cols.map(c => glow(c, 48));
      const o = risers(
        N(40, 80),
        (x, y, d) => {
          const s = 14 + d.s * 26;
          ctx.globalAlpha = 0.7;
          ctx.drawImage(orbs[Math.floor(d.k * orbs.length)], x - s / 2, y - s / 2, s, s);
        },
        30,
        90,
        50
      );
      const hx = arr(Math.max(2, Math.round(W / 420)), i => ((i + 0.5) / Math.max(2, Math.round(W / 420))) * W);
      const pulse = every(4, 7, () => flash(`hsl(${Math.floor(rnd(0, 360))},100%,60%)`, 0.22));
      // helix rungs + beads, batched into 12 hue bins (the rainbow still scrolls)
      const HB = 12,
        HS = arr(HB, i => `hsl(${i * 30},100%,67%)`),
        rung = arr(HB, () => null),
        bead = arr(HB * 2, () => null);
      return dt => {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < HB; i++) rung[i] = bead[i] = bead[i + HB] = null;
        hx.forEach((x0, k) => {
          const amp = 38,
            step = 26;
          for (let y = -40; y < H + 40; y += step) {
            const ph = y * 0.022 + T * 2.2 + k,
              x1 = x0 + Math.sin(ph) * amp,
              x2 = x0 + Math.sin(ph + Math.PI) * amp,
              b = Math.floor((((y * 0.3 + T * 60 + k * 90) % 360) + 360) / 30) % HB,
              z = Math.cos(ph),
              r = rung[b] || (rung[b] = new Path2D()),
              bi = b + (z > 0 ? HB : 0),
              bd = bead[bi] || (bead[bi] = new Path2D());
            r.moveTo(x1, y);
            r.lineTo(x2, y);
            bd.moveTo(x1 + 4 + 2 * z, y);
            bd.arc(x1, y, 4 + 2 * z, 0, TAU);
            bd.moveTo(x2 + 4 - 2 * z, y);
            bd.arc(x2, y, 4 - 2 * z, 0, TAU);
          }
        });
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.35;
        for (let i = 0; i < HB; i++) if (rung[i]) (ctx.strokeStyle = HS[i]), ctx.stroke(rung[i]);
        for (let i = 0; i < HB * 2; i++) if (bead[i]) (ctx.globalAlpha = i < HB ? 0.45 : 0.85), (ctx.fillStyle = HS[i % HB]), ctx.fill(bead[i]);
        ctx.globalAlpha = 1;
        o.step(dt);
        ctx.restore();
        if (!reduced()) pulse(dt);
      };
    },
    cyber() {
      const tw = twinkles(N(40), ['#ff3df0', '#16e0ff', '#fff']);
      return dt => {
        tw.step(dt);
        const hz = H * 0.62,
          vx = W / 2;
        // sun
        const sr = Math.min(W, H) * 0.16;
        const sg = ctx.createLinearGradient(0, hz - sr * 2, 0, hz);
        sg.addColorStop(0, 'rgba(255,211,77,.55)');
        sg.addColorStop(1, 'rgba(255,61,240,.45)');
        ctx.fillStyle = sg;
        ctx.beginPath();
        ctx.arc(vx, hz, sr, Math.PI, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(10,4,30,.9)';
        for (let i = 0; i < 6; i++) ctx.fillRect(vx - sr, hz - sr * 0.12 - i * sr * 0.16, sr * 2, 2 + i * 0.8);
        // grid
        ctx.fillStyle = 'rgba(12,2,34,.55)';
        ctx.fillRect(0, hz, W, H - hz);
        ctx.strokeStyle = 'rgba(255,61,240,.75)';
        ctx.lineWidth = 1.4;
        const off = (T * 0.8) % 1;
        for (let i = 0; i < 14; i++) {
          const z = (i + 1 - off) / 14,
            y = hz + (H - hz) * z * z;
          ctx.globalAlpha = z;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(W, y);
          ctx.stroke();
        }
        ctx.globalAlpha = 0.7;
        ctx.strokeStyle = 'rgba(22,224,255,.7)';
        for (let i = -12; i <= 12; i++) {
          ctx.beginPath();
          ctx.moveTo(vx + i * 12, hz);
          ctx.lineTo(vx + i * W * 0.14, H);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
      };
    },
    bull() {
      const r = risers(
        N(50, 100),
        (x, y, d) => {
          ctx.globalAlpha = 0.8;
          if (d.k < 0.5) {
            const s = 8 + d.s * 10;
            ctx.fillStyle = '#1fd67a';
            ctx.beginPath();
            ctx.moveTo(x, y - s);
            ctx.lineTo(x + s * 0.8, y);
            ctx.lineTo(x + s * 0.3, y);
            ctx.lineTo(x + s * 0.3, y + s);
            ctx.lineTo(x - s * 0.3, y + s);
            ctx.lineTo(x - s * 0.3, y);
            ctx.lineTo(x - s * 0.8, y);
            ctx.fill();
          } else {
            const h = 14 + d.s * 20;
            ctx.strokeStyle = '#8affc1';
            ctx.lineWidth = 1.4;
            ctx.beginPath();
            ctx.moveTo(x, y - h * 0.8);
            ctx.lineTo(x, y + h * 0.8);
            ctx.stroke();
            ctx.fillStyle = '#1fd67a';
            ctx.fillRect(x - 4, y - h / 2, 8, h);
          }
          ctx.globalAlpha = 1;
        },
        120,
        300,
        6
      );
      const bull = dasher('bull', '🐂', 1, 64);
      const run = every(3, 6, () => bull.go());
      return dt => {
        r.step(dt);
        run(dt);
        bull.step(dt);
      };
    },
    bear() {
      const f = fallers(
        N(40, 80),
        [
          sprite('dn', 22, 30, g => {
            g.fillStyle = '#ff3d3d';
            g.beginPath();
            g.moveTo(11, 30);
            g.lineTo(22, 16);
            g.lineTo(15, 16);
            g.lineTo(15, 0);
            g.lineTo(7, 0);
            g.lineTo(7, 16);
            g.lineTo(0, 16);
            g.fill();
          }),
          sprite('rc', 12, 44, g => {
            g.strokeStyle = '#ff9a9a';
            g.lineWidth = 1.4;
            g.beginPath();
            g.moveTo(6, 0);
            g.lineTo(6, 44);
            g.stroke();
            g.fillStyle = '#ff3d3d';
            g.fillRect(2, 8, 8, 28);
          }),
        ],
        160,
        320,
        4,
        0.3
      );
      let slashes = [];
      const slash = every(0.9, 1.8, () => {
        slashes.push({ x: rnd(W * 0.1, W * 0.8), y: rnd(H * 0.15, H * 0.75), s: rnd(90, 180), t: 0, a: rnd(-0.5, 0.2) });
        if (R() < 0.35) shake(150);
      });
      const bear = dasher('bear', '🐻', -1, 64);
      const run = every(4, 7, () => bear.go());
      return dt => {
        f.step(dt);
        slash(dt);
        run(dt);
        bear.step(dt);
        for (const s of slashes) {
          s.t += dt;
          const grow = Math.min(1, s.t / 0.12),
            a = s.t < 0.12 ? 1 : Math.max(0, 1 - (s.t - 0.6) / 0.8);
          ctx.save();
          ctx.translate(s.x, s.y);
          ctx.rotate(s.a);
          ctx.globalAlpha = a;
          for (let i = 0; i < 3; i++) {
            ctx.strokeStyle = 'rgba(40,0,0,.8)';
            ctx.lineWidth = 7;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(i * 22, 0);
            ctx.quadraticCurveTo(i * 22 + s.s * 0.35, s.s * 0.5 * grow, i * 22 + s.s * 0.2 * grow, s.s * grow);

            ctx.strokeStyle = '#ff2d3d';
            ctx.lineWidth = 2.4;
            ctx.stroke();
          }
          ctx.restore();
        }
        slashes = slashes.filter(s => s.t < 1.4);
      };
    },
    petparade() {
      const XA = window.ExoticArt,
        E =
          IC() && XA && XA.PETS
            ? XA.PETS.slice(0, 10)
                .map(pt => svgSprite('pet' + pt.id, XA.svg(pt.id).replace('<svg ', '<svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" '), 56))
                .concat(['paw', 'heart', 'paw', 'heart', 'bone', 'gift'].map(k => lootSprite(k, 40)))
            : IC()
              ? ['paw', 'heart', 'bone', 'gift', 'paw', 'heart'].map(k => lootSprite(k, 40))
              : ['🐶', '🐱', '🐉', '🦄', '🐙', '🦊', '🐼', '🐸', '💖', '🐾', '💕', '🐾'].map(e => emo(e, 40));
      const r = risers(
        N(40, 80),
        (x, y, d) => {
          const s = 22 + d.s * 16;
          ctx.globalAlpha = 0.9;
          ctx.drawImage(E[Math.floor(d.k * E.length)], x - s / 2, y - s / 2 + Math.sin(d.ph * 2) * 6, s, s);
          ctx.globalAlpha = 1;
        },

        80,
        50
      );
      const tw = twinkles(N(40), ['#fff', '#ffc2e2', '#d8c8ff']);
