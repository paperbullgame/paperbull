        r.step(dt);
      };
    },
    tornado() {
      const n = N(260, 480),
        DC = ['#8d9aa6', '#6b5a44', '#9fae7a', '#c9d3db'],
        deb = arr(8, () => null),
        p = arr(n, () => ({ y: rnd(0, 1), a: rnd(0, TAU), v: rnd(2, 5), s: rnd(2.5, 7), c: Math.floor(R() * 4) }));
      const streaks = arr(N(40, 80), () => ({ x: rnd(0, W), y: rnd(0, H), l: rnd(40, 140), v: rnd(500, 900) }));
      return dt => {
        const cx = W / 2 + Math.sin(T * 0.25) * W * 0.3 + Math.sin(T * 0.9) * 30;
        ctx.strokeStyle = 'rgba(220,230,240,.35)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (const s of streaks) {
          s.x += s.v * dt;
          if (s.x > W + 150) (s.x = -150), (s.y = rnd(0, H));
          ctx.moveTo(s.x, s.y);
          ctx.lineTo(s.x - s.l, s.y);
        }
        ctx.stroke();
        // the funnel body: a swirling translucent cone with rotating bands
        const rOf = f => 18 + f * f * Math.min(W, 900) * 0.32,
          xOf = f => cx + Math.sin(T * 1.3 + f * 3) * 30 * f;
        const fg = ctx.createLinearGradient(0, 0, 0, H);
        fg.addColorStop(0, 'rgba(150,165,180,.3)');
        fg.addColorStop(1, 'rgba(90,100,110,.18)');
        ctx.fillStyle = fg;
        ctx.beginPath();
        for (let i = 0; i <= 40; i++) {
          const f = 1 - i / 40;
          ctx.lineTo(xOf(f) - rOf(f), H * (1 - f));
        }
        for (let i = 40; i >= 0; i--) {
          const f = 1 - i / 40;
          ctx.lineTo(xOf(f) + rOf(f), H * (1 - f));
        }
        ctx.fill();
        ctx.strokeStyle = 'rgba(215,225,235,.28)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < 12; i++) {
          const f = (i / 12 + T * 0.18) % 1,
            y = H * (1 - f);
          ctx.moveTo(xOf(f) + rOf(f), y);
          ctx.ellipse(xOf(f), y, rOf(f), 4 + rOf(f) * 0.12, 0, 0, Math.PI);
        }
        ctx.stroke();
        // debris: 4 colors x front/back, one fill each
        for (let i = 0; i < 8; i++) deb[i] = null;
        for (const d of p) {
          d.a += d.v * dt * (1.6 - d.y);
          d.y -= dt * 0.05;
          if (d.y < 0) d.y = 1;
          const y = H * (1 - d.y),
            rad = 18 + d.y * d.y * Math.min(W, 900) * 0.32,
            x = cx + Math.sin(T * 1.3 + d.y * 3) * 30 * d.y + Math.cos(d.a) * rad;
          const z = Math.sin(d.a),
            k = d.c * 2 + (z > 0 ? 1 : 0),
            pa = deb[k] || (deb[k] = new Path2D());
          pa.rect(x, y + z * 6, d.s * (0.6 + (z + 1) / 2), d.s);
        }
        for (let i = 0; i < 8; i++) if (deb[i]) (ctx.globalAlpha = i & 1 ? 0.92 : 0.5), (ctx.fillStyle = DC[i >> 1]), ctx.fill(deb[i]);
        ctx.globalAlpha = 1;
      };
    },
    moon() {
      const n = N(220, 420),
        p = arr(n, () => ({ x: rnd(-1, 1), y: rnd(-1, 1), z: rnd(0.05, 1) }));
      const rocket = lootSprite('rocket', 48, '🚀');
      let rockets = [];
      const launch = every(1.8, 3.6, () => rockets.push({ x: rnd(W * 0.05, W * 0.7), y: H + 40, v: rnd(380, 620) }));
      return dt => {
        const cx = W / 2,
          cy = H / 2,
          sc = Math.max(W, H) * 0.6;
        ctx.strokeStyle = '#fff';
        ctx.lineCap = 'round';
        for (const d of p) {
          const z0 = d.z;
          d.z -= dt * 0.55 * inten;
          if (d.z <= 0.03) {
            d.x = rnd(-1, 1);
            d.y = rnd(-1, 1);
            d.z = 1;
            continue;
          }
          const x1 = cx + (d.x / z0) * sc * 0.25,
            y1 = cy + (d.y / z0) * sc * 0.25,
            x2 = cx + (d.x / d.z) * sc * 0.25,
            y2 = cy + (d.y / d.z) * sc * 0.25;
          ctx.globalAlpha = Math.min(1, (1 - d.z) * 1.4);
          ctx.lineWidth = Math.max(0.6, (1 - d.z) * 2.4);
          ctx.beginPath();
          ctx.moveTo(x1, y1);
          ctx.lineTo(x2, y2);
          ctx.stroke();
        }
        ctx.globalAlpha = 1;
        // moon
        const mr = Math.min(W, H) * 0.11,
          mx = W - mr * 1.6,
          my = mr * 1.5;
        const mg = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, mr * 0.1, mx, my, mr * 2.2);
        mg.addColorStop(0, '#fffbe6');
        mg.addColorStop(0.42, '#e8e1c8');
        mg.addColorStop(0.46, 'rgba(255,245,200,.35)');
        mg.addColorStop(1, 'rgba(255,245,200,0)');
        ctx.fillStyle = mg;
        ctx.beginPath();
        ctx.arc(mx, my, mr * 2.2, 0, TAU);
        ctx.fill();
        ctx.fillStyle = 'rgba(170,160,130,.45)';
        [
          [-0.3, -0.2, 0.18],
          [0.25, 0.1, 0.14],
          [-0.05, 0.35, 0.1],
        ].forEach(([a, b, r]) => {
          ctx.beginPath();
          ctx.arc(mx + a * mr, my + b * mr, r * mr, 0, TAU);
          ctx.fill();
        });
        launch(dt);
        for (const k of rockets) {
          k.y -= k.v * dt;
          k.x += k.v * 0.45 * dt;
          ctx.drawImage(rocket, k.x - 24, k.y - 24, 48, 48);
        }
        rockets = rockets.filter(k => k.y > -60);
      };
    },
  };

  /* ---------- lifecycle ---------- */
  function size() {
    if (!cv) return;
    // DPR 1 is plenty for soft particles; slow devices also drop the internal resolution
    dpr = LV[lvl].rs;
    W = innerWidth;
    H = innerHeight;

    },
    toxic(p) {
      const blade = a => {

    quake(p) {
      return (
        `<path d="M7 24H16L19.5 16L24.5 34L29.5 7L34.5 37L38.5 17L42 29L45.5 21L48.5 24H57" fill="none" stroke="${p.w}" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>` +
        `<path d="M7 45L18 42.5L27 44L34 41.5L46 43.5L57 41.5V56H7Z" fill="${p.w}"/>` +

    gravity(p, u) {
      return (
        (p.sh ? '' : `<defs>${RG(u + 'pl', [[0, '#ffffff'], [0.55, light(p.a, 0.35)], [1, dark(p.a, 0.25)]], 0.36, 0.3, 0.8)}</defs>`) +

    mutation(p) {
      let a = '',
        b = '',
        rungs = '';
      for (let i = 0; i <= 32; i++) {
        const y = 9 + i * 1.44,
          ph = i * 0.3;
        a += (i ? 'L' : 'M') + f1(32 + Math.sin(ph) * 11) + ' ' + f1(y);
        b += (i ? 'L' : 'M') + f1(32 + Math.sin(ph + Math.PI) * 11) + ' ' + f1(y);

      return `<g transform="rotate(28 32 32)">${rungs}<path d="${a}" fill="none" stroke="${p.w}" stroke-width="4" stroke-linecap="round"/><path d="${b}" fill="none" stroke="${p.sh ? p.w : light(p.a, 0.55)}" stroke-width="4" stroke-linecap="round"/></g>`;

      let grid = '';
      if (!p.sh) {

    bull(p) {

        chat: I('<path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4 3.5V15.5a2 2 0 0 1-1.5-2z"/>'),
        mute: I('<path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4 3.5V15.5a2 2 0 0 1-1.5-2z"/><path d="m9.5 7.5 5 5M14.5 7.5l-5 5"/>'),

      };

      /* ================= api ================= */
      const S = { token: sessionStorage.getItem('pba.t') || null, me: null };
      const ERR = {
        admin_auth: 'Your session ended. Please sign in again.',
        forbidden: 'Your role doesn’t allow that action.',
        bad_login: 'Wrong username or password.',
        locked: 'Too many wrong codes. Locked for 15 minutes.',

        bad_hours: 'Suspension must be 1 to 8,760 hours.',
        bad_name: 'Enter a name (1–60 characters).',
        bad_kind: 'Pick a valid type.',
        bad_item: 'Pick a valid game item.',

        bad_price: 'Price must be 0 to 10,000,000 coins.',
        bad_users: 'Pick at least one user (max 500).',
        too_long: 'That text is too long.',
        bad_value: 'Invalid value.',
        bad_sym: 'Ticker must be 1–7 letters, numbers or dots.',
        too_many: 'That’s the limit for this list.',
        bad_title: 'Enter a title (1–120 characters).',
        bad_status: 'Invalid status.',
        bad_role: 'Pick a role.',
        bad_password: 'Password must be 6+ characters.',
        muted: 'That player is muted from chat.',
        no_room: 'That chat room doesn’t exist.',
        feature_off: 'That feature is turned off in Site controls.',
        network:
          'Can’t reach the PAPERBULL server (supabase.co). This Wi-Fi, a VPN or an ad blocker may be blocking it. Try phone data or turn the blocker off.',
        offline: 'You’re offline. Connect to the internet and try again.',
      };
      async function rpc(fn, args = {}) {
        let r;
        for (let tries = 0; ; tries++) {
          try {
            r = await fetch(API + fn, {
              method: 'POST',
              headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
              body: JSON.stringify(args),
            });
            break;
          } catch (e) {
            if (tries < 2 && navigator.onLine !== false) {
              await new Promise(ok => setTimeout(ok, 600 * (tries + 1)));
              continue;
            }
            throw Object.assign(new Error(navigator.onLine === false ? ERR.offline : ERR.network), { code: 'network' });
          }
        }
        const t = await r.text();
        let j = null;
        try {
          j = t ? JSON.parse(t) : null;
        } catch (e) {}
        if (!r.ok) {
          const code = (j && j.message) || 'error';
          if (code === 'admin_auth') {
            signOut(true);
          }
          throw Object.assign(new Error(ERR[code] || 'Server error: ' + code), { code });
        }
        if (j && j.error) throw Object.assign(new Error(ERR[j.error] || j.error), { code: j.error, left: j.left });
        return j;
      }
      const A = (fn, args = {}) => rpc(fn, Object.assign({ p_token: S.token }, args));
      const can = r =>
        (({ owner: 3, admin: 2, moderator: 1 })[S.me?.role] || 0) >=
        ({ owner: 3, admin: 2, moderator: 1 }[r] || 9);

      /* ================= ui primitives ================= */
      function toast(msg, kind = 'ok') {
        const el = document.createElement('div');
        el.className = 'toast ' + kind;
        el.innerHTML = (kind === 'ok' ? IC.ok : IC.bad) + `<div>${esc(msg)}</div>`;
        $('#toasts').appendChild(el);
        setTimeout(
          () => {
            el.style.opacity = '0';
            el.style.transition = 'opacity .3s';
            setTimeout(() => el.remove(), 300);
          },
          kind === 'err' ? 5000 : 3000
        );
      }
      function modal({ title, body, ok = 'Save', okClass = 'pri', cancel = 'Cancel', wide, onOk, onMount }) {
        const ov = document.createElement('div');
        ov.className = 'ov';
        ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h3>${esc(title)}</h3><button class="btn ghost sm icon" data-x aria-label="Close">${IC.x}</button></div><div class="mb">${body}</div>
    <div class="mf">${cancel ? `<button class="btn" data-x>${esc(cancel)}</button>` : ''}${ok ? `<button class="btn ${okClass}" data-ok>${esc(ok)}</button>` : ''}</div></div>`;
        document.body.appendChild(ov);
        const close = () => {
          ov.remove();
          document.removeEventListener('keydown', key);
        };
        const key = e => {
          if (e.key === 'Escape') close();
        };
        document.addEventListener('keydown', key);
        ov.addEventListener('click', e => {
          if (e.target === ov || e.target.closest('[data-x]')) close();
        });
        const okb = $('[data-ok]', ov);
        if (okb)
          okb.onclick = async () => {
            if (!onOk) return close();
            okb.disabled = true;
            const t = okb.textContent;
            okb.textContent = 'Working…';
            try {
              const r = await onOk(ov);
              if (r !== false) close();
            } catch (e) {
              const er = $('.err', ov);
              if (er) er.textContent = e.message;
              else toast(e.message, 'err');
            }
            if (document.body.contains(okb)) {
              okb.disabled = false;
              okb.textContent = t;
            }
          };
        onMount && onMount(ov);
        setTimeout(() => {
          const f = $('input:not([type=checkbox]),textarea,select', ov);
          if (f && innerWidth > 700) f.focus();
        }, 30);
        return ov;
      }
      function confirmBox({ title, text, ok = 'Confirm', danger = true, type, reason, hours }) {
        return new Promise(res => {
          modal({
            title,
            ok,
            okClass: danger ? 'dan' : 'pri',
            body: `${danger ? `<div class="warnbox">${IC.bad}<div>${text}</div></div>` : `<p>${text}</p>`}
        ${hours ? `<label class="f"><span>How long (hours)</span><input class="in" type="number" id="cfH" min="1" max="8760" value="${hours}"></label>` : ''}
        ${reason ? `<label class="f"><span>Reason (shown to the user)</span><input class="in" id="cfR" maxlength="300" placeholder="Optional"></label>` : ''}
        ${type ? `<label class="f"><span>Type <b class="mono">${esc(type)}</b> to confirm</span><input class="in" id="cfT" autocomplete="off"></label>` : ''}<div class="err"></div>`,
            onOk: ov => {
              if (type && $('#cfT', ov).value.trim() !== type)
                throw new Error(`Type ${type} exactly to confirm.`);
              res({
                reason: reason ? $('#cfR', ov).value.trim() : null,
                hours: hours ? +$('#cfH', ov).value : null,
              });
            },
            onMount: ov =>
              ov.addEventListener('click', e => {
                if (e.target === ov || e.target.closest('[data-x]')) res(null);
              }),
          });
        });
      }
      async function act(p, okMsg) {
        try {
          const r = await p;
          if (okMsg) toast(okMsg);
          return r;
        } catch (e) {
          toast(e.message, 'err');
          throw e;
        }
      }
      const statusPill = s =>
        ({
          active: '<span class="pill p-ok"><i></i>Active</span>',
          suspended: '<span class="pill p-warn"><i></i>Suspended</span>',
          banned: '<span class="pill p-dn"><i></i>Banned</span>',
          deleted: '<span class="pill p-mut"><i></i>Deleted</span>',
        })[s] || esc(s);
      const rolePill = r =>
        `<span class="pill ${r === 'owner' ? 'p-brand' : r === 'admin' ? 'p-info' : 'p-mut'}">${esc(r[0].toUpperCase() + r.slice(1))}</span>`;
      const avatar = n => `<span class="av">${esc(String(n || '?').slice(0, 1))}</span>`;
      const skeleton = (n = 5) =>
        `<div style="display:grid;gap:12px;padding:8px 0">${Array.from({ length: n }, (_, i) => `<div class="skel" style="width:${90 - i * 9}%"></div>`).join('')}</div>`;

      /* ================= charts (plain SVG) ================= */
      function chart(el, { labels, series, type = 'line', fmt = v => num(v), stacked }) {
        if (!el) return;
        const W = Math.max(280, el.clientWidth || 600),
          H = el.clientHeight || 220,
          L = 44,
          R = 10,
          T = 12,
          B = 26,
          iw = W - L - R,
          ih = H - T - B,
          n = labels.length;
        const tot = labels.map((_, i) =>
          stacked
            ? series.reduce((s, x) => s + (+x.data[i] || 0), 0)
            : Math.max(...series.map(x => +x.data[i] || 0))
        );
        // round axis: whole-number steps (1, 2, 5 × 10ⁿ) so counts never show as 2.3 or 6.8
        const peak = Math.max(1, ...tot),
          ints = series.every(s => s.data.every(v => Number.isInteger(+v || 0)));
        let stp = peak / 4;
        const mag = Math.pow(10, Math.floor(Math.log10(stp)));
        stp = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= stp) || 10 * mag;
        if (ints) stp = Math.max(1, Math.ceil(stp));
        const nT = Math.max(1, Math.ceil((peak * 1.05) / stp));
        let mx = nT * stp;
        const y = v => T + ih - (v / mx) * ih,
          x = i => L + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw),
          bw = Math.max(2, (iw / n) * 0.62),
          bx = i => L + ((i + 0.5) * iw) / n;
        let g = '<g class="grid">';
        for (let k = 0; k <= nT; k++) {
          const v = stp * k,
            yy = y(v).toFixed(1);
          g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 8}" y="${+yy + 3.5}" text-anchor="end">${esc(fmtShort(v))}</text>`;
        }
        g += '</g>';
        const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));
        let xl = '';
        labels.forEach((l, i) => {
          if ((i % step === 0 && (i === n - 1 || n - 1 - i >= step * 0.75)) || i === n - 1)
            xl += `<text class="ax" x="${(type === 'bar' ? bx(i) : x(i)).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`;
        });
        let body = '';
        if (type === 'line')
          series.forEach(s => {
            const pts = s.data.map((v, i) => [x(i), y(+v || 0)]),
              d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
            const id = 'g' + Math.random().toString(36).slice(2, 8);
            body +=
              `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>` +
              (series.length === 1
                ? `<path d="${d}L${x(n - 1).toFixed(1)},${T + ih}L${x(0).toFixed(1)},${T + ih}Z" fill="url(#${id})"/>`
                : '') +
              `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
          });
        else
          labels.forEach((_, i) => {
            let acc = 0;
            series.forEach((s, k) => {
              const v = +s.data[i] || 0;
              if (!v) return;
              const w = stacked ? bw : bw / series.length,
                xx = stacked ? bx(i) - bw / 2 : bx(i) - bw / 2 + k * w;
              const y0 = y(acc + (stacked ? v : v)),
                h = y(stacked ? acc : 0) - y0;
              body += `<rect x="${xx.toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(1, w - 1).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="2" fill="${s.color}"/>`;
              if (stacked) acc += v;
            });
          });
        el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${g}${body}${xl}<line class="hov" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--mut)" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip"></div>`;
        const svg = $('svg', el),
          tip = $('.tip', el),
          hov = $('.hov', el);
        svg.addEventListener('pointermove', e => {
          const r = svg.getBoundingClientRect(),
            px = ((e.clientX - r.left) / r.width) * W;
          const i = Math.max(
            0,
            Math.min(
              n - 1,
              type === 'bar' ? Math.floor(((px - L) / iw) * n) : Math.round(((px - L) / iw) * (n - 1))
            )
          );
          const xx = type === 'bar' ? bx(i) : x(i);
          hov.setAttribute('x1', xx);
          hov.setAttribute('x2', xx);
          hov.setAttribute('opacity', '.6');
          tip.innerHTML = `${esc(labels[i])}<br>${series.map(s => `<span style="color:${s.color}">●</span> ${esc(s.name)}: <b>${esc(fmt(+s.data[i] || 0))}</b>`).join('<br>')}`;
          tip.style.left = (xx / W) * r.width + 'px';
          tip.style.top = (T / H) * r.height + 10 + 'px';
          tip.style.opacity = 1;
        });
        svg.addEventListener('pointerleave', () => {
          tip.style.opacity = 0;
          hov.setAttribute('opacity', '0');
        });
      }
      function fmtShort(v) {
        v = +v;
        if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
        if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
        return Math.round(v * 10) / 10 + '';
      }
      const legend = s =>
        `<div class="legend">${s.map(x => `<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`;
      const col = k =>
        getComputedStyle(document.documentElement)
          .getPropertyValue('--c' + k)
          .trim();

      /* ================= theme ================= */
      function setTheme(t) {
        document.documentElement.dataset.theme = t;
        try {
          localStorage.setItem('pba.theme', t);
        } catch (e) {}
        const b = $('#themeBtn');
        if (b) b.innerHTML = t === 'dark' ? IC.sun : IC.moon;
        if (V.cur && V.cur.charts) V.cur.charts();
      }
      setTheme(
        (() => {
          try {
            return localStorage.getItem('pba.theme');
          } catch (e) {
            return null;
          }
        })() || 'dark'
      );

      /* ================= auth screens ================= */
      async function boot() {
        if (S.token) {
          try {
            S.me = await rpc('pba_me', { p_token: S.token });
            return shell();
          } catch (e) {
            S.token = null;
            sessionStorage.removeItem('pba.t');
          }
        }
        authScreen();
      }
      const CODE_LEN = 5;
      function authScreen() {
        const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'];
        $('#root').innerHTML = `<div class="auth gate"><div class="gate-orb o1"></div><div class="gate-orb o2"></div>
    <form class="auth-card gate-card" id="authF" autocomplete="off">
      <div class="gate-logo"><span class="mark">${LOGO}</span></div>
      <div class="gate-brand">PAPERBULL <span>Admin</span></div>
      <h1>Enter access code</h1>
      <p>Type your ${CODE_LEN}-digit admin code to unlock the control room.</p>
      <label class="pin" id="pin" for="aCode">${Array.from({ length: CODE_LEN }, (_, i) => `<i data-i="${i}"></i>`).join('')}
        <input id="aCode" inputmode="numeric" pattern="[0-9]*" maxlength="${CODE_LEN}" autocomplete="one-time-code" aria-label="Admin access code" autofocus></label>
      <div class="err" id="aErr" role="alert"></div>
      <div class="keypad" id="kp">${keys.map(k => `<button type="button" data-k="${k}" class="${k.length > 1 ? 'fn' : ''}" aria-label="${k === 'del' ? 'Delete' : k === 'clr' ? 'Clear' : k}">${k === 'del' ? '⌫' : k === 'clr' ? 'C' : k}</button>`).join('')}</div>
      <button class="btn pri block" id="aGo">Unlock</button>
      <p class="small muted gate-foot">${IC.shield}<span>Checked on the server · locks after 5 wrong tries</span></p>
      <p class="small muted" style="margin:10px 0 0;text-align:center"><a href="./">← Back to PAPERBULL</a></p>
    </form></div>`;
        const inp = $('#aCode'),
          pin = $('#pin'),
          er = $('#aErr'),
          b = $('#aGo');
        let busy = false;
        const paint = () => {
          const v = inp.value;
          $$('#pin i').forEach((d, i) => {
            d.classList.toggle('on', i < v.length);
            d.classList.toggle('cur', i === v.length && document.activeElement === inp);
          });
        };
        const submit = async () => {
          if (busy) return;
          const code = inp.value;
          if (code.length !== CODE_LEN) {
            er.textContent = `Enter all ${CODE_LEN} digits.`;
            return;
          }
          busy = true;
          er.textContent = '';
          b.disabled = true;
          b.textContent = 'Checking…';
          pin.classList.add('busy');
          try {
            const r = await rpc('pba_code_login', { p_code: code });
            S.token = r.token;
            S.me = r.admin;
            sessionStorage.setItem('pba.t', r.token);
            pin.classList.add('ok');
            setTimeout(() => {
              shell();
              toast('Welcome back, ' + r.admin.username);
            }, 380);
          } catch (ex) {
            busy = false;
            pin.classList.remove('busy');
            pin.classList.remove('shake');
            void pin.offsetWidth;
            pin.classList.add('shake');
            er.textContent =
              ex.code === 'bad_code'
                ? 'Wrong code.' + (ex.left != null ? ` ${ex.left} ${ex.left === 1 ? 'try' : 'tries'} left.` : '')
                : ex.message;
            inp.value = '';
            paint();
            inp.focus();
            b.disabled = false;
            b.textContent = 'Unlock';
          }
        };
        inp.addEventListener('input', () => {
          inp.value = inp.value.replace(/\D/g, '').slice(0, CODE_LEN);
          er.textContent = '';
          paint();
          if (inp.value.length === CODE_LEN) submit();
        });
        inp.addEventListener('focus', paint);
        inp.addEventListener('blur', paint);
        $('#kp').onclick = e => {
          const k = e.target.closest('button')?.dataset.k;
          if (!k || busy) return;
          if (k === 'del') inp.value = inp.value.slice(0, -1);
          else if (k === 'clr') inp.value = '';
          else if (inp.value.length < CODE_LEN) inp.value += k;
          inp.dispatchEvent(new Event('input'));
        };
        $('#authF').onsubmit = e => {
          e.preventDefault();
          submit();
        };
        paint();
        setTimeout(() => inp.focus(), 50);
      }
      async function signOut(expired) {
        const t = S.token;
        S.token = null;
        S.me = null;
        sessionStorage.removeItem('pba.t');
        if (t && !expired) rpc('pba_logout', { p_token: t }).catch(() => {});
        authScreen();
        if (expired) toast(ERR.admin_auth, 'err');
      }

      /* ================= shell + router ================= */
      /* Every page, grouped into a few sections. Each ['-', name] starts a section: the sidebar shows one
         link per section and the section's pages become tabs at the top of the page.
         (admin-abuse.js inserts Admin Abuse + Exotic pets right after ['-', 'Game'].) */
      const NAV = [
        ['-', 'Overview'],
        ['dashboard', 'Dashboard', IC.dash, 'moderator'],
        ['analytics', 'Analytics', IC.chart, 'moderator'],
        ['-', 'Players'],
        ['users', 'Players', IC.users, 'moderator'],
        ['transactions', 'Transactions', IC.tx, 'moderator'],
        ['-', 'Rewards'],
        ['gifts', 'Gifts', IC.gift, 'moderator'],
        ['promos', 'Promo codes', IC.ticket, 'moderator'],
        ['-', 'Game'],
        ['-', 'Community'],
        ['chat', 'Chat', IC.chat, 'moderator'],
        ['social', 'Social & seasons', IC.crown, 'moderator'],
        ['content', 'News & content', IC.content, 'moderator'],
        ['-', 'Economy'],
        ['market', 'Market', IC.chart, 'moderator'],
        ['shop', 'Shop items', IC.coin, 'moderator'],
        ['store', 'Store ($)', IC.coin, 'moderator'],
        ['-', 'Settings'],
        ['site', 'Site controls', IC.site, 'moderator'],
        ['admins', 'Admin accounts', IC.shield, 'owner'],
        ['audit', 'Audit log', IC.log, 'admin'],
      ];
      /* how each section looks in the sidebar */
      const SECS = {
        Overview: { id: 'overview', label: 'Overview', ico: 'dashboard' },
        Players: { id: 'players', label: 'Players', ico: 'users' },
        Rewards: { id: 'rewards', label: 'Rewards', ico: 'gifts' },
        Game: { id: 'live', label: 'Live events', ico: 'abuse' },
        Community: { id: 'community', label: 'Community', ico: 'chat' },
        Economy: { id: 'economy', label: 'Economy', ico: 'market' },
        Settings: { id: 'settings', label: 'Settings', ico: 'site' },
      };
      const ALIAS = { user: 'users' };
      function navGroups() {
        const out = [];
        let g = null;
        for (const n of NAV) {

      function activityStrip(events) {
        const days = new Set((events || []).filter(e => ['active', 'signup', 'login'].includes(e.kind)).map(e => new Date(e.created_at).toDateString()));
        const out = [];
        for (let i = 13; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const on = days.has(d.toDateString());
          out.push(`<i class="${on ? 'on' : ''}" title="${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}${on ? ' · played' : ''}"></i>`);
        }
        const n = [...days].filter(x => Date.now() - new Date(x) < 14 * 864e5).length;
        return `<div class="astrip">${out.join('')}<span class="small muted">${n} of 14 days</span></div>`;

          all.push(...r.rows);

        return all;

      function downloadCSV(rows, name) {
        if (!rows.length) return toast('Nothing to export.', 'err');

        const q = v => {
          const s = v == null ? '' : String(v);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };
        const csv = [keys.join(',')].concat(rows.map(u => keys.map(k => q(u[k])).join(','))).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = `paperbull-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 500);
        toast(`Exported ${num(rows.length)} rows`);

      function prizeBind(root, pre, onChange) {
        const box = $('#' + pre, root),
          g = k => $(`[data-p="${k}"]`, box),
          w = k => $(`[data-w="${k}"]`, box);
        const sync = () => {
          const k = g('kind').value;
          w('amount').hidden = !['coins', 'cash', 'xp'].includes(k);
          w('pet').hidden = w('mut').hidden = k !== 'xpet';
          w('egg').hidden = k !== 'egg';
          w('serum').hidden = k !== 'serum';
          w('item').hidden = k !== 'item';
          const pv = w('pv');
          if (k === 'xpet') {
            const p = XA.PETS.find(x => x.id === g('pet').value),
              m = g('mut').value,
              mm = m ? XA.MUT[m] : null;
            pv.hidden = false;
            pv.innerHTML = `<span class="ab-pvart">${xpetSvg(p.id, m)}</span><span><b>${esc(p.name)}${mm ? ` <em style="--mc:${mm.c}">${esc(mm.name)}</em>` : ''}</b><small>${esc(xperks(p, mm ? mm.mult : 1))}</small><small class="muted">${esc(p.desc)}</small></span>`;
          } else pv.hidden = true;
          onChange && onChange();
        };
        $$('select,input', box).forEach(el => (el.oninput = el.onchange = sync));
        sync();
        return () => {
          const k = g('kind').value;
          if (!k) return null;
          if (['coins', 'cash', 'xp'].includes(k)) {
            const a = Math.round(+g('amount').value);
            if (!(a > 0)) throw new Error('Enter a prize amount above 0.');
            return { kind: k, amount: a, name: k === 'coins' ? num(a) + ' coins' : k === 'cash' ? usd(a) + ' cash' : num(a) + ' XP' };
          }
          if (k === 'xpet') {
            const p = XA.PETS.find(x => x.id === g('pet').value),
              m = g('mut').value;
            return { kind: 'item', item_id: 'xpet_' + p.id.replace(/^x_/, '') + (m ? '_m_' + m : ''), name: m ? `${p.name} (${XA.MUT[m].name})` : p.name };
          }
          const id = g(k === 'egg' ? 'egg' : k === 'serum' ? 'serum' : 'item').value,
            it = GAME_ITEMS.find(i => i[0] === id);
          return { kind: 'item', item_id: id, name: it ? it[2].replace(/ \(.*\)$/, '') : id };
        };
      }

        .xm-r{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:var(--panel2)}.xm-r .btn{margin-left:auto}
        .xm-dot{width:14px;height:14px;border-radius:50%;background:var(--mc);box-shadow:0 0 10px var(--mc);flex:none}
        `;
        document.head.appendChild(st);
      }

      VIEWS.search = {
        async render(v, [q]) {
          q = q || '';
          if ($('#gs')) $('#gs').value = q;
          v.innerHTML =
            head(`Search: “${esc(q)}”`, 'Users, gifts, transactions and content.') +
            `<div class="card">${skeleton(5)}</div>`;
          let r;
          try {
            r = await A('pba_search', { p_q: q });
          } catch (e) {
            v.innerHTML += `<div class="card empty">${esc(e.message)}</div>`;
            return;
          }
          const none = !r.users.length && !r.gifts.length && !r.transactions.length && !r.content.length;
          v.innerHTML =
            head(`Search: “${esc(q)}”`, 'Users, gifts, transactions and content.') +
            `<div class="card sr">${none ? '<div class="empty">Nothing found. Try a username or part of a name.</div>' : ''}
      ${r.users.length ? `<h4>Users</h4><div class="list">${r.users.map(u => `<a class="li" href="#/user/${u.id}" style="text-decoration:none;color:inherit">${avatar(u.name)}<div class="t"><b>${esc(u.name)}</b><small>@${esc(u.username)} · joined ${dday(u.created_at)}</small></div>${statusPill(u.status)}</a>`).join('')}</div>` : ''}
      ${r.gifts.length ? `<h4>Gifts</h4><div class="list">${r.gifts.map(g => `<a class="li" href="#/gifts" style="text-decoration:none;color:inherit"><div class="t"><b>${esc(g.name)}</b><small>${g.price ? num(g.price) + ' coins' : 'Free'}</small></div>${g.deleted ? '<span class="pill p-mut">Removed</span>' : g.active ? '<span class="pill p-ok">On sale</span>' : '<span class="pill p-warn">Hidden</span>'}</a>`).join('')}</div>` : ''}
      ${r.transactions.length ? `<h4>Transactions</h4><div class="list">${r.transactions.map(t => `<div class="li"><div class="t"><b>${esc(t.what)}</b><small>${esc(t.kind)} · @${esc(t.who)} · ${dt(t.at)}</small></div><span class="mono">${num(t.amount)}</span></div>`).join('')}</div>` : ''}
      ${r.content.length ? `<h4>Content</h4><div class="list">${r.content.map(c => `<a class="li" href="#/content" style="text-decoration:none;color:inherit"><div class="t"><b>${esc(c.title)}</b><small>${esc(c.kind)}</small></div><span class="pill ${c.status === 'published' ? 'p-ok' : 'p-mut'}">${c.status === 'published' ? 'Live' : 'Hidden'}</span></a>`).join('')}</div>` : ''}</div>`;
        },
      };

      boot();
    </script>

    <style id="mobCards">
      @media (max-width: 720px) {
        .tw { margin: 0 !important; padding: 0 !important; overflow: visible !important; }
        .tw table, .tw tbody, .tw tr, .tw td { display: block; width: 100%; }
        .tw thead { display: none; }
        .tw tr { border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; margin: 0 0 10px; background: var(--panel2); }
        .tw tr:hover { background: var(--panel2); }
        .tw td { border: 0 !important; padding: 6px 0 !important; display: flex; align-items: center; justify-content: space-between; gap: 12px; text-align: right; white-space: normal !important; min-width: 0; }
        .tw td > * { min-width: 0; }
        .tw td[data-l]::before { content: attr(data-l); flex: none; color: var(--mut); font-size: 12px; font-weight: 600; text-align: left; }
        .tw td:first-child { justify-content: flex-start; text-align: left; font-size: 14.5px; }
        .tw td:first-child::before { display: none; }
        .tw td:empty { display: none; }
        .tw td .row-act, .tw td:last-child { flex-wrap: wrap; }
        .tw td:last-child:not([data-l]) { justify-content: flex-end; padding-top: 8px !important; }
        .ab-grid { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
      }
      #mNav { display: none; }
      @media (max-width: 900px) {
        #mNav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; gap: 2px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; box-shadow: 0 -8px 24px rgba(0,0,0,.18); }
        #mNav::-webkit-scrollbar { display: none; }
        #mNav a { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 12px; color: var(--mut); font-size: 10.5px; font-weight: 700; text-decoration: none; position: relative; white-space: nowrap; }
        #mNav a svg { width: 21px; height: 21px; flex: none; }
        #mNav a span:not(.cnt):not(:has(svg)) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 9.5px; }
        #mNav a.on, #mNav a.active, #mNav a[aria-current] { color: var(--acc, #ff9a1f); background: color-mix(in srgb, var(--acc, #ff9a1f) 12%, transparent); }
        #mNav .cnt { position: absolute; top: 2px; right: 10px; font-size: 9px; }
        .view { padding-bottom: calc(90px + env(safe-area-inset-bottom)) !important; }
        #subnav { overflow-x: auto; scrollbar-width: none; }
        #subnav::-webkit-scrollbar { display: none; }
        #subnav a, #subnav button { flex: none; }
        .ab-grid > * { padding: 10px !important; min-width: 0; }
        .ab-grid small, .ab-grid p { font-size: 11.5px; }
      }
    </style>
    <script>
      (function () {
        function label() {
          document.querySelectorAll('.tw table').forEach(function (t) {
            var hs = [].map.call(t.querySelectorAll('thead th'), function (h) { return h.textContent.replace(/[▲▼↑↓]/g, '').trim(); });
            if (!hs.length) return;
            t.querySelectorAll('tbody tr').forEach(function (tr) {
              [].forEach.call(tr.children, function (td, i) {
                if (td.tagName === 'TD' && !td.hasAttribute('data-l') && hs[i] && td.colSpan < 2) td.setAttribute('data-l', hs[i]);
              });
            });
          });
        }
        var q = 0;
        new MutationObserver(function () { if (!q) q = requestAnimationFrame(function () { q = 0; label(); }); }).observe(document.body, { childList: true, subtree: true });
        label();
      })();
      (function () {
        function build() {
          var nav = document.getElementById('nav');
          if (!nav) return;
          var m = document.getElementById('mNav');
          if (!m) { m = document.createElement('nav'); m.id = 'mNav'; m.setAttribute('aria-label', 'Sections'); document.body.appendChild(m); }
          var h = nav.innerHTML;
          if (m._h !== h) { m._h = h; m.innerHTML = h; [].forEach.call(m.querySelectorAll('[id]'), function (e) { e.removeAttribute('id'); }); var SH = { overview: 'Home', players: 'Players', rewards: 'Gifts', live: 'Events', community: 'Chat', economy: 'Market', settings: 'Settings' }; [].forEach.call(m.querySelectorAll('a[data-g]'), function (a) { var sp = [].filter.call(a.querySelectorAll('span:not(.cnt)'), function (x) { return !x.querySelector('svg') && !x.children.length; }).pop(); if (sp && SH[a.dataset.g]) sp.textContent = SH[a.dataset.g]; }); }
        }
        setInterval(build, 700);
        addEventListener('hashchange', function () { setTimeout(build, 50); });
      })();
    </script>
  </body>
