      :root {
        --bg: #f5f6f9;
        --panel: #fff;
        --panel2: #f3f4f8;
        --line: #e7e8ef;
        --line2: #d9dbe6;
        --tx: #151827;
        --mut: #61677c;
        --dim: #9aa0b2;
        --brand: #f06a0f;
        --brand-d: #d95d08;
        --brand-soft: #fff1e3;
        --up: #0f9f76;
        --up-soft: #e3f6ef;
        --dn: #e5484d;
        --dn-soft: #fdeceb;
        --warn: #c27c0e;
        --warn-soft: #fdf3dc;
        --info: #2f6fe4;
        --info-soft: #e7effd;
        --shadow: 0 1px 2px rgba(16, 20, 40, 0.05), 0 6px 20px -12px rgba(16, 20, 40, 0.18);
        --r: 14px;
        --sans: 'PB Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: 'PB Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --c1: #f07a12;
        --c2: #0f9f76;
        --c3: #7c5cff;
        --c4: #2f6fe4;
        --c5: #d9467a;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #07070b;
        --panel: #111116;
        --panel2: #18181f;
        --line: rgba(255, 255, 255, 0.075);
        --line2: rgba(255, 255, 255, 0.13);
        --tx: #f3f4f8;
        --mut: #8f94a5;
        --dim: #5c6173;
        --brand: #ff9a26;
        --brand-d: #ff7a14;
        --brand-soft: rgba(255, 150, 40, 0.12);
        --up: #22d67a;
        --up-soft: rgba(34, 214, 122, 0.12);
        --dn: #ff5b4f;
        --dn-soft: rgba(255, 91, 79, 0.13);
        --warn: #ffc043;
        --warn-soft: rgba(255, 192, 67, 0.13);
        --info: #6d9eff;
        --info-soft: rgba(109, 158, 255, 0.13);
        --shadow: 0 14px 34px -24px rgba(0, 0, 0, 0.9);
        --c1: #ff9a26;
        --c2: #22d67a;
        --c3: #9d7bff;
        --c4: #6d9eff;
        --c5: #ff5b8a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font: 14px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--brand);
      }
      a.btn {
        text-decoration: none;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--mut);
      }
      .small {
        font-size: 12.5px;
      }
      svg.i {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- auth ---------- */
      .auth {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(900px 400px at 50% -120px, var(--brand-soft), transparent 70%), var(--bg);
      }
      .auth-card {
        width: min(400px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px;
        box-shadow: var(--shadow);
      }
      .auth-card h1 {
        margin: 14px 0 4px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .auth-card p {
        margin: 0 0 18px;
        color: var(--mut);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .logo .mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: block;
        overflow: hidden;
        flex: none;
        box-shadow: 0 4px 12px -4px rgba(65, 34, 201, 0.5);
      }
      .logo .mark svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .logo small {
        font-weight: 700;
        color: var(--mut);
        font-size: 11px;
        border: 1px solid var(--line2);
        border-radius: 6px;
        padding: 1px 6px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      label.f {
        display: block;
        margin-bottom: 12px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--mut);
      }
      label.f > span {
        display: block;
        margin-bottom: 5px;
      }
      .in,
      select.in,
      textarea.in {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line2);
        border-radius: 10px;
        background: var(--panel);
        padding: 0 12px;
        outline: 0;
        color: var(--tx);
        font-size: 14px;
      }
      textarea.in {
        height: auto;
        min-height: 90px;
        padding: 10px 12px;
        resize: vertical;
        line-height: 1.5;
      }
      .in:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      .err {
        color: var(--dn);
        font-size: 13px;
        min-height: 18px;
        margin: 4px 0 8px;
      }

      /* ---------- buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--line2);
        background: var(--panel);
        color: var(--tx);
        font-weight: 650;
        font-size: 13.5px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover {
        background: var(--panel2);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.pri {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .btn.pri:hover {
        background: var(--brand-d);
      }
      .btn.dan {
        background: var(--dn);
        border-color: var(--dn);
        color: #fff;
      }
      .btn.dan:hover {
        filter: brightness(0.95);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--panel2);
      }
      .btn.sm {
        height: 30px;
        padding: 0 10px;
        font-size: 12.5px;
        border-radius: 8px;
      }
      .btn.block {
        width: 100%;
        height: 42px;
      }
      .btn.icon {
        width: 36px;
        padding: 0;
      }
      .btn.sm.icon {
        width: 30px;
      }

      /* ---------- layout ---------- */
      .app {
        display: grid;
        grid-template-columns: 248px 1fr;
        min-height: 100%;
      }
      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        z-index: 40;
      }
      .side .logo {
        padding: 4px 8px 18px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: auto;
        flex: 1;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        border-radius: 10px;
        color: var(--mut);
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        position: relative;
      }
      .nav a:hover {
        background: var(--panel2);
        color: var(--tx);
      }
      .nav a.on {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .nav a.on::before {
        content: '';
        position: absolute;
        left: -12px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--brand);
      }
      .nav .sec {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 14px 12px 6px;
      }
      .nav .cnt {
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        background: var(--dn);
        color: #fff;
        border-radius: 8px;
        padding: 0 6px;
      }
      .me {
        border-top: 1px solid var(--line);
        padding: 12px 6px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand);
        display: grid;
        place-items: center;
        font-weight: 800;
        flex: none;
        text-transform: uppercase;
      }
      .me b {
        display: block;
        font-size: 13.5px;
      }
      .me .role {
        font-size: 11.5px;
      }
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .search {
        position: relative;
        flex: 1;
        max-width: 520px;
      }
      .search .in {
        padding-left: 38px;
        height: 38px;
        background: var(--panel);
      }
      .search svg {
        position: absolute;
        left: 12px;
        top: 10px;
        color: var(--dim);
      }
      .search kbd {
        position: absolute;
        right: 10px;
        top: 9px;
        font: 11px var(--mono);
        color: var(--dim);
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 1px 5px;
      }
      .top .sp {
        flex: 1;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 13px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .pill i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .p-ok {
        background: var(--up-soft);
        color: var(--up);
      }
      .p-dn {
        background: var(--dn-soft);
        color: var(--dn);
      }
      .p-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .p-info {
        background: var(--info-soft);
        color: var(--info);
      }
      .p-mut {
        background: var(--panel2);
        color: var(--mut);
      }
      .p-brand {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .burger {
        display: none;
      }
      .view {
        padding: 24px;
        max-width: 1360px;
        width: 100%;
        margin: 0 auto;
      }
      .ph {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .ph h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .ph p {
        margin: 4px 0 0;
        color: var(--mut);
      }
      .ph .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---------- cards, kpis ---------- */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 18px;
        min-width: 0;
      }
      .card + .card {
        margin-top: 16px;
      }
      .card-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .card-h h3 {
        margin: 0;
        font-size: 15px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .kpi small {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mut);
        font-weight: 650;
        font-size: 12.5px;
      }
      .kpi small .ic {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand);
      }
      .kpi b {
        display: block;
        font-size: 26px;
        letter-spacing: -0.02em;
        margin: 10px 0 2px;
        font-weight: 750;
      }
      .kpi em {
        font-style: normal;
        font-size: 12.5px;
        color: var(--mut);
      }
      .kpi em .up {
        color: var(--up);
        font-weight: 700;
      }
      .kpi.c2 small .ic {
        background: var(--up-soft);
        color: var(--up);
      }
      .kpi.c3 small .ic {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .kpi.c4 small .ic {
        background: var(--info-soft);
        color: var(--info);
      }
      .kpi.c5 small .ic {
        background: var(--dn-soft);
        color: var(--dn);
      }

      /* ---------- tables ---------- */
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .tools .in {
        height: 36px;
        width: auto;
        min-width: 200px;
        flex: 1;
        max-width: 320px;
      }
      .tools select.in {
        min-width: 140px;
        flex: none;
      }
      .tabs {
        display: inline-flex;
        background: var(--panel2);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 0;
        background: transparent;
        padding: 6px 12px;
        border-radius: 8px;
        font-weight: 650;
        font-size: 13px;
        color: var(--mut);
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--panel);
        color: var(--tx);
        box-shadow: 0 1px 2px rgba(16, 20, 40, 0.12);
      }
      .tw {
        overflow-x: auto;
        margin: 0 -18px;
        padding: 0 18px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        font-weight: 750;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        user-select: none;
      }
      th.s {
        cursor: pointer;
      }
      th.s:hover {
        color: var(--tx);
      }
      th.s::after {
        content: '';
        display: inline-block;
        width: 0;
        height: 0;
        margin-left: 6px;
        border: 4px solid transparent;
        vertical-align: 1px;
        opacity: 0.35;
        border-top-color: currentColor;
        border-bottom: 0;
      }
      th.s.asc::after {
        border-top: 0;
        border-bottom: 4px solid currentColor;
        opacity: 1;
      }
      th.s.desc::after {
        opacity: 1;
      }
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr.click {
        cursor: pointer;
      }
      tbody tr.click:hover td {
        background: var(--panel2);
      }
      td.r,
      th.r {
        text-align: right;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .who .av {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
      .who b {
        display: block;
        font-size: 13.5px;
      }
      .who small {
        color: var(--mut);
        font-size: 12px;
      }
      .pos {
        color: var(--up);
      }
      .neg {
        color: var(--dn);
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
        color: var(--mut);
        font-size: 13px;
      }
      .pager .btns {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .empty {
        text-align: center;
        color: var(--mut);
        padding: 32px 12px;
      }
      .loading {
        padding: 30px;
        text-align: center;
        color: var(--mut);
      }
      .skel {
        height: 14px;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--panel2), var(--line), var(--panel2));
        background-size: 200% 100%;
        animation: sk 1.2s infinite;
      }
      @keyframes sk {
        to {
          background-position: -200% 0;
        }
      }

      /* ---------- charts ---------- */
      .chart {
        width: 100%;
        height: 220px;
        position: relative;
      }
      .chart svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .chart .grid line {
        stroke: var(--line);
        stroke-width: 1;
      }
      .chart .ax {
        fill: var(--dim);
        font: 10.5px var(--mono);
      }
      .chart .tip {
        position: absolute;
        pointer-events: none;
        background: var(--tx);
        color: var(--panel);
        font-size: 12px;
        padding: 6px 9px;
        border-radius: 8px;
        white-space: nowrap;
        transform: translate(-50%, -110%);
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 2;
      }
      .chart .tip b {
        font-family: var(--mono);
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--mut);
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }

      /* ---------- lists ---------- */
      .list {
        display: flex;
        flex-direction: column;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .li:last-child {
        border-bottom: 0;
      }
      .li .t {
        flex: 1;
        min-width: 0;
      }
      .li .t > b {
        display: block;
        font-size: 13.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .li .t small {
        color: var(--mut);
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }

      /* ---------- profile ---------- */
      .prof {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .prof .av {
        width: 56px;
        height: 56px;
        font-size: 20px;
      }
      .prof h2 {
        margin: 0;
        font-size: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .stat {
        background: var(--panel2);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .stat small {
        display: block;
        color: var(--mut);
        font-size: 11.5px;
        font-weight: 650;
      }
      .stat b {
        font-size: 16px;
      }
      .actbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .tl {
        position: relative;
        padding-left: 18px;
      }
      .tl::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--line);
      }
      .tl .e {
        position: relative;
        padding: 6px 0 10px;
      }
      .tl .e::before {
        content: '';
        position: absolute;
        left: -18px;
        top: 11px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--brand);
      }
      .tl .e b {
        font-size: 13px;
      }
      .tl .e small {
        display: block;
        color: var(--mut);
        font-size: 12px;
      }
      .kv {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 8px 12px;
        font-size: 13.5px;
      }
      .kv dt {
        color: var(--mut);
      }
      .kv dd {
        margin: 0;
        min-width: 0;
        word-break: break-word;
      }

      /* ---------- switches ---------- */
      .sw {
        position: relative;
        display: inline-block;
        vertical-align: middle;
        width: 42px;
        height: 24px;
        flex: none;
      }
      .sw input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: var(--line2);
        border-radius: 12px;
        transition: 0.18s;
        cursor: pointer;
      }
      .sw span::after {
        content: '';
        position: absolute;
        left: 3px;
        top: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: 0.18s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .sw input:checked + span {
        background: var(--up);
      }
      .sw input:checked + span::after {
        transform: translateX(18px);
      }
      .sw input:disabled + span {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .live {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 10px 4px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel2);
        font-size: 12px;
      }
      .live i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--mut);
        flex: none;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      }
      .live[data-s='on'] i {
        background: #22c55e;
        animation: livePulse 2.4s ease-out infinite;
      }
      .live[data-s='off'] i {
        background: var(--warn);
      }
      .live.blip i {
        animation: liveBlip 0.9s ease-out;
      }
      .live b {
        display: block;
        font-size: 12px;
      }
      .live small {
        display: block;
        color: var(--mut);
        font-size: 11px;
        line-height: 1.25;
      }
      @keyframes livePulse {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
        70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      @keyframes liveBlip {
        0% { transform: scale(1); background: #fff; }
        100% { transform: scale(1); }
      }
      .ovin {
        width: 110px;
        text-align: right;
        padding: 6px 8px;
      }
      .ovin.set {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      tr.off td {
        opacity: 0.55;
      }
      tr.off td:last-child {
        opacity: 1;
      }
      .feat {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .feat:last-child {
        border-bottom: 0;
      }
      .feat .t {
        flex: 1;
      }
      .feat b {
        display: block;
      }
      .feat small {
        color: var(--mut);
      }
      .danger-zone {
        border-color: color-mix(in srgb, var(--dn) 40%, var(--line));
      }
      .mbig {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border-radius: 12px;
        background: var(--panel2);
        margin-bottom: 12px;
      }
      .mbig.on {
        background: var(--dn-soft);
      }
      .mbig .t {
        flex: 1;
      }
      .mbig b {
        font-size: 16px;
      }

      /* ---------- modal + toast ---------- */
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 12, 22, 0.45);
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 16px;
        animation: fi 0.15s ease-out;
      }
      @keyframes fi {
        from {
          opacity: 0;
        }
      }
      .modal {
        width: min(520px, 100%);
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5);
        animation: mi 0.18s ease-out;
      }
      @keyframes mi {
        from {
          transform: translateY(8px) scale(0.98);
          opacity: 0;
        }
      }
      .modal.wide {
        width: min(760px, 100%);
      }
      .mh {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 20px 0;
      }
      .mh h3 {
        margin: 0;
        font-size: 17px;
        flex: 1;
      }
      .mb {
        padding: 14px 20px;
      }
      .mf {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 20px 18px;
        flex-wrap: wrap;
      }
      .warnbox {
        display: flex;
        gap: 10px;
        padding: 12px;
        border-radius: 10px;
        background: var(--dn-soft);
        color: var(--dn);
        font-size: 13px;
        margin-bottom: 12px;
      }
      .toasts {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, calc(100vw - 32px));
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--up);
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.35);
        animation: mi 0.2s ease-out;
        font-size: 13.5px;
      }
      .toast.err {
        border-left-color: var(--dn);
      }
      .toast svg {
        margin-top: 1px;
      }
      .toast.ok svg {
        color: var(--up);
      }
      .toast.err svg {
        color: var(--dn);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--brand-soft);
        color: var(--brand);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 12.5px;
        font-weight: 650;
      }
      .chip button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        line-height: 1;
      }
      .pick {
        position: relative;
      }
      .pick .drop {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        box-shadow: var(--shadow);
        z-index: 5;
        max-height: 220px;
        overflow: auto;
      }
      .pick .drop button {
        display: flex;
        width: 100%;
        gap: 10px;
        align-items: center;
        border: 0;
        background: none;
        padding: 8px 12px;
        text-align: left;
        cursor: pointer;
      }
      .pick .drop button:hover {
        background: var(--panel2);
      }
      .sr h4 {
        margin: 18px 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mut);
      }
      pre.json {
        margin: 0;
        font: 12px/1.5 var(--mono);
        background: var(--panel2);
        border-radius: 8px;
        padding: 8px 10px;
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 520px;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 1100px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 264px;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          box-shadow: 20px 0 40px rgba(0, 0, 0, 0.2);
        }
        .app.open .side {
          transform: none;
        }
        .scrim {
          position: fixed;
          inset: 0;
          background: rgba(10, 12, 22, 0.4);
          z-index: 35;
        }
        .burger {
          display: inline-flex;
        }
        .g2,
        .g3 {
          grid-template-columns: 1fr;
        }
        .top {
          padding: 10px 14px;
        }
        .view {
          padding: 16px 14px;
        }
        .search kbd {
          display: none;
        }
        .top .sp {
          display: none;
        }
        .search {
          max-width: none;
        }
      }
      @media (max-width: 560px) {
        .kpis {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .kpi {
          padding: 12px;
        }
        .kpi b {
          font-size: 21px;
        }
        .card {
          padding: 14px;
        }
        .tw {
          margin: 0 -14px;
          padding: 0 14px;
        }
        .ph h1 {
          font-size: 21px;
        }
        .tools .in {
          max-width: none;
          min-width: 0;
          width: 100%;
          flex-basis: 100%;
        }
        .top .role-pill {
          display: none;
        }
        .kv {
          grid-template-columns: 1fr;
        }
        .kv dt {
          margin-top: 6px;
        }
        .in,
        select.in,
        textarea.in {
          font-size: 16px;
        }
        .mf .btn {
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      /* ---------- PackVerse look ---------- */
      :root {
        --vg: linear-gradient(95deg, #ffb52e 0%, #ff6a1f 100%);
        --vglow: 0 8px 24px -8px rgba(255, 120, 30, 0.6);
      }
      .btn.pri {
        background: var(--vg);
        border: 0;
        color: #1b1206;
        font-weight: 800;
        box-shadow: var(--vglow);
      }
      .btn.pri:hover {
        background: var(--vg);
        filter: brightness(1.06);
      }
      .tabs button.on {
        background: var(--vg);
        color: #1b1206;
        box-shadow: 0 6px 16px -8px rgba(255, 120, 30, 0.8);
      }
      .kpi b {
        letter-spacing: -0.02em;
      }
      .kpi small,
      .stat small,
      th,
      .sec,
      .nav .sec,
      label.f > span {
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-size: 11px;
      }
      :root[data-theme='dark'] body {
        background:
          radial-gradient(1.2px 1.2px at 11% 23%, rgba(255, 255, 255, 0.5) 50%, transparent 52%),
          radial-gradient(1px 1px at 37% 71%, rgba(255, 255, 255, 0.4) 50%, transparent 52%),
          radial-gradient(1.4px 1.4px at 63% 12%, rgba(255, 255, 255, 0.45) 50%, transparent 52%),
          radial-gradient(1px 1px at 82% 58%, rgba(255, 255, 255, 0.35) 50%, transparent 52%),
          radial-gradient(900px 520px at 88% -8%, rgba(122, 76, 255, 0.14), transparent 62%),
          radial-gradient(760px 460px at -6% 104%, rgba(255, 120, 40, 0.08), transparent 60%), #07070b;
        background-size:
          340px 340px,
          260px 260px,
          420px 420px,
          300px 300px,
          auto,
          auto,
          auto;
        background-attachment: fixed;
      }
      :root[data-theme='dark'] .card,
      :root[data-theme='dark'] .kpi,
      :root[data-theme='dark'] .auth-card,
      :root[data-theme='dark'] .modal {
        background: linear-gradient(180deg, #14141a, #101015);
        border-color: var(--line);
      }
      :root[data-theme='dark'] .side {
        background: #09090d;
      }
      :root[data-theme='dark'] .top {

      /* ---------- v3 polish ---------- */
      @keyframes gFloat {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(18px, -22px) scale(1.08);
        }
      }
      @keyframes gShake {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(5px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-9px);
        }
        40%,
        60% {
          transform: translateX(9px);
        }
      }
      @keyframes gPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @keyframes gIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* code gate */
      .gate {

        overflow: hidden;

      .gate-card {

      .gate-logo .mark {

      .gate-brand {

      .pin {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 0 auto 6px;
        cursor: text;
      }
      .pin input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        font-size: 16px;
        caret-color: transparent;
      }
      .pin i {
        width: 50px;
        height: 60px;
        border-radius: 14px;
        border: 1.5px solid var(--line);
        background: var(--panel2);
        display: grid;
        place-items: center;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          transform 0.15s;
      }
      .pin i::after {
        content: '';
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--vg);
        transform: scale(0);
        transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
        box-shadow: 0 0 14px rgba(255, 140, 40, 0.8);
      }
      .pin i.on::after {
        transform: scale(1);
      }
      .pin i.on {
        border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
      }
      .pin i.cur {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px var(--brand-soft);
        transform: translateY(-2px);
      }
      .pin.busy i::after {
        animation: gPulse 0.8s infinite;
      }
      .pin.ok i {
        border-color: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
      }
      .pin.ok i::after {
        background: #22c55e;
        box-shadow: 0 0 14px rgba(34, 197, 94, 0.8);
      }
      .pin.shake {
        animation: gShake 0.45s;

      .gate .err {

      /* dashboard hero */

      /* KPI cards */

        animation-delay: 0.06s;

        animation-delay: 0.09s;

        animation-delay: 0.12s;

        animation-delay: 0.15s;

      /* headings, cards, tables, nav */

      function chart(el, { labels, series, type = 'line', fmt = v => num(v), stacked }) {

        for (let k = 0; k <= 4; k++) {
          const v = (mx * k) / 4,
            yy = y(v).toFixed(1);
          g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 8}" y="${+yy + 3.5}" text-anchor="end">${esc(fmtShort(v))}</text>`;
        }
        g += '</g>';
        const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));
        let xl = '';
        labels.forEach((l, i) => {
          if (i % step === 0 || i === n - 1)
            xl += `<text class="ax" x="${(type === 'bar' ? bx(i) : x(i)).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`;
        });
        let body = '';
        if (type === 'line')
          series.forEach(s => {
            const pts = s.data.map((v, i) => [x(i), y(+v || 0)]),
              d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
            const id = 'g' + Math.random().toString(36).slice(2, 8);
            body +=
              `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>` +
              (series.length === 1
                ? `<path d="${d}L${x(n - 1).toFixed(1)},${T + ih}L${x(0).toFixed(1)},${T + ih}Z" fill="url(#${id})"/>`
                : '') +
              `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
          });
        else
          labels.forEach((_, i) => {
            let acc = 0;
            series.forEach((s, k) => {
              const v = +s.data[i] || 0;
              if (!v) return;
              const w = stacked ? bw : bw / series.length,
                xx = stacked ? bx(i) - bw / 2 : bx(i) - bw / 2 + k * w;
              const y0 = y(acc + (stacked ? v : v)),
                h = y(stacked ? acc : 0) - y0;
              body += `<rect x="${xx.toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(1, w - 1).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="2" fill="${s.color}"/>`;
              if (stacked) acc += v;
            });
          });
        el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${g}${body}${xl}<line class="hov" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--mut)" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip"></div>`;

            Math.min(

      function activityStrip(events) {
        const days = new Set((events || []).filter(e => ['active', 'signup', 'login'].includes(e.kind)).map(e => new Date(e.created_at).toDateString()));
        const out = [];
        for (let i = 13; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const on = days.has(d.toDateString());
          out.push(`<i class="${on ? 'on' : ''}" title="${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}${on ? ' · played' : ''}"></i>`);
        }
        const n = [...days].filter(x => Date.now() - new Date(x) < 14 * 864e5).length;

      /* ---------- users CSV export ---------- */
      async function fetchAllUsers(st, max = 20000) {
        const all = [];
        for (let page = 1; page <= 200; page++) {
          const r = await A('pba_users', { p_q: st.q, p_status: st.status, p_sort: st.sort, p_dir: st.dir, p_page: page, p_per: 100, p_joined: st.joined || null, p_seen: st.seen || null, p_tag: st.tag || null });
          all.push(...r.rows);
          if (all.length >= r.total || !r.rows.length || all.length >= max) break;
        }
        return all;
      }
      function downloadCSV(rows, name) {
        if (!rows.length) return toast('Nothing to export.', 'err');
        const keys = Object.keys(rows[0]).filter(k => rows.some(u => u[k] !== null && typeof u[k] !== 'object'));
        const q = v => {
          const s = v == null ? '' : String(v);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };

            rows = await A('pba_admins');
          } catch (e) {
            box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
            return;
          }
          this.rows = rows;
          box.innerHTML = `<div class="tw"><table><thead><tr><th>Admin</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Added</th><th class="r">Actions</th></tr></thead><tbody>${rows
            .map(
              a => `<tr><td><div class="who">${avatar(a.username)}<div><b>${esc(a.username)}${a.me ? ' <span class="pill p-brand" style="height:20px">You</span>' : ''}</b></div></div></td><td>${rolePill(a.role)}</td>
      <td>${a.disabled ? '<span class="pill p-mut"><i></i>Disabled</span>' : '<span class="pill p-ok"><i></i>Active</span>'}</td><td>${ago(a.last_login)}</td><td>${dday(a.created_at)}</td>
      <td class="r">${a.me ? '<span class="small muted">Use the key icon to change your password</span>' : `<div style="display:inline-flex;gap:6px"><button class="btn sm" data-ed="${esc(a.username)}">Edit</button><button class="btn sm" data-dis="${esc(a.username)}">${a.disabled ? 'Enable' : 'Disable'}</button><button class="btn sm icon" data-rm="${esc(a.username)}" aria-label="Remove" title="Remove">${IC.trash}</button></div>`}</td></tr>`
            )
            .join('')}</tbody></table></div>`;
          const by = u => this.rows.find(a => a.username === u);
          $$('[data-ed]', box).forEach(b => (b.onclick = () => this.edit(by(b.dataset.ed))));
          $$('[data-dis]', box).forEach(
            b =>
              (b.onclick = async () => {
                const a = by(b.dataset.dis);
                if (!a.disabled) {
                  const r = await confirmBox({
                    title: `Disable ${a.username}?`,
                    text: 'They’ll be signed out and can’t sign in until re-enabled.',
                    ok: 'Disable',
                  });
                  if (!r) return;
                }
                try {
                  await act(
                    A('pba_admin_save', {
                      p_username: a.username,
                      p_password: null,
                      p_role: a.role,
                      p_disabled: !a.disabled,
                    }),
                    a.disabled ? 'Admin enabled' : 'Admin disabled'
                  );
                  this.load();
                } catch (e) {}
              })
          );
          $$('[data-rm]', box).forEach(
            b =>
              (b.onclick = async () => {
                const a = by(b.dataset.rm);
                const r = await confirmBox({
                  title: `Remove ${a.username}?`,
                  text: 'Their admin account is deleted. The audit log keeps their past actions.',
                  ok: 'Remove admin',
                  type: a.username,
                });
                if (!r) return;
                try {
                  await act(A('pba_admin_delete', { p_username: a.username }), 'Admin removed');
                  this.load();
                } catch (e) {}
              })
          );
        },
        edit(a) {
          const n = !a;
          modal({
            title: n ? 'Add an admin' : `Edit ${a.username}`,
            ok: n ? 'Add admin' : 'Save',
            body: `
      <label class="f"><span>Username</span><input class="in" id="xU" ${n ? '' : 'disabled'} value="${esc(a ? a.username : '')}" autocomplete="off"></label>
      <label class="f"><span>Role</span><select class="in" id="xR">${['moderator', 'admin', 'owner'].map(r => `<option value="${r}" ${a && a.role === r ? 'selected' : ''}>${r[0].toUpperCase() + r.slice(1)}</option>`).join('')}</select></label>
      <label class="f"><span>${n ? 'Password (10+ characters)' : 'New password (leave empty to keep)'}</span><input class="in" id="xP" type="text" autocomplete="off"></label><div class="err"></div>`,
            onOk: async ov => {
              const role = $('#xR', ov).value;
              if (role === 'owner' && (!a || a.role !== 'owner')) {
                if (
                  !(await confirmBox({
                    title: 'Make them an owner?',
                    text: 'Owners have full control, including over other admins.',
                    ok: 'Yes, make owner',
                  }))
                )
                  return false;
              }
              await A('pba_admin_save', {
                p_username: n ? $('#xU', ov).value.trim() : a.username,
                p_password: $('#xP', ov).value || null,
                p_role: role,
                p_disabled: a ? a.disabled : false,
              });
              toast(n ? 'Admin added' : 'Admin updated');
              this.load();
            },
          });
        },
      };
      VIEWS.admins.role = 'owner';

      /* ---------- audit log ---------- */
      VIEWS.audit = {
        role: 'admin',
        st: { q: '', action: 'all', page: 1, per: 30 },
        render(v) {
          const st = this.st;
          v.innerHTML =
            head(
              'Audit log',
              'Every admin action: who did it, what changed and when. Entries can’t be edited or deleted.',
              `<button class="btn" id="lCsv">${IC.dl}Export CSV</button>`
            ) +
            `<div class="card"><div class="tools"><input class="in" id="lq" placeholder="Search admin, action or target" value="${esc(st.q)}">
      <select class="in" id="la">${[
        ['all', 'All actions'],
        ['user_', 'User actions'],
        ['gift_', 'Gifts'],
        ['content_', 'Content'],
        ['maintenance', 'Maintenance'],
        ['features', 'Features'],
        ['admin_', 'Admin accounts'],
        ['promo_', 'Promo codes'],
        ['login', 'Sign-ins'],
        ['code_', 'Access code'],
      ]
        .map(([k, l]) => `<option value="${k}" ${st.action === k ? 'selected' : ''}>${l}</option>`)
        .join('')}</select></div><div id="lt">${skeleton(6)}</div></div>`;
          $('#lCsv').onclick = async () => {
            const b = $('#lCsv');
            b.disabled = true;
            try {
              const all = [];
              for (let page = 1; page <= 100; page++) {
                const r = await A('pba_audit', { p_q: st.q, p_action: st.action, p_page: page, p_per: 100 });
                all.push(...r.rows);
                if (all.length >= r.total || !r.rows.length) break;
              }
              downloadCSV(all.map(x => ({ ...x, details: x.details ? JSON.stringify(x.details) : '' })), 'audit');
            } catch (e) {
              toast(e.message, 'err');
            }
            b.disabled = false;
          };
          $('#lq').oninput = debounce(e => {
            st.q = e.target.value;
            st.page = 1;
            this.load();
          });
          $('#la').onchange = e => {
            st.action = e.target.value;
            st.page = 1;
            this.load();
          };
          this.load();
        },
        async load() {
          const st = this.st,
            box = $('#lt');
          if (!box) return;
          let r;
          try {
            r = await A('pba_audit', { p_q: st.q, p_action: st.action, p_page: st.page, p_per: st.per });
          } catch (e) {
            box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
            return;
          }
          box.innerHTML = r.rows.length
            ? `<div class="tw"><table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Changes</th></tr></thead><tbody>${r.rows
                .map(
                  a => `<tr><td>${dt(a.created_at)}</td><td>${esc(a.admin_name || 'system')} ${a.admin_role ? `<span class="muted small">${esc(a.admin_role)}</span>` : ''}</td>
      <td><b>${esc(actLabel(a.action))}</b></td><td>${a.target_type === 'user' && a.target_id ? `<a href="#/user/${esc(a.target_id)}">${esc(a.target_label || a.target_id)}</a>` : esc(a.target_label || '—')}</td>
      <td style="white-space:normal">${a.details ? `<pre class="json">${esc(JSON.stringify(a.details, null, 1))}</pre>` : '<span class="muted">—</span>'}</td></tr>`
                )
                .join('')}</tbody></table></div>${pager(r.total, r.page, r.per)}`
            : '<div class="empty">No entries match.</div>';
          $$('[data-pg]', box).forEach(
            b =>
              (b.onclick = () => {
                st.page = +b.dataset.pg;
                this.load();
              })
          );
        },
      };

      /* ---------- global search ---------- */
      VIEWS.search = {
        async render(v, [q]) {
          q = q || '';
          if ($('#gs')) $('#gs').value = q;
          v.innerHTML =
            head(`Search: “${esc(q)}”`, 'Users, gifts, transactions and content.') +
            `<div class="card">${skeleton(5)}</div>`;
          let r;
          try {
            r = await A('pba_search', { p_q: q });
          } catch (e) {
            v.innerHTML += `<div class="card empty">${esc(e.message)}</div>`;
            return;
          }
          const none = !r.users.length && !r.gifts.length && !r.transactions.length && !r.content.length;
          v.innerHTML =
            head(`Search: “${esc(q)}”`, 'Users, gifts, transactions and content.') +
            `<div class="card sr">${none ? '<div class="empty">Nothing found. Try a username or part of a name.</div>' : ''}
      ${r.users.length ? `<h4>Users</h4><div class="list">${r.users.map(u => `<a class="li" href="#/user/${u.id}" style="text-decoration:none;color:inherit">${avatar(u.name)}<div class="t"><b>${esc(u.name)}</b><small>@${esc(u.username)} · joined ${dday(u.created_at)}</small></div>${statusPill(u.status)}</a>`).join('')}</div>` : ''}
      ${r.gifts.length ? `<h4>Gifts</h4><div class="list">${r.gifts.map(g => `<a class="li" href="#/gifts" style="text-decoration:none;color:inherit"><div class="t"><b>${esc(g.name)}</b><small>${g.price ? num(g.price) + ' coins' : 'Free'}</small></div>${g.deleted ? '<span class="pill p-mut">Removed</span>' : g.active ? '<span class="pill p-ok">On sale</span>' : '<span class="pill p-warn">Hidden</span>'}</a>`).join('')}</div>` : ''}
      ${r.transactions.length ? `<h4>Transactions</h4><div class="list">${r.transactions.map(t => `<div class="li"><div class="t"><b>${esc(t.what)}</b><small>${esc(t.kind)} · @${esc(t.who)} · ${dt(t.at)}</small></div><span class="mono">${num(t.amount)}</span></div>`).join('')}</div>` : ''}
      ${r.content.length ? `<h4>Content</h4><div class="list">${r.content.map(c => `<a class="li" href="#/content" style="text-decoration:none;color:inherit"><div class="t"><b>${esc(c.title)}</b><small>${esc(c.kind)}</small></div><span class="pill ${c.status === 'published' ? 'p-ok' : 'p-mut'}">${c.status === 'published' ? 'Live' : 'Hidden'}</span></a>`).join('')}</div>` : ''}</div>`;
        },
      };

      boot();
    </script>
  </body>
</html>
