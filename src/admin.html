<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <!--__CSP__-->
    <meta name="referrer" content="no-referrer" />
    <script>
      // never let another site frame the admin panel (clickjacking)
      if (window.top !== window.self) { try { window.top.location = window.self.location; } catch (e) { document.documentElement.innerHTML = ''; } }
    </script>
    <title>PAPERBULL Admin</title>
    <link rel="icon" type="image/svg+xml" href="__FAVICON__" />
    <style>
      @font-face {
        font-family: 'PB Sans';
        src: url(data:font/woff2;base64,__SANS__) format('woff2');
        font-weight: 200 800;
        font-display: swap;
      }
      @font-face {
        font-family: 'PB Mono';
        src: url(data:font/woff2;base64,__MONO5__) format('woff2');
        font-weight: 500;
        font-display: swap;
      }
      :root {
        --bg: #f5f6f9;
        --panel: #fff;
        --panel2: #f3f4f8;
        --line: #e7e8ef;
        --line2: #d9dbe6;
        --tx: #151827;
        --mut: #61677c;
        --dim: #9aa0b2;
        --brand: #f06a0f;
        --brand-d: #d95d08;
        --brand-soft: #fff1e3;
        --up: #0f9f76;
        --up-soft: #e3f6ef;
        --dn: #e5484d;
        --dn-soft: #fdeceb;
        --warn: #c27c0e;
        --warn-soft: #fdf3dc;
        --info: #2f6fe4;
        --info-soft: #e7effd;
        --shadow: 0 1px 2px rgba(16, 20, 40, 0.05), 0 6px 20px -12px rgba(16, 20, 40, 0.18);
        --r: 14px;
        --sans: 'PB Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        --mono: 'PB Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --c1: #f07a12;
        --c2: #0f9f76;
        --c3: #7c5cff;
        --c4: #2f6fe4;
        --c5: #d9467a;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #07070b;
        --panel: #111116;
        --panel2: #18181f;
        --line: rgba(255, 255, 255, 0.075);
        --line2: rgba(255, 255, 255, 0.13);
        --tx: #f3f4f8;
        --mut: #8f94a5;
        --dim: #5c6173;
        --brand: #ff9a26;
        --brand-d: #ff7a14;
        --brand-soft: rgba(255, 150, 40, 0.12);
        --up: #22d67a;
        --up-soft: rgba(34, 214, 122, 0.12);
        --dn: #ff5b4f;
        --dn-soft: rgba(255, 91, 79, 0.13);
        --warn: #ffc043;
        --warn-soft: rgba(255, 192, 67, 0.13);
        --info: #6d9eff;
        --info-soft: rgba(109, 158, 255, 0.13);
        --shadow: 0 14px 34px -24px rgba(0, 0, 0, 0.9);
        --c1: #ff9a26;
        --c2: #22d67a;
        --c3: #9d7bff;
        --c4: #6d9eff;
        --c5: #ff5b8a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--tx);
        font: 14px/1.45 var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      a {
        color: var(--brand);
      }
      a.btn {
        text-decoration: none;
      }
      .mono {
        font-family: var(--mono);
        font-variant-numeric: tabular-nums;
      }
      .muted {
        color: var(--mut);
      }
      .small {
        font-size: 12.5px;
      }
      svg.i {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      [hidden] {
        display: none !important;
      }

      /* ---------- auth ---------- */
      .auth {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
        background: radial-gradient(900px 400px at 50% -120px, var(--brand-soft), transparent 70%), var(--bg);
      }
      .auth-card {
        width: min(400px, 100%);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 28px;
        box-shadow: var(--shadow);
      }
      .auth-card h1 {
        margin: 14px 0 4px;
        font-size: 22px;
        letter-spacing: -0.02em;
      }
      .auth-card p {
        margin: 0 0 18px;
        color: var(--mut);
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 800;
        letter-spacing: 0.02em;
      }
      .logo .mark {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        display: block;
        overflow: hidden;
        flex: none;
        box-shadow: 0 4px 12px -4px rgba(65, 34, 201, 0.5);
      }
      .logo .mark svg {
        width: 100%;
        height: 100%;
        display: block;
      }
      .logo small {
        font-weight: 700;
        color: var(--mut);
        font-size: 11px;
        border: 1px solid var(--line2);
        border-radius: 6px;
        padding: 1px 6px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      label.f {
        display: block;
        margin-bottom: 12px;
        font-size: 12.5px;
        font-weight: 700;
        color: var(--mut);
      }
      label.f > span {
        display: block;
        margin-bottom: 5px;
      }
      .in,
      select.in,
      textarea.in {
        width: 100%;
        height: 40px;
        border: 1px solid var(--line2);
        border-radius: 10px;
        background: var(--panel);
        padding: 0 12px;
        outline: 0;
        color: var(--tx);
        font-size: 14px;
      }
      textarea.in {
        height: auto;
        min-height: 90px;
        padding: 10px 12px;
        resize: vertical;
        line-height: 1.5;
      }
      .in:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      .err {
        color: var(--dn);
        font-size: 13px;
        min-height: 18px;
        margin: 4px 0 8px;
      }

      /* ---------- buttons ---------- */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        border: 1px solid var(--line2);
        background: var(--panel);
        color: var(--tx);
        font-weight: 650;
        font-size: 13.5px;
        cursor: pointer;
        white-space: nowrap;
        transition:
          background 0.15s,
          border-color 0.15s;
      }
      .btn:hover {
        background: var(--panel2);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .btn.pri {
        background: var(--brand);
        border-color: var(--brand);
        color: #fff;
      }
      .btn.pri:hover {
        background: var(--brand-d);
      }
      .btn.dan {
        background: var(--dn);
        border-color: var(--dn);
        color: #fff;
      }
      .btn.dan:hover {
        filter: brightness(0.95);
      }
      .btn.ghost {
        border-color: transparent;
        background: transparent;
      }
      .btn.ghost:hover {
        background: var(--panel2);
      }
      .btn.sm {
        height: 30px;
        padding: 0 10px;
        font-size: 12.5px;
        border-radius: 8px;
      }
      .btn.block {
        width: 100%;
        height: 42px;
      }
      .btn.icon {
        width: 36px;
        padding: 0;
      }
      .btn.sm.icon {
        width: 30px;
      }

      /* ---------- layout ---------- */
      .app {
        display: grid;
        grid-template-columns: 248px 1fr;
        min-height: 100%;
      }
      .side {
        position: sticky;
        top: 0;
        height: 100vh;
        background: var(--panel);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 16px 12px;
        z-index: 40;
      }
      .side .logo {
        padding: 4px 8px 18px;
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 2px;
        overflow: auto;
        flex: 1;
      }
      .nav a {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 9px 12px;
        border-radius: 10px;
        color: var(--mut);
        text-decoration: none;
        font-weight: 600;
        cursor: pointer;
        position: relative;
      }
      .nav a:hover {
        background: var(--panel2);
        color: var(--tx);
      }
      .nav a.on {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .nav a.on::before {
        content: '';
        position: absolute;
        left: -12px;
        top: 8px;
        bottom: 8px;
        width: 3px;
        border-radius: 0 3px 3px 0;
        background: var(--brand);
      }
      .nav .sec {
        font-size: 10.5px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--dim);
        padding: 14px 12px 6px;
      }
      .nav .cnt {
        margin-left: auto;
        font-size: 11px;
        font-weight: 700;
        background: var(--dn);
        color: #fff;
        border-radius: 8px;
        padding: 0 6px;
      }
      .me {
        border-top: 1px solid var(--line);
        padding: 12px 6px 0;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .av {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: var(--brand-soft);
        color: var(--brand);
        display: grid;
        place-items: center;
        font-weight: 800;
        flex: none;
        text-transform: uppercase;
      }
      .me b {
        display: block;
        font-size: 13.5px;
      }
      .me .role {
        font-size: 11.5px;
      }
      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 30;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: color-mix(in srgb, var(--bg) 88%, transparent);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 1px solid var(--line);
      }
      .search {
        position: relative;
        flex: 1;
        max-width: 520px;
      }
      .search .in {
        padding-left: 38px;
        height: 38px;
        background: var(--panel);
      }
      .search svg {
        position: absolute;
        left: 12px;
        top: 10px;
        color: var(--dim);
      }
      .search kbd {
        position: absolute;
        right: 10px;
        top: 9px;
        font: 11px var(--mono);
        color: var(--dim);
        border: 1px solid var(--line2);
        border-radius: 5px;
        padding: 1px 5px;
      }
      .top .sp {
        flex: 1;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 26px;
        padding: 0 10px;
        border-radius: 13px;
        font-size: 12px;
        font-weight: 700;
        white-space: nowrap;
      }
      .pill i {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
      }
      .p-ok {
        background: var(--up-soft);
        color: var(--up);
      }
      .p-dn {
        background: var(--dn-soft);
        color: var(--dn);
      }
      .p-warn {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .p-info {
        background: var(--info-soft);
        color: var(--info);
      }
      .p-mut {
        background: var(--panel2);
        color: var(--mut);
      }
      .p-brand {
        background: var(--brand-soft);
        color: var(--brand);
      }
      .burger {
        display: none;
      }
      .view {
        padding: 24px;
        max-width: 1360px;
        width: 100%;
        margin: 0 auto;
      }
      .ph {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .ph h1 {
        margin: 0;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .ph p {
        margin: 4px 0 0;
        color: var(--mut);
      }
      .ph .acts {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      /* ---------- cards, kpis ---------- */
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        box-shadow: var(--shadow);
        padding: 18px;
        min-width: 0;
      }
      .card + .card {
        margin-top: 16px;
      }
      .card-h {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }
      .card-h h3 {
        margin: 0;
        font-size: 15px;
      }
      .grid {
        display: grid;
        gap: 16px;
      }
      .g2 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .g3 {
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin-bottom: 16px;
      }
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--r);
        padding: 16px;
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .kpi small {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--mut);
        font-weight: 650;
        font-size: 12.5px;
      }
      .kpi small .ic {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: var(--brand-soft);
        color: var(--brand);
      }
      .kpi b {
        display: block;
        font-size: 26px;
        letter-spacing: -0.02em;
        margin: 10px 0 2px;
        font-weight: 750;
      }
      .kpi em {
        font-style: normal;
        font-size: 12.5px;
        color: var(--mut);
      }
      .kpi em .up {
        color: var(--up);
        font-weight: 700;
      }
      .kpi.c2 small .ic {
        background: var(--up-soft);
        color: var(--up);
      }
      .kpi.c3 small .ic {
        background: var(--warn-soft);
        color: var(--warn);
      }
      .kpi.c4 small .ic {
        background: var(--info-soft);
        color: var(--info);
      }
      .kpi.c5 small .ic {
        background: var(--dn-soft);
        color: var(--dn);
      }

      /* ---------- tables ---------- */
      .tools {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 12px;
      }
      .tools .in {
        height: 36px;
        width: auto;
        min-width: 200px;
        flex: 1;
        max-width: 320px;
      }
      .tools select.in {
        min-width: 140px;
        flex: none;
      }
      .tabs {
        display: inline-flex;
        background: var(--panel2);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
        flex-wrap: wrap;
      }
      .tabs button {
        border: 0;
        background: transparent;
        padding: 6px 12px;
        border-radius: 8px;
        font-weight: 650;
        font-size: 13px;
        color: var(--mut);
        cursor: pointer;
      }
      .tabs button.on {
        background: var(--panel);
        color: var(--tx);
        box-shadow: 0 1px 2px rgba(16, 20, 40, 0.12);
      }
      .tw {
        overflow-x: auto;
        margin: 0 -18px;
        padding: 0 18px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      th {
        text-align: left;
        font-size: 11.5px;
        font-weight: 750;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 10px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        user-select: none;
      }
      th.s {
        cursor: pointer;
      }
      th.s:hover {
        color: var(--tx);
      }
      th.s::after {
        content: '';
        display: inline-block;
        width: 0;
        height: 0;
        margin-left: 6px;
        border: 4px solid transparent;
        vertical-align: 1px;
        opacity: 0.35;
        border-top-color: currentColor;
        border-bottom: 0;
      }
      th.s.asc::after {
        border-top: 0;
        border-bottom: 4px solid currentColor;
        opacity: 1;
      }
      th.s.desc::after {
        opacity: 1;
      }
      td {
        padding: 11px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
        white-space: nowrap;
      }
      tr:last-child td {
        border-bottom: 0;
      }
      tbody tr.click {
        cursor: pointer;
      }
      tbody tr.click:hover td {
        background: var(--panel2);
      }
      td.r,
      th.r {
        text-align: right;
      }
      .who {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .who .av {
        width: 30px;
        height: 30px;
        font-size: 12px;
      }
      .who b {
        display: block;
        font-size: 13.5px;
      }
      .who small {
        color: var(--mut);
        font-size: 12px;
      }
      .pos {
        color: var(--up);
      }
      .neg {
        color: var(--dn);
      }
      .pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 12px;
        flex-wrap: wrap;
        color: var(--mut);
        font-size: 13px;
      }
      .pager .btns {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .empty {
        text-align: center;
        color: var(--mut);
        padding: 32px 12px;
      }
      .loading {
        padding: 30px;
        text-align: center;
        color: var(--mut);
      }
      .skel {
        height: 14px;
        border-radius: 6px;
        background: linear-gradient(90deg, var(--panel2), var(--line), var(--panel2));
        background-size: 200% 100%;
        animation: sk 1.2s infinite;
      }
      @keyframes sk {
        to {
          background-position: -200% 0;
        }
      }

      /* ---------- charts ---------- */
      .chart {
        width: 100%;
        height: 220px;
        position: relative;
      }
      .chart svg {
        width: 100%;
        height: 100%;
        display: block;
        overflow: visible;
      }
      .chart .grid line {
        stroke: var(--line);
        stroke-width: 1;
      }
      .chart .ax {
        fill: var(--dim);
        font: 10.5px var(--mono);
      }
      .chart .tip {
        position: absolute;
        pointer-events: none;
        background: var(--tx);
        color: var(--panel);
        font-size: 12px;
        padding: 6px 9px;
        border-radius: 8px;
        white-space: nowrap;
        transform: translate(-50%, -110%);
        opacity: 0;
        transition: opacity 0.1s;
        z-index: 2;
      }
      .chart .tip b {
        font-family: var(--mono);
      }
      .legend {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        font-size: 12.5px;
        color: var(--mut);
      }
      .legend i {
        display: inline-block;
        width: 10px;
        height: 10px;
        border-radius: 3px;
        margin-right: 6px;
        vertical-align: -1px;
      }

      /* ---------- lists ---------- */
      .list {
        display: flex;
        flex-direction: column;
      }
      .li {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid var(--line);
      }
      .li:last-child {
        border-bottom: 0;
      }
      .li .t {
        flex: 1;
        min-width: 0;
      }
      .li .t > b {
        display: block;
        font-size: 13.5px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .li .t small {
        color: var(--mut);
        font-size: 12px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--dim);
        flex: none;
      }

      /* ---------- profile ---------- */
      .prof {
        display: flex;
        align-items: center;
        gap: 16px;
        flex-wrap: wrap;
      }
      .prof .av {
        width: 56px;
        height: 56px;
        font-size: 20px;
      }
      .prof h2 {
        margin: 0;
        font-size: 20px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 10px;
        margin-top: 16px;
      }
      .stat {
        background: var(--panel2);
        border-radius: 10px;
        padding: 10px 12px;
      }
      .stat small {
        display: block;
        color: var(--mut);
        font-size: 11.5px;
        font-weight: 650;
      }
      .stat b {
        font-size: 16px;
      }
      .actbar {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 16px;
      }
      .tl {
        position: relative;
        padding-left: 18px;
      }
      .tl::before {
        content: '';
        position: absolute;
        left: 4px;
        top: 6px;
        bottom: 6px;
        width: 2px;
        background: var(--line);
      }
      .tl .e {
        position: relative;
        padding: 6px 0 10px;
      }
      .tl .e::before {
        content: '';
        position: absolute;
        left: -18px;
        top: 11px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--panel);
        border: 2px solid var(--brand);
      }
      .tl .e b {
        font-size: 13px;
      }
      .tl .e small {
        display: block;
        color: var(--mut);
        font-size: 12px;
      }
      .kv {
        display: grid;
        grid-template-columns: 130px 1fr;
        gap: 8px 12px;
        font-size: 13.5px;
      }
      .kv dt {
        color: var(--mut);
      }
      .kv dd {
        margin: 0;
        min-width: 0;
        word-break: break-word;
      }

      /* ---------- switches ---------- */
      .sw {
        position: relative;
        display: inline-block;
        vertical-align: middle;
        width: 42px;
        height: 24px;
        flex: none;
      }
      .sw input {
        opacity: 0;
        width: 0;
        height: 0;
        position: absolute;
      }
      .sw span {
        position: absolute;
        inset: 0;
        background: var(--line2);
        border-radius: 12px;
        transition: 0.18s;
        cursor: pointer;
      }
      .sw span::after {
        content: '';
        position: absolute;
        left: 3px;
        top: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: 0.18s;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      }
      .sw input:checked + span {
        background: var(--up);
      }
      .sw input:checked + span::after {
        transform: translateX(18px);
      }
      .sw input:disabled + span {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .sto-steps {
        margin: 0 0 14px;
        padding-left: 20px;
        display: grid;
        gap: 8px;
        font-size: 13px;
        line-height: 1.5;
      }
      .sto-steps .mono {
        font-size: 12px;
        padding: 1px 5px;
        border-radius: 6px;
        background: var(--panel2);
        word-break: break-all;
      }
      .sto-live.on {
        border-color: color-mix(in srgb, var(--up) 45%, var(--line));
      }
      .qa {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin: 0 0 16px;
      }
      .qa-l {
        grid-column: 1 / -1;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--mut);
      }
      .qa-l em {
        font-style: normal;
        font-weight: 500;
        letter-spacing: 0;
        text-transform: none;
      }
      .qa-b {
        display: grid;
        grid-template-columns: auto 1fr;
        grid-template-rows: auto auto;
        column-gap: 10px;
        align-items: center;
        padding: 12px 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--tx);
        font: inherit;
        text-align: left;
        text-decoration: none;
        cursor: pointer;
        transition: border-color 0.15s, transform 0.15s, background 0.15s;
      }
      .qa-b:hover {
        border-color: var(--brand);
        transform: translateY(-1px);
      }
      .qa-b .ni {
        grid-row: 1 / 3;
      }
      .qa-b b {
        font-size: 13.5px;
      }
      .qa-b small {
        font-size: 11.5px;
        color: var(--mut);
      }
      @media (max-width: 900px) {
        .qa {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      .live {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 10px 4px;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--panel2);
        font-size: 12px;
      }
      .live i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--mut);
        flex: none;
        box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.5);
      }
      .live[data-s='on'] i {
        background: #22c55e;
        animation: livePulse 2.4s ease-out infinite;
      }
      .live[data-s='off'] i {
        background: var(--warn);
      }
      .live.blip i {
        animation: liveBlip 0.9s ease-out;
      }
      .live b {
        display: block;
        font-size: 12px;
      }
      .live small {
        display: block;
        color: var(--mut);
        font-size: 11px;
        line-height: 1.25;
      }
      @keyframes livePulse {
        0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
        70% { box-shadow: 0 0 0 7px rgba(34, 197, 94, 0); }
        100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
      }
      @keyframes liveBlip {
        0% { transform: scale(1); background: #fff; }
        100% { transform: scale(1); }
      }
      .ovin {
        width: 110px;
        text-align: right;
        padding: 6px 8px;
      }
      .ovin.set {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      tr.off td {
        opacity: 0.55;
      }
      tr.off td:last-child {
        opacity: 1;
      }
      .feat {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 0;
        border-bottom: 1px solid var(--line);
      }
      .feat:last-child {
        border-bottom: 0;
      }
      .feat .t {
        flex: 1;
      }
      .feat b {
        display: block;
      }
      .feat small {
        color: var(--mut);
      }
      .danger-zone {
        border-color: color-mix(in srgb, var(--dn) 40%, var(--line));
      }
      .mbig {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 16px;
        border-radius: 12px;
        background: var(--panel2);
        margin-bottom: 12px;
      }
      .mbig.on {
        background: var(--dn-soft);
      }
      .mbig .t {
        flex: 1;
      }
      .mbig b {
        font-size: 16px;
      }

      /* ---------- modal + toast ---------- */
      .ov {
        position: fixed;
        inset: 0;
        background: rgba(10, 12, 22, 0.45);
        z-index: 100;
        display: grid;
        place-items: center;
        padding: 16px;
        animation: fi 0.15s ease-out;
      }
      @keyframes fi {
        from {
          opacity: 0;
        }
      }
      .modal {
        width: min(520px, 100%);
        max-height: calc(100vh - 32px);
        overflow: auto;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.5);
        animation: mi 0.18s ease-out;
      }
      @keyframes mi {
        from {
          transform: translateY(8px) scale(0.98);
          opacity: 0;
        }
      }
      .modal.wide {
        width: min(760px, 100%);
      }
      .mh {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 18px 20px 0;
      }
      .mh h3 {
        margin: 0;
        font-size: 17px;
        flex: 1;
      }
      .mb {
        padding: 14px 20px;
      }
      .mf {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 0 20px 18px;
        flex-wrap: wrap;
      }
      .warnbox {
        display: flex;
        gap: 10px;
        padding: 12px;
        border-radius: 10px;
        background: var(--dn-soft);
        color: var(--dn);
        font-size: 13px;
        margin-bottom: 12px;
      }
      .toasts {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 200;
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: min(360px, calc(100vw - 32px));
      }
      .toast {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        background: var(--panel);
        border: 1px solid var(--line);
        border-left: 4px solid var(--up);
        border-radius: 10px;
        padding: 12px 14px;
        box-shadow: 0 12px 30px -10px rgba(0, 0, 0, 0.35);
        animation: mi 0.2s ease-out;
        font-size: 13.5px;
      }
      .toast.err {
        border-left-color: var(--dn);
      }
      .toast svg {
        margin-top: 1px;
      }
      .toast.ok svg {
        color: var(--up);
      }
      .toast.err svg {
        color: var(--dn);
      }
      .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: var(--brand-soft);
        color: var(--brand);
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 12.5px;
        font-weight: 650;
      }
      .chip button {
        border: 0;
        background: none;
        color: inherit;
        cursor: pointer;
        padding: 0;
        font-size: 14px;
        line-height: 1;
      }
      .pick {
        position: relative;
      }
      .pick .drop {
        position: absolute;
        left: 0;
        right: 0;
        top: 100%;
        margin-top: 4px;
        background: var(--panel);
        border: 1px solid var(--line2);
        border-radius: 10px;
        box-shadow: var(--shadow);
        z-index: 5;
        max-height: 220px;
        overflow: auto;
      }
      .pick .drop button {
        display: flex;
        width: 100%;
        gap: 10px;
        align-items: center;
        border: 0;
        background: none;
        padding: 8px 12px;
        text-align: left;
        cursor: pointer;
      }
      .pick .drop button:hover {
        background: var(--panel2);
      }
      .sr h4 {
        margin: 18px 0 8px;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--mut);
      }
      pre.json {
        margin: 0;
        font: 12px/1.5 var(--mono);
        background: var(--panel2);
        border-radius: 8px;
        padding: 8px 10px;
        white-space: pre-wrap;
        word-break: break-word;
        max-width: 520px;
      }

      /* ---------- responsive ---------- */
      @media (max-width: 1100px) {
        .kpis {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .g3 {
          grid-template-columns: 1fr 1fr;
        }
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .side {
          position: fixed;
          left: 0;
          top: 0;
          bottom: 0;
          width: 264px;
          transform: translateX(-100%);
          transition: transform 0.2s ease;
          box-shadow: 20px 0 40px rgba(0, 0, 0, 0.2);
        }
        .app.open .side {
          transform: none;
        }
        .scrim {
          position: fixed;
          inset: 0;
          background: rgba(10, 12, 22, 0.4);
          z-index: 35;
        }
        .burger {
          display: inline-flex;
        }
        .g2,
        .g3 {
          grid-template-columns: 1fr;
        }
        .top {
          padding: 10px 14px;
        }
        .view {
          padding: 16px 14px;
        }
        .search kbd {
          display: none;
        }
        .top .sp {
          display: none;
        }
        .search {
          max-width: none;
        }
      }
      @media (max-width: 560px) {
        .kpis {
          grid-template-columns: 1fr 1fr;
          gap: 10px;
        }
        .kpi {
          padding: 12px;
        }
        .kpi b {
          font-size: 21px;
        }
        .card {
          padding: 14px;
        }
        .tw {
          margin: 0 -14px;
          padding: 0 14px;
        }
        .ph h1 {
          font-size: 21px;
        }
        .tools .in {
          max-width: none;
          min-width: 0;
          width: 100%;
          flex-basis: 100%;
        }
        .top .role-pill {
          display: none;
        }
        .kv {
          grid-template-columns: 1fr;
        }
        .kv dt {
          margin-top: 6px;
        }
        .in,
        select.in,
        textarea.in {
          font-size: 16px;
        }
        .mf .btn {
          flex: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
      /* ---------- PackVerse look ---------- */
      :root {
        --vg: linear-gradient(95deg, #ffb52e 0%, #ff6a1f 100%);
        --vglow: 0 8px 24px -8px rgba(255, 120, 30, 0.6);
      }
      .btn.pri {
        background: var(--vg);
        border: 0;
        color: #1b1206;
        font-weight: 800;
        box-shadow: var(--vglow);
      }
      .btn.pri:hover {
        background: var(--vg);
        filter: brightness(1.06);
      }
      .tabs button.on {
        background: var(--vg);
        color: #1b1206;
        box-shadow: 0 6px 16px -8px rgba(255, 120, 30, 0.8);
      }
      .kpi b {
        letter-spacing: -0.02em;
      }
      .kpi small,
      .stat small,
      th,
      .sec,
      .nav .sec,
      label.f > span {
        text-transform: uppercase;
        letter-spacing: 0.07em;
        font-size: 11px;
      }
      :root[data-theme='dark'] body {
        background:
          radial-gradient(1.2px 1.2px at 11% 23%, rgba(255, 255, 255, 0.5) 50%, transparent 52%),
          radial-gradient(1px 1px at 37% 71%, rgba(255, 255, 255, 0.4) 50%, transparent 52%),
          radial-gradient(1.4px 1.4px at 63% 12%, rgba(255, 255, 255, 0.45) 50%, transparent 52%),
          radial-gradient(1px 1px at 82% 58%, rgba(255, 255, 255, 0.35) 50%, transparent 52%),
          radial-gradient(900px 520px at 88% -8%, rgba(122, 76, 255, 0.14), transparent 62%),
          radial-gradient(760px 460px at -6% 104%, rgba(255, 120, 40, 0.08), transparent 60%), #07070b;
        background-size:
          340px 340px,
          260px 260px,
          420px 420px,
          300px 300px,
          auto,
          auto,
          auto;
        background-attachment: fixed;
      }
      :root[data-theme='dark'] .card,
      :root[data-theme='dark'] .kpi,
      :root[data-theme='dark'] .auth-card,
      :root[data-theme='dark'] .modal {
        background: linear-gradient(180deg, #14141a, #101015);
        border-color: var(--line);
      }
      :root[data-theme='dark'] .side {
        background: #09090d;
      }
      :root[data-theme='dark'] .top {
        background: rgba(7, 7, 11, 0.82);
      }
      .nav a.on {
        background: var(--brand-soft);
        color: var(--brand);
        box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--brand) 45%, transparent);
      }
      .nav a.on::before {
        display: none;
      }
      :root[data-theme='dark'] .nav a.on {
        box-shadow:
          inset 0 0 0 1px rgba(255, 166, 43, 0.42),
          0 0 22px -12px rgba(255, 150, 40, 0.9);
      }
      :root[data-theme='dark'] .kpi small .ic {
        background: rgba(255, 160, 50, 0.1);
        color: #ffab35;
      }
      .logo .mark {
        box-shadow: 0 4px 14px -4px rgba(255, 110, 30, 0.6);
      }
      .auth {
        background:
          radial-gradient(900px 420px at 50% -140px, rgba(255, 140, 40, 0.14), transparent 70%), var(--bg);
      }
      :root[data-theme='dark'] .auth {
        background:
          radial-gradient(1.2px 1.2px at 11% 23%, rgba(255, 255, 255, 0.5) 50%, transparent 52%),
          radial-gradient(1px 1px at 63% 71%, rgba(255, 255, 255, 0.4) 50%, transparent 52%),
          radial-gradient(900px 520px at 80% -10%, rgba(122, 76, 255, 0.18), transparent 62%),
          radial-gradient(700px 420px at 0% 110%, rgba(255, 120, 40, 0.12), transparent 60%), #07070b;
        background-size:
          320px 320px,
          260px 260px,
          auto,
          auto,
          auto;
      }
      .in:focus {
        border-color: var(--brand);
        box-shadow: 0 0 0 3px var(--brand-soft);
      }
      .pill.p-brand {
        background: var(--brand-soft);
        color: var(--brand);
      }
      /* ---------- v3 polish ---------- */
      @keyframes gFloat {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(18px, -22px) scale(1.08);
        }
      }
      @keyframes gShake {
        10%,
        90% {
          transform: translateX(-2px);
        }
        20%,
        80% {
          transform: translateX(5px);
        }
        30%,
        50%,
        70% {
          transform: translateX(-9px);
        }
        40%,
        60% {
          transform: translateX(9px);
        }
      }
      @keyframes gPulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      @keyframes gIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* code gate */
      .gate {
        position: relative;
        overflow: hidden;
      }
      .gate-orb {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        pointer-events: none;
        animation: gFloat 14s ease-in-out infinite;
      }
      .gate-orb.o1 {
        width: 420px;
        height: 420px;
        background: rgba(255, 130, 30, 0.22);
        top: -140px;
        left: 50%;
        margin-left: -300px;
      }
      .gate-orb.o2 {
        width: 360px;
        height: 360px;
        background: rgba(122, 76, 255, 0.2);
        bottom: -120px;
        right: -80px;
        animation-delay: -6s;
      }
      .gate-card {
        position: relative;
        z-index: 1;
        max-width: 380px;
        text-align: center;
        padding: 34px 28px 24px;
        border-radius: 24px;
        backdrop-filter: blur(14px);
        box-shadow:
          0 30px 80px -30px rgba(0, 0, 0, 0.7),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        animation: gIn 0.45s ease both;
      }
      .gate-logo .mark {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: inline-grid;
        place-items: center;
        box-shadow:
          0 14px 40px -10px rgba(255, 110, 30, 0.85),
          0 0 0 6px rgba(255, 150, 40, 0.08);
        overflow: hidden;
      }
      .gate-logo .mark svg,
      .gate-logo .mark img {
        width: 100%;
        height: 100%;
      }
      .gate-brand {
        margin-top: 14px;
        font-weight: 900;
        letter-spacing: 0.14em;
        font-size: 12px;
        color: var(--mut);
      }
      .gate-brand span {
        background: var(--vg);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .gate-card h1 {
        margin: 10px 0 6px;
        font-size: 24px;
        letter-spacing: -0.02em;
      }
      .gate-card > p {
        margin: 0 0 20px;
      }
      .pin {
        position: relative;
        display: flex;
        justify-content: center;
        gap: 10px;
        margin: 0 auto 6px;
        cursor: text;
      }
      .pin input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        font-size: 16px;
        caret-color: transparent;
      }
      .pin i {
        width: 50px;
        height: 60px;
        border-radius: 14px;
        border: 1.5px solid var(--line);
        background: var(--panel2);
        display: grid;
        place-items: center;
        transition:
          border-color 0.15s,
          box-shadow 0.15s,
          transform 0.15s;
      }
      .pin i::after {
        content: '';
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: var(--vg);
        transform: scale(0);
        transition: transform 0.18s cubic-bezier(0.3, 1.6, 0.5, 1);
        box-shadow: 0 0 14px rgba(255, 140, 40, 0.8);
      }
      .pin i.on::after {
        transform: scale(1);
      }
      .pin i.on {
        border-color: color-mix(in srgb, var(--brand) 55%, var(--line));
      }
      .pin i.cur {
        border-color: var(--brand);
        box-shadow: 0 0 0 4px var(--brand-soft);
        transform: translateY(-2px);
      }
      .pin.busy i::after {
        animation: gPulse 0.8s infinite;
      }
      .pin.ok i {
        border-color: #22c55e;
        box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.18);
      }
      .pin.ok i::after {
        background: #22c55e;
        box-shadow: 0 0 14px rgba(34, 197, 94, 0.8);
      }
      .pin.shake {
        animation: gShake 0.45s;
      }
      .pin.shake i {
        border-color: var(--dn, #ef4444);
      }
      .gate .err {
        min-height: 20px;
        margin: 6px 0 4px;
      }
      .keypad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin: 6px 0 16px;
      }
      .keypad button {
        height: 50px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.025);
        color: var(--tx);
        font: 700 19px/1 var(--mono, ui-monospace, monospace);
        cursor: pointer;
        transition:
          background 0.12s,
          transform 0.08s,
          border-color 0.12s;
      }
      .keypad button:hover {
        border-color: color-mix(in srgb, var(--brand) 40%, var(--line));
        background: var(--brand-soft);
      }
      .keypad button:active {
        transform: scale(0.94);
      }
      .keypad button.fn {
        color: var(--mut);
        font-size: 16px;
      }
      :root:not([data-theme='dark']) .keypad button {
        background: #fff;
      }
      .gate-foot {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        margin: 14px 0 0;
      }

      /* ================= v4: calm + simple ================= */
      :root {
        --bg: #f6f7f9;
        --panel: #fff;
        --panel2: #f1f3f6;
        --line: #e6e8ee;
        --line2: #d6d9e1;
        --tx: #14161f;
        --mut: #5f6577;
        --dim: #9197a8;
        --brand: #e2640c;
        --brand-d: #c85708;
        --brand-soft: #fdf0e6;
        --shadow: 0 1px 2px rgba(16, 20, 40, 0.04);
        --r: 12px;
        --c1: #e2640c;
        --c2: #0f9f76;
        --c3: #7c5cff;
        --c4: #2f6fe4;
      }
      :root[data-theme='dark'] {
        --bg: #0c0d11;
        --panel: #14151b;
        --panel2: #1b1d24;
        --line: rgba(255, 255, 255, 0.07);
        --line2: rgba(255, 255, 255, 0.12);
        --tx: #eceef3;
        --mut: #9096a6;
        --dim: #62687a;
        --brand: #ff9a3c;
        --brand-d: #ff8a1f;
        --brand-soft: rgba(255, 154, 60, 0.12);
        --shadow: none;
        --c1: #ff9a3c;
        --c2: #34d399;
        --c3: #a78bfa;
        --c4: #60a5fa;
      }
      :root[data-theme='dark'] body,
      body {
        background: var(--bg);
        background-attachment: initial;
      }
      :root[data-theme='dark'] .card,
      :root[data-theme='dark'] .kpi,
      :root[data-theme='dark'] .modal,
      .card,
      .kpi {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
      }
      .card:hover {
        border-color: var(--line);
      }
      .kpi,
      .view {
        animation: none;
      }
      .kpi::before {
        display: none;
      }
      .kpi:hover {
        transform: none;
        box-shadow: var(--shadow);
        border-color: var(--line);
      }
      a.kpi {
        display: block;
        color: inherit;
        text-decoration: none;
        transition: border-color 0.15s;
      }
      a.kpi:hover {
        border-color: var(--line2);
      }
      .kpi small,
      .stat small,
      th,
      label.f > span {
        text-transform: none;
        letter-spacing: 0;
        font-size: 12.5px;
        font-weight: 600;
      }
      th {
        font-size: 12px;
      }
      .kpi small .ic,
      :root[data-theme='dark'] .kpi small .ic {
        width: 24px;
        height: 24px;
        border-radius: 7px;
        background: var(--panel2);
        color: var(--mut);
      }
      .kpi small .ic svg {
        width: 15px;
        height: 15px;
      }
      .kpi b {
        font-size: 28px;
        margin: 8px 0 2px;
        font-weight: 700;
      }
      .kpi em {
        color: var(--mut);
      }
      .ph h1 {
        background: none;
        -webkit-background-clip: initial;
        background-clip: initial;
        color: var(--tx);
        font-size: 22px;
      }
      .ph {
        margin-bottom: 16px;
        align-items: center;
      }
      .ph p {
        font-size: 13px;
      }
      /* buttons + tabs: solid, no glow */
      .btn.pri,
      .btn.pri:hover {
        background: var(--brand);
        color: #fff;
        box-shadow: none;
        font-weight: 700;
        filter: none;
      }
      :root[data-theme='dark'] .btn.pri {
        color: #1a1006;
      }
      .btn.pri:hover {
        background: var(--brand-d);
      }
      .tabs button.on {
        background: var(--panel);
        color: var(--tx);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12), inset 0 0 0 1px var(--line2);
      }
      tbody tr:hover {
        background: var(--panel2);
      }
      /* sidebar: one quiet link per section */
      :root[data-theme='dark'] .side,
      .side {
        background: var(--panel);
        border-right: 1px solid var(--line);
      }
      :root[data-theme='dark'] .top {
        background: color-mix(in srgb, var(--bg) 90%, transparent);
        border-bottom: 1px solid var(--line);
        border-image: none;
      }
      .nav {
        gap: 2px;
        padding-top: 4px;
      }
      .nav a {
        padding: 9px 10px;
        font-weight: 600;
        color: var(--mut);
      }
      .nav a:hover:not(.on) {
        transform: none;
        background: var(--panel2);
        color: var(--tx);
      }
      .nav a.on,
      :root[data-theme='dark'] .nav a.on {
        background: var(--panel2);
        color: var(--tx);
        box-shadow: none;
      }
      .nav a.on::before {
        display: block;
        left: -12px;
      }
      .ni,
      :root:not([data-theme='dark']) .ni {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        color: var(--mut);
        background: transparent;
        box-shadow: none;
      }
      .ni svg .f {
        opacity: 0.18;
      }
      .ni svg .k {
        fill: var(--panel);
      }
      .nav a:hover .ni {
        transform: none;
        background: transparent;
        color: var(--tx);
      }
      .nav a.on .ni {
        color: var(--brand);
        background: var(--brand-soft);
        box-shadow: none;
      }
      .nav a.on .ni svg .k {
        fill: var(--brand-soft);
      }
      .logo .mark {
        box-shadow: none;
      }
      .live {
        margin: 8px 0 10px;
      }
      /* section tabs */
      .subnav {
        border-bottom: 1px solid var(--line);
        background: var(--bg);
      }
      .subnav-in {
        max-width: 1360px;
        margin: 0 auto;
        padding: 0 24px;
        display: flex;
        gap: 4px;
        overflow-x: auto;
        scrollbar-width: none;
      }
      .subnav-in::-webkit-scrollbar {
        display: none;
      }
      .subnav a {
        flex: none;
        padding: 12px 12px 11px;
        color: var(--mut);
        text-decoration: none;
        font-weight: 600;
        font-size: 13.5px;
        border-bottom: 2px solid transparent;
        margin-bottom: -1px;
      }
      .subnav a:hover {
        color: var(--tx);
      }
      .subnav a.on {
        color: var(--tx);
        border-bottom-color: var(--brand);
      }
      /* dashboard */
      .kpis.k5 {
        grid-template-columns: repeat(5, minmax(0, 1fr));
      }
      .live-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--up);
        box-shadow: 0 0 0 0 color-mix(in srgb, var(--up) 60%, transparent);
        animation: onlP 1.8s infinite;
        flex: none;
      }
      .live-dot.idle {
        background: var(--dim);
        animation: none;
      }
      .dgrid {
        display: grid;
        grid-template-columns: minmax(0, 1.9fr) minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      .dside {
        display: grid;
        gap: 16px;
      }
      .dside .card + .card {
        margin-top: 0;
      }
      .dchart .chart {
        height: 260px;
      }
      .chart-note {
        margin: 10px 0 0;
      }
      .seg {
        display: inline-flex;
        padding: 3px;
        gap: 2px;
        border-radius: 9px;
        background: var(--panel2);
        border: 1px solid var(--line);
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--mut);
        font-weight: 600;
        font-size: 12.5px;
        padding: 4px 12px;
        border-radius: 7px;
        cursor: pointer;
      }
      .seg button.on {
        background: var(--panel);
        color: var(--tx);
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
      }
      .att {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .att-i {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        border-radius: 10px;
        border: 1px solid var(--line);
        color: inherit;
        text-decoration: none;
      }
      .att-i:hover {
        background: var(--panel2);
      }
      .att-i i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex: none;
        background: var(--info);
      }
      .att-i.dn i {
        background: var(--dn);
      }
      .att-i.warn i {
        background: var(--warn);
      }
      .att-i span {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .att-i b {
        font-size: 13.5px;
      }
      .att-i small {
        color: var(--mut);
        font-size: 12px;
      }
      .att-i em {
        font-style: normal;
        color: var(--dim);
        font-size: 18px;
      }
      .ok-empty {
        display: flex;
        align-items: center;
        gap: 10px;
        justify-content: flex-start;
        padding: 6px 0 !important;
        text-align: left;
      }
      .ok-empty svg {
        color: var(--up);
      }
      .qa2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .qa2 .btn {
        justify-content: flex-start;
        height: 40px;
        font-weight: 600;
        min-width: 0;
      }
      .qa2 .btn span {
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .qa2 .btn svg {
        color: var(--mut);
        width: 16px;
        height: 16px;
      }
      #onl .onl-r {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .onl-u small {
        color: var(--mut);
      }
      .onl-u.on small {
        color: var(--up);
        font-weight: 600;
      }
      .k-live small {
        gap: 7px;
      }
      @media (max-width: 1200px) {
        .kpis.k5 {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }
      }
      @media (max-width: 1000px) {
        .dgrid {
          grid-template-columns: 1fr;
        }
      }
      @media (max-width: 900px) {
        .subnav-in {
          padding: 0 14px;
        }
      }
      @media (max-width: 560px) {
        .kpis.k5 {
          grid-template-columns: 1fr 1fr;
        }
        .kpis.k5 > .kpi:first-child {
          grid-column: 1 / -1;
        }
        .kpi b {
          font-size: 22px;
        }
        .dchart .chart {
          height: 200px;
        }
        .ph .acts {
          width: auto;
        }
        .tools2 select.in {
          flex-basis: calc(50% - 4px);
          width: calc(50% - 4px);
        }
      }

        trophy: I('<path d="M7 4h10v5.5a5 5 0 0 1-10 0z"/><path d="M17 5.5h2.5v1.3a3.2 3.2 0 0 1-2.9 3.2M7 5.5H4.5v1.3a3.2 3.2 0 0 0 2.9 3.2M12 14.5v3M8.5 20.5h7M9.5 20.5l.6-3h3.8l.6 3"/>'),
        trash: I('<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'),
        eye: I(
          '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="3"/>'
        ),
        eyeoff: I(
          '<path d="M3 3l18 18M10.6 5.6A9 9 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a17 17 0 0 1-3 3.7M6.2 6.9A16 16 0 0 0 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1.1"/>'
        ),
        pin: I('<path d="M9 4h6l-1 6 4 3v1H6v-1l4-3zM12 14v6"/>'),
        power: I('<path d="M12 3v8M6.3 6.6a8 8 0 1 0 11.4 0"/>'),
        chat: I('<path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4 3.5V15.5a2 2 0 0 1-1.5-2z"/>'),
        mute: I('<path d="M4.5 6.5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H10l-4 3.5V15.5a2 2 0 0 1-1.5-2z"/><path d="m9.5 7.5 5 5M14.5 7.5l-5 5"/>'),
        crown: I('<path d="M4 8.5 8 12l4-6.5 4 6.5 4-3.5-1.6 9.5H5.6z"/>'),
        swords: I('<path d="M4 4l9 9M4 4h3.5M4 4v3.5M20 4l-9 9M20 4h-3.5M20 4v3.5M7 14l3 3M17 14l-3 3M5.5 18.5l2-2M18.5 18.5l-2-2"/>'),
      };

      /* ================= api ================= */
      const S = { token: sessionStorage.getItem('pba.t') || null, me: null };
      const ERR = {
        admin_auth: 'Your session ended. Please sign in again.',
        forbidden: 'Your role doesn’t allow that action.',
        bad_login: 'Wrong username or password.',
        locked: 'Too many wrong codes. Locked for 15 minutes.',
        not_configured: 'Admin code isn’t set up on the server yet.',
        disabled: 'This admin account is disabled.',
        bad_code: 'Wrong code.',
        bad_code_fmt: 'Code must be 3–24 letters, numbers, - or _',
        code_taken: 'That code already exists. Pick another.',
        bad_max: 'Max uses must be at least 1.',
        need_reason: 'Add a reason.',
        bad_new_code: 'The new code must be 5 to 12 digits.',
        parent_ok_needed: 'Write down how the parent said yes first.',
        same_code: 'That’s the same code as now.',
        bad_tag: 'Tags can only use letters, numbers, spaces, - and _ (max 20 characters).',
        too_many_tags: 'Max 12 tags per player.',
        slow_down: 'Slow down — wait a minute and try again.',
        setup_done: 'Setup is already finished. Sign in instead.',
        weak_password: 'Password must be at least 10 characters.',
        bad_username: 'Username: 3–20 letters, numbers, _ . or -',
        not_found: 'Not found. It may have been removed.',
        not_self: 'You can’t change your own role or disable yourself.',
        last_owner: 'There must always be at least one owner.',
        delete_first: 'Delete the user first, then you can remove them permanently.',
        not_deleted: 'That user isn’t deleted.',
        bad_hours: 'Suspension must be 1 to 8,760 hours.',
        bad_name: 'Enter a name (1–60 characters).',
        bad_kind: 'Pick a valid type.',
        bad_item: 'Pick a valid game item.',
        bad_amount: 'Enter an amount above 0.',
        bad_price: 'Price must be 0 to 10,000,000 coins.',
        bad_users: 'Pick at least one user (max 500).',
        too_long: 'That text is too long.',
        bad_value: 'Invalid value.',
        bad_sym: 'Ticker must be 1–7 letters, numbers or dots.',
        too_many: 'That’s the limit for this list.',
        bad_title: 'Enter a title (1–120 characters).',
        bad_status: 'Invalid status.',
        bad_role: 'Pick a role.',
        bad_password: 'Password must be 6+ characters.',
        muted: 'That player is muted from chat.',
        no_room: 'That chat room doesn’t exist.',
        feature_off: 'That feature is turned off in Site controls.',
        network:
          'Can’t reach the PAPERBULL server (supabase.co). This Wi-Fi, a VPN or an ad blocker may be blocking it. Try phone data or turn the blocker off.',
        offline: 'You’re offline. Connect to the internet and try again.',
      };
      async function rpc(fn, args = {}) {
        let r;
        for (let tries = 0; ; tries++) {
          try {
            r = await fetch(API + fn, {
              method: 'POST',
              headers: { apikey: ANON, Authorization: 'Bearer ' + ANON, 'Content-Type': 'application/json' },
              body: JSON.stringify(args),
            });
            break;
          } catch (e) {
            if (tries < 2 && navigator.onLine !== false) {
              await new Promise(ok => setTimeout(ok, 600 * (tries + 1)));
              continue;
            }
            throw Object.assign(new Error(navigator.onLine === false ? ERR.offline : ERR.network), { code: 'network' });
          }
        }
        const t = await r.text();
        let j = null;
        try {
          j = t ? JSON.parse(t) : null;
        } catch (e) {}
        if (!r.ok) {
          const code = (j && j.message) || 'error';
          if (code === 'admin_auth') {
            signOut(true);
          }
          throw Object.assign(new Error(ERR[code] || 'Server error: ' + code), { code });
        }
        if (j && j.error) throw Object.assign(new Error(ERR[j.error] || j.error), { code: j.error, left: j.left });
        return j;
      }
      const A = (fn, args = {}) => rpc(fn, Object.assign({ p_token: S.token }, args));
      const can = r =>
        (({ owner: 3, admin: 2, moderator: 1 })[S.me?.role] || 0) >=
        ({ owner: 3, admin: 2, moderator: 1 }[r] || 9);

      /* ================= ui primitives ================= */
      function toast(msg, kind = 'ok') {
        const el = document.createElement('div');
        el.className = 'toast ' + kind;
        el.innerHTML = (kind === 'ok' ? IC.ok : IC.bad) + `<div>${esc(msg)}</div>`;
        $('#toasts').appendChild(el);
        setTimeout(
          () => {
            el.style.opacity = '0';
            el.style.transition = 'opacity .3s';
            setTimeout(() => el.remove(), 300);
          },
          kind === 'err' ? 5000 : 3000
        );
      }
      function modal({ title, body, ok = 'Save', okClass = 'pri', cancel = 'Cancel', wide, onOk, onMount }) {
        const ov = document.createElement('div');
        ov.className = 'ov';
        ov.innerHTML = `<div class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h3>${esc(title)}</h3><button class="btn ghost sm icon" data-x aria-label="Close">${IC.x}</button></div><div class="mb">${body}</div>
    <div class="mf">${cancel ? `<button class="btn" data-x>${esc(cancel)}</button>` : ''}${ok ? `<button class="btn ${okClass}" data-ok>${esc(ok)}</button>` : ''}</div></div>`;
        document.body.appendChild(ov);
        const close = () => {
          ov.remove();
          document.removeEventListener('keydown', key);
        };
        const key = e => {
          if (e.key === 'Escape') close();
        };
        document.addEventListener('keydown', key);
        ov.addEventListener('click', e => {
          if (e.target === ov || e.target.closest('[data-x]')) close();
        });
        const okb = $('[data-ok]', ov);
        if (okb)
          okb.onclick = async () => {
            if (!onOk) return close();
            okb.disabled = true;
            const t = okb.textContent;
            okb.textContent = 'Working…';
            try {
              const r = await onOk(ov);
              if (r !== false) close();
            } catch (e) {
              const er = $('.err', ov);
              if (er) er.textContent = e.message;
              else toast(e.message, 'err');
            }
            if (document.body.contains(okb)) {
              okb.disabled = false;
              okb.textContent = t;
            }
          };
        onMount && onMount(ov);
        setTimeout(() => {
          const f = $('input:not([type=checkbox]),textarea,select', ov);
          if (f && innerWidth > 700) f.focus();
        }, 30);
        return ov;
      }
      function confirmBox({ title, text, ok = 'Confirm', danger = true, type, reason, hours }) {
        return new Promise(res => {
          modal({
            title,
            ok,
            okClass: danger ? 'dan' : 'pri',
            body: `${danger ? `<div class="warnbox">${IC.bad}<div>${text}</div></div>` : `<p>${text}</p>`}
        ${hours ? `<label class="f"><span>How long (hours)</span><input class="in" type="number" id="cfH" min="1" max="8760" value="${hours}"></label>` : ''}
        ${reason ? `<label class="f"><span>Reason (shown to the user)</span><input class="in" id="cfR" maxlength="300" placeholder="Optional"></label>` : ''}
        ${type ? `<label class="f"><span>Type <b class="mono">${esc(type)}</b> to confirm</span><input class="in" id="cfT" autocomplete="off"></label>` : ''}<div class="err"></div>`,
            onOk: ov => {
              if (type && $('#cfT', ov).value.trim() !== type)
                throw new Error(`Type ${type} exactly to confirm.`);
              res({
                reason: reason ? $('#cfR', ov).value.trim() : null,
                hours: hours ? +$('#cfH', ov).value : null,
              });
            },
            onMount: ov =>
              ov.addEventListener('click', e => {
                if (e.target === ov || e.target.closest('[data-x]')) res(null);
              }),
          });
        });
      }
      async function act(p, okMsg) {
        try {
          const r = await p;
          if (okMsg) toast(okMsg);
          return r;
        } catch (e) {
          toast(e.message, 'err');
          throw e;
        }
      }
      const statusPill = s =>
        ({
          active: '<span class="pill p-ok"><i></i>Active</span>',
          suspended: '<span class="pill p-warn"><i></i>Suspended</span>',
          banned: '<span class="pill p-dn"><i></i>Banned</span>',
          deleted: '<span class="pill p-mut"><i></i>Deleted</span>',
        })[s] || esc(s);
      const rolePill = r =>
        `<span class="pill ${r === 'owner' ? 'p-brand' : r === 'admin' ? 'p-info' : 'p-mut'}">${esc(r[0].toUpperCase() + r.slice(1))}</span>`;
      const avatar = n => `<span class="av">${esc(String(n || '?').slice(0, 1))}</span>`;
      const skeleton = (n = 5) =>
        `<div style="display:grid;gap:12px;padding:8px 0">${Array.from({ length: n }, (_, i) => `<div class="skel" style="width:${90 - i * 9}%"></div>`).join('')}</div>`;

      /* ================= charts (plain SVG) ================= */
      function chart(el, { labels, series, type = 'line', fmt = v => num(v), stacked }) {
        if (!el) return;
        const W = Math.max(280, el.clientWidth || 600),
          H = el.clientHeight || 220,
          L = 44,
          R = 10,
          T = 12,
          B = 26,
          iw = W - L - R,
          ih = H - T - B,
          n = labels.length;
        const tot = labels.map((_, i) =>
          stacked
            ? series.reduce((s, x) => s + (+x.data[i] || 0), 0)
            : Math.max(...series.map(x => +x.data[i] || 0))
        );
        // round axis: whole-number steps (1, 2, 5 × 10ⁿ) so counts never show as 2.3 or 6.8
        const peak = Math.max(1, ...tot),
          ints = series.every(s => s.data.every(v => Number.isInteger(+v || 0)));
        let stp = peak / 4;
        const mag = Math.pow(10, Math.floor(Math.log10(stp)));
        stp = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => s >= stp) || 10 * mag;
        if (ints) stp = Math.max(1, Math.ceil(stp));
        const nT = Math.max(1, Math.ceil((peak * 1.05) / stp));
        let mx = nT * stp;
        const y = v => T + ih - (v / mx) * ih,
          x = i => L + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw),
          bw = Math.max(2, (iw / n) * 0.62),
          bx = i => L + ((i + 0.5) * iw) / n;
        let g = '<g class="grid">';
        for (let k = 0; k <= nT; k++) {
          const v = stp * k,
            yy = y(v).toFixed(1);
          g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L - 8}" y="${+yy + 3.5}" text-anchor="end">${esc(fmtShort(v))}</text>`;
        }
        g += '</g>';
        const step = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 70))));
        let xl = '';
        labels.forEach((l, i) => {
          if ((i % step === 0 && (i === n - 1 || n - 1 - i >= step * 0.75)) || i === n - 1)
            xl += `<text class="ax" x="${(type === 'bar' ? bx(i) : x(i)).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(l)}</text>`;
        });
        let body = '';
        if (type === 'line')
          series.forEach(s => {
            const pts = s.data.map((v, i) => [x(i), y(+v || 0)]),
              d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
            if (!pts.length) return;
            const id = 'g' + Math.random().toString(36).slice(2, 8);
            body +=
              `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".22"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>` +
              (series.length === 1
                ? `<path d="${d}L${x(n - 1).toFixed(1)},${T + ih}L${x(0).toFixed(1)},${T + ih}Z" fill="url(#${id})"/>`
                : '') +
              `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
          });
        else
          labels.forEach((_, i) => {
            let acc = 0;
            series.forEach((s, k) => {
              const v = +s.data[i] || 0;
              if (!v) return;
              const w = stacked ? bw : bw / series.length,
                xx = stacked ? bx(i) - bw / 2 : bx(i) - bw / 2 + k * w;
              const y0 = y(acc + (stacked ? v : v)),
                h = y(stacked ? acc : 0) - y0;
              body += `<rect x="${xx.toFixed(1)}" y="${y0.toFixed(1)}" width="${Math.max(1, w - 1).toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="2" fill="${s.color}"/>`;
              if (stacked) acc += v;
            });
          });
        el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img">${g}${body}${xl}<line class="hov" x1="0" x2="0" y1="${T}" y2="${T + ih}" stroke="var(--mut)" stroke-dasharray="3 3" opacity="0"/></svg><div class="tip"></div>`;
        const svg = $('svg', el),
          tip = $('.tip', el),
          hov = $('.hov', el);
        svg.addEventListener('pointermove', e => {
          const r = svg.getBoundingClientRect(),
            px = ((e.clientX - r.left) / r.width) * W;
          const i = Math.max(
            0,
            Math.min(
              n - 1,
              type === 'bar' ? Math.floor(((px - L) / iw) * n) : Math.round(((px - L) / iw) * (n - 1))
            )
          );
          const xx = type === 'bar' ? bx(i) : x(i);
          hov.setAttribute('x1', xx);
          hov.setAttribute('x2', xx);
          hov.setAttribute('opacity', '.6');
          tip.innerHTML = `${esc(labels[i])}<br>${series.map(s => `<span style="color:${s.color}">●</span> ${esc(s.name)}: <b>${esc(fmt(+s.data[i] || 0))}</b>`).join('<br>')}`;
          tip.style.left = (xx / W) * r.width + 'px';
          tip.style.top = (T / H) * r.height + 10 + 'px';
          tip.style.opacity = 1;
        });
        svg.addEventListener('pointerleave', () => {
          tip.style.opacity = 0;
          hov.setAttribute('opacity', '0');
        });
      }
      function fmtShort(v) {
        v = +v;
        if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
        if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
        return Math.round(v * 10) / 10 + '';
      }
      const legend = s =>
        `<div class="legend">${s.map(x => `<span><i style="background:${x.color}"></i>${esc(x.name)}</span>`).join('')}</div>`;
      const col = k =>
        getComputedStyle(document.documentElement)
          .getPropertyValue('--c' + k)
          .trim();

      /* ================= theme ================= */
      function setTheme(t) {
        document.documentElement.dataset.theme = t;
        try {
          localStorage.setItem('pba.theme', t);
        } catch (e) {}
        const b = $('#themeBtn');
        if (b) b.innerHTML = t === 'dark' ? IC.sun : IC.moon;
        if (V.cur && V.cur.charts) V.cur.charts();
      }
      setTheme(
        (() => {
          try {
            return localStorage.getItem('pba.theme');
          } catch (e) {
            return null;
          }
        })() || 'dark'
      );

      /* ================= auth screens ================= */
      async function boot() {
        if (S.token) {
          try {
            S.me = await rpc('pba_me', { p_token: S.token });
            return shell();
          } catch (e) {
            S.token = null;
            sessionStorage.removeItem('pba.t');
          }
        }
        authScreen();
      }
      const CODE_LEN = 5;
      function authScreen() {
        const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'clr', '0', 'del'];
        const DEL = '<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-6-7z"/><path d="m12.5 9.5 5 5m0-5-5 5"/></svg>';
        $('#root').innerHTML = `<div class="pbg">
    <form class="pbg-card" id="authF" autocomplete="off">
      <div class="pbg-top">
        <span class="pbg-logo">${LOGO}</span>
        <h1>Admin</h1>
        <p>Enter your ${CODE_LEN}-digit code</p>
      </div>
      <label class="pbg-pin" id="pin" for="aCode">${Array.from({ length: CODE_LEN }, (_, i) => `<i data-i="${i}"></i>`).join('')}
        <input id="aCode" inputmode="numeric" pattern="[0-9]*" maxlength="${CODE_LEN}" autocomplete="one-time-code" aria-label="Admin access code" autofocus></label>
      <div class="pbg-err" id="aErr" role="alert"></div>
      <div class="pbg-pad" id="kp">${keys.map(k => `<button type="button" data-k="${k}" class="${k.length > 1 ? 'fn' : ''}" aria-label="${k === 'del' ? 'Delete' : k === 'clr' ? 'Clear' : k}">${k === 'del' ? DEL : k === 'clr' ? 'Clear' : k}</button>`).join('')}</div>
      <button class="pbg-go" id="aGo">Unlock</button>
      <div class="pbg-foot"><span>${IC.shield}Locks after 5 wrong tries</span><a href="./">Back to game</a></div>
    </form></div>`;
        const inp = $('#aCode'),
          pin = $('#pin'),
          er = $('#aErr'),
          b = $('#aGo');
        let busy = false;
        const paint = () => {
          const v = inp.value;
          $$('#pin i').forEach((d, i) => {
            d.classList.toggle('on', i < v.length);
            d.classList.toggle('cur', i === v.length && document.activeElement === inp);
          });
        };
        const submit = async () => {
          if (busy) return;
          const code = inp.value;
          if (code.length !== CODE_LEN) {
            er.textContent = `Enter all ${CODE_LEN} digits.`;
            return;
          }
          busy = true;
          er.textContent = '';
          b.disabled = true;
          b.textContent = 'Checking…';
          pin.classList.add('busy');
          try {
            const r = await rpc('pba_code_login', { p_code: code });
            S.token = r.token;
            S.me = r.admin;
            sessionStorage.setItem('pba.t', r.token);
            pin.classList.add('ok');
            setTimeout(() => {
              shell();
              toast('Welcome back, ' + r.admin.username);
            }, 380);
          } catch (ex) {
            busy = false;
            pin.classList.remove('busy');
            pin.classList.remove('shake');
            void pin.offsetWidth;
            pin.classList.add('shake');
            er.textContent =
              ex.code === 'bad_code'
                ? 'Wrong code.' + (ex.left != null ? ` ${ex.left} ${ex.left === 1 ? 'try' : 'tries'} left.` : '')
                : ex.message;
            inp.value = '';
            paint();
            inp.focus();
            b.disabled = false;
            b.textContent = 'Unlock';
          }
        };
        inp.addEventListener('input', () => {
          inp.value = inp.value.replace(/\D/g, '').slice(0, CODE_LEN);
          er.textContent = '';
          if (inp.value) pin.classList.remove('shake');
          paint();
          if (inp.value.length === CODE_LEN) submit();
        });
        inp.addEventListener('focus', paint);
        inp.addEventListener('blur', paint);
        $('#kp').onclick = e => {
          const k = e.target.closest('button')?.dataset.k;
          if (!k || busy) return;
          if (k === 'del') inp.value = inp.value.slice(0, -1);
          else if (k === 'clr') inp.value = '';
          else if (inp.value.length < CODE_LEN) inp.value += k;
          inp.dispatchEvent(new Event('input'));
        };
        $('#authF').onsubmit = e => {
          e.preventDefault();
          submit();
        };
        paint();
        setTimeout(() => inp.focus(), 50);
      }
      async function signOut(expired) {
        const t = S.token;
        S.token = null;
        S.me = null;
        sessionStorage.removeItem('pba.t');
        if (t && !expired) rpc('pba_logout', { p_token: t }).catch(() => {});
        authScreen();
        if (expired) toast(ERR.admin_auth, 'err');
      }

      /* ================= shell + router ================= */
      /* Every page, grouped into a few sections. Each ['-', name] starts a section: the sidebar shows one
         link per section and the section's pages become tabs at the top of the page.
         (admin-abuse.js inserts Admin Abuse + Exotic pets right after ['-', 'Game'].) */
      const NAV = [
        ['-', 'Overview'],
        ['dashboard', 'Dashboard', IC.dash, 'moderator'],
        ['analytics', 'Analytics', IC.chart, 'moderator'],
        ['-', 'Players'],
        ['users', 'Players', IC.users, 'moderator'],

      const LV = { ws: null, ref: 0, hb: 0, backoff: 1000, state: 'off', at: 0 };

        if (!LV.ws || LV.ws.readyState !== 1) return;

      }
      function liveConnect() {
        if (LV.ws || !S.me) return;
        try {
          LV.ws = new WebSocket(`wss://amnbnuabxoxhggidlhcn.supabase.co/realtime/v1/websocket?apikey=${ANON}&vsn=1.0.0`);
        } catch (e) {
          LV.ws = null;
          setTimeout(liveConnect, 5000);
          return;
        }
        LV.ws.onopen = () => {
          LV.backoff = 1000;
          liveSend('realtime:pb', 'phx_join', { config: { broadcast: { self: true, ack: false }, presence: { key: '' }, postgres_changes: [], private: false }, access_token: ANON });
          clearInterval(LV.hb);
          LV.hb = setInterval(() => liveSend('phoenix', 'heartbeat', {}), 25000);
        };
        LV.ws.onmessage = m => {
          let j;
          try {
            j = JSON.parse(m.data);
          } catch (e) {
            return;
          }
          if (j.event === 'phx_reply' && j.topic === 'realtime:pb' && j.payload?.status === 'ok') liveState('on');
          else if (j.event === 'broadcast' && j.payload?.event === 'change') {
            const p = j.payload.payload || {};
            LV.at = Date.now();

            if (p.k === 'site') refreshMaint();
          }
        };
        LV.ws.onclose = () => {
          LV.ws = null;
          clearInterval(LV.hb);
          liveState('off');
          setTimeout(liveConnect, LV.backoff);

      const ageCell = u =>

        return `<div class="card" style="margin-top:16px"><div class="card-h"><h3>Pets and items</h3><span class="muted small">${num(pets.length)} pets · ${num(inv.length)} items · from their last save</span></div>

      }

      VIEWS.user = {
        async render(v, [id]) {
          v.innerHTML = `<a href="#/users" class="btn ghost sm" style="margin-bottom:12px">${IC.back}All users</a><div class="card">${skeleton(5)}</div>`;

        <div class="stats"><div class="stat"><small>Total return</small><b class="mono ${cls(u.return_pct)}">${pct(u.return_pct)}</b></div><div class="stat"><small>Account value</small><b class="mono">${usd(u.value)}</b></div>
          <div class="stat"><small>Level</small><b class="mono">${u.level}</b></div><div class="stat"><small>Trades</small><b class="mono">${num(u.trades)}</b></div><div class="stat"><small>Coins</small><b class="mono">${num(u.coins)}</b></div><div class="stat"><small>Friends</small><b class="mono">${num(d.friends)}</b></div><div class="stat"><small>Age</small><b class="mono">${u.age == null ? '—' : u.age}</b></div></div>
        <div class="actbar">${acts || '<span class="muted small">Your role can view this account but not change it.</span>'}</div></div>
      ${invCard(p)}
      <div class="grid g2" style="margin-top:16px">
        <div class="card"><div class="card-h"><h3>Account activity</h3><span class="muted small">Last 14 days</span></div>${activityStrip(d.events)}${d.events.length ? `<div class="tl">${d.events.map(e => `<div class="e"><b>${esc(evLabel(e))}</b><small>${dt(e.created_at)}</small></div>`).join('')}</div>` : '<div class="empty">No activity yet.</div>'}</div>
        <div><div class="card"><div class="card-h"><h3>Chat</h3>${u.kid ? '<span class="pill p-warn"><i></i>Under 14</span>' : ''}</div><div class="chatst"><div><b>${chatState(u).t}</b><small>${chatState(u).s}</small></div></div></div>
        <div class="card"><div class="card-h"><h3>Details</h3></div><dl class="kv"><dt>User ID</dt><dd class="mono small">${esc(u.id)}</dd><dt>Title</dt><dd>${esc(u.title || '—')}</dd><dt>Admin note</dt><dd>${esc(u.note || '—')}</dd>
          <dt>Cash</dt><dd class="mono">${p ? usd(p.cash) : '—'}</dd><dt>Holdings</dt><dd>${

              <div class="chips" style="margin:-6px 0 12px">${['VIP', 'Streamer', 'Suspicious', 'Friend', 'Tester', 'Whale'].map(t => `<button type="button" class="btn sm" data-tag="${t}">+ ${t}</button>`).join('')}</div>
