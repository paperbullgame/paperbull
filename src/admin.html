            return modal({
              title: `Adjust balance for ${who}`,

            lb_hide: {

              text: 'They keep playing normally but stop showing up on the global leaderboard. Use this for suspicious returns.',

              done: 'Hidden from the leaderboard',
              danger: false,
            },
            lb_show: {
              title: `Show ${who} on the leaderboard again?`,
              text: 'They’ll be ranked with everyone else.',
              ok: 'Show',
              done: 'Back on the leaderboard',
              danger: false,
            },
            suspend: {

          }[a];
          const r = await confirmBox(cfg);
          if (!r) return;
          try {

                p_id: u.id,
                p_action: a,

      };
      function activityStrip(events) {
        const days = new Set((events || []).filter(e => ['active', 'signup', 'login'].includes(e.kind)).map(e => new Date(e.created_at).toDateString()));
        const out = [];
        for (let i = 13; i >= 0; i--) {
          const d = new Date();
          d.setDate(d.getDate() - i);
          const on = days.has(d.toDateString());
          out.push(`<i class="${on ? 'on' : ''}" title="${d.toLocaleDateString([], { month: 'short', day: 'numeric' })}${on ? ' · played' : ''}"></i>`);
        }
        const n = [...days].filter(x => Date.now() - new Date(x) < 14 * 864e5).length;
        return `<div class="astrip">${out.join('')}<span class="small muted">${n} of 14 days</span></div>`;
      }
      const EV = {
        signup: 'Created account',

                ? ` (${e.detail.count})`

      /* ---------- give gifts ---------- */
      async function giveDialog(preset, done, opt = {}) {

    <select id="gI" hidden>${itemOptions()}</select>
    <div id="gIp"></div>

      <label class="f" id="gMw" hidden><span>Mutation (exotic pets)</span><select class="in" id="gMut"><option value="">No mutation</option>${window.ExoticArt ? ExoticArt.MUTS.map(m => `<option value="${m.id}">${esc(m.name)} (perk ×${m.mult})</option>`).join('') : ''}</select></label>
      <label class="f"><span>Gift name (optional)</span><input class="in" id="gN" maxlength="60" placeholder="Optional"></label></div>
    <div class="chips" id="gAc" style="margin:-4px 0 10px"></div>
    <div id="gPv" style="margin-bottom:12px"></div>
    <label class="f"><span>Message (optional, shown in the game)</span><input class="in" id="gM" maxlength="200" placeholder="Thanks for playing!"></label><div class="err"></div>`,

          onOk: async ov => {

                  (k === 'item'

                    : kindLabel({ kind: k, amount: +$('#gA', ov).value })),

      /* ---------- promo codes ---------- */

      VIEWS.promos = {

      /* ---------- users CSV export ---------- */
      async function fetchAllUsers(st, max = 20000) {
        const all = [];
        for (let page = 1; page <= 200; page++) {
          const r = await A('pba_users', { p_q: st.q, p_status: st.status, p_sort: st.sort, p_dir: st.dir, p_page: page, p_per: 100, p_joined: localRange(st.joined), p_seen: localRange(st.seen), p_tag: st.tag || null });
          all.push(...r.rows);
          if (all.length >= r.total || !r.rows.length || all.length >= max) break;
        }
        return all;
      }
      function downloadCSV(rows, name) {
        if (!rows.length) return toast('Nothing to export.', 'err');
        const keys = Object.keys(rows[0]).filter(k => rows.some(u => u[k] !== null && typeof u[k] !== 'object'));
        const q = v => {
          const s = v == null ? '' : String(v);
          return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
        };
        const csv = [keys.join(',')].concat(rows.map(u => keys.map(k => q(u[k])).join(','))).join('\n');
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        a.download = `paperbull-${name}-${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          URL.revokeObjectURL(a.href);
          a.remove();
        }, 500);
        toast(`Exported ${num(rows.length)} rows`);
      }
      async function exportUsers(st) {
        downloadCSV((await fetchAllUsers(st)).map(u => ({ ...u, tags: (u.tags || []).join(' ') })), 'users');
      }

          $$('th.s', box).forEach(

        ${ro || mLiveOn ? '' : `<label class="f"><span>Reopen automatically after</span><select class="in" id="mFor"><option value="">Only when I reopen it</option><option value="15">15 minutes</option><option value="30" selected>30 minutes</option><option value="60">1 hour</option><option value="120">2 hours</option><option value="360">6 hours</option></select></label>`}
        <label class="f"><span>Message players see</span><textarea class="in" id="mM" maxlength="300" rows="2" ${ro ? 'disabled' : ''}>${esc(m.message || '')}</textarea></label>
        ${ro ? '' : '<button class="btn" id="mS">Save message</button>'}</div>
      <div class="card ev-card ${evLive ? 'live' : ''}"><div class="card-h"><h3>Live event</h3>${evLive ? `<span class="pill p-ok"><i></i>Running${ev.until ? ' · ends ' + dt(ev.until) : ''}</span>` : '<span class="small muted">Boost the whole game for a while</span>'}</div>

        <label class="f"><span>Banner text</span><input class="in" id="evL" maxlength="60" value="${esc(ev.label || '')}" placeholder="Double coins weekend!" ${ro ? 'disabled' : ''}></label>

        ${ro ? '' : `<div class="chips" style="margin:-6px 0 12px">${[['2 hours', 2], ['Rest of today', 'eod'], ['24 hours', 24], ['This weekend', 'wk']].map(([l, v]) => `<button type="button" class="btn sm" data-evq="${v}">${l}</button>`).join('')}</div><div style="display:flex;gap:8px"><button class="btn pri" id="evSave">${evLive ? 'Update event' : 'Start event'}</button>${evLive ? '<button class="btn dan" id="evEnd">End now</button>' : ''}</div>`}</div>
      <div class="card"><div class="card-h"><h3>Game settings</h3><span class="small muted">Applied live, no restart needed</span></div>

        <label class="f"><span>Market volatility</span><select class="in" id="gVol" ${ro ? 'disabled' : ''}>${[[0.5, 'Calm · 0.5×'], [0.75, 'Quiet · 0.75×'], [1, 'Normal · 1×'], [1.5, 'Lively · 1.5×'], [2, 'Wild · 2×'], [3, 'Chaos · 3×']].map(([x, l]) => `<option value="${x}" ${+g.vol_mult === x ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <label class="f"><span>Seconds between headlines</span><input class="in" type="number" id="gNews" min="10" max="600" step="5" value="${g.news_every_s}" ${ro ? 'disabled' : ''}></label>
        <label class="f"><span>Market events</span><select class="in" id="gEvt" ${ro ? 'disabled' : ''}>${optList([[0, 'Off'], [0.5, 'Rare · 0.5×'], [1, 'Normal · 1×'], [2, 'Often · 2×'], [4, 'Chaos · 4×']], g.market_events)}</select></label>
        <label class="f"><span>Max leverage</span><select class="in" id="gLev" ${ro ? 'disabled' : ''}>${optList([[1, '1× (off)'], [2, '2×'], [5, '5×'], [10, '10×'], [20, '20×']], g.max_leverage)}</select></label></div>
        <p class="small muted" style="margin:-4px 0 12px">Volatility scales how much every price moves; headlines are the company news items that push prices around. Market events are the big surprises (crashes, squeezes, rallies). Max leverage caps the multiplier players can trade with. Coin and XP multipliers live under <b>Live event</b>.</p>
        ${ro ? '' : '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" id="gSave">Save game settings</button><button class="btn" id="gReset">Back to defaults</button></div>'}</div>
      <div class="card"><div class="card-h"><h3>Blocked words</h3><span class="small muted">${bw.length} word${bw.length === 1 ? '' : 's'}</span></div>
        <p class="small muted" style="margin:0 0 10px">Usernames and display names containing any of these are rejected. One word per line, not case sensitive.</p>
        <textarea class="in mono" id="bwT" rows="5" placeholder="badword&#10;anotherone" ${ro ? 'disabled' : ''}>${esc(bw.join('\n'))}</textarea>
        ${ro ? '' : '<button class="btn" id="bwS" style="margin-top:10px">Save blocked words</button>'}</div>
      <div class="card"><div class="card-h"><h3>Features</h3>${f._updated_by ? `<span class="small muted">Last change by ${esc(f._updated_by)} · ${ago(f._updated_at)}</span>` : ''}</div>
        ${FEATS.map(([k, l, d]) => `<div class="feat"><div class="t"><b>${l}</b><small>${d}</small></div><span class="pill ${f[k] !== false ? 'p-ok' : 'p-mut'}" id="fp-${k}">${f[k] !== false ? 'On' : 'Off'}</span><label class="sw" aria-label="${esc(l)}"><input type="checkbox" data-f="${k}" ${f[k] !== false ? 'checked' : ''} ${ro ? 'disabled' : ''}><span></span></label></div>`).join('')}
        ${ro ? '<p class="small muted">Moderators can view these settings. Admins and owners can change them.</p>' : ''}</div>`;
          if (ro) return;
          $('#mT').onclick = async () => {
            const on = !m.on;
            const r = on
              ? await confirmBox({
                  title: 'Shut down PAPERBULL?',
                  text: 'Every player gets locked out and sees the maintenance message until you reopen the site.',
                  ok: 'Shut down',
                  type: 'SHUTDOWN',
                })
              : await confirmBox({
                  title: 'Reopen the site?',
                  text: 'Players can get back in right away.',
                  ok: 'Reopen',
                  danger: false,
                });
            if (!r) return;
            const mins = on && $('#mFor') ? +$('#mFor').value : 0;
            try {
              await act(
                A('pba_site_set', {
                  p_key: 'maintenance',
                  p_value: { on, message: $('#mM').value, until: mins ? new Date(Date.now() + mins * 60000).toISOString() : null },
                }),
                on ? (mins ? `Maintenance mode is ON · reopens in ${mins >= 60 ? mins / 60 + 'h' : mins + ' min'}` : 'Maintenance mode is ON') : 'The site is open again'
              );
              refreshMaint();
              this.render(v);
            } catch (e) {}
          };
          $$('[data-evq]', v).forEach(
            b =>
              (b.onclick = () => {
                const q = b.dataset.evq,
                  d = new Date();
                if (q === 'eod') d.setHours(23, 59, 0, 0);
                else if (q === 'wk') {
                  d.setDate(d.getDate() + ((7 - d.getDay()) % 7 || 7) - (d.getDay() === 0 ? 7 : 0));
                  d.setHours(23, 59, 0, 0);
                  if (d < new Date()) d.setDate(d.getDate() + 7);
                } else d.setTime(d.getTime() + +q * 3600000);
                $('#evU').value = localInput(d.toISOString());

          if ($('#evSave'))
            $('#evSave').onclick = async () => {
              const c = +$('#evC').value,
                x = +$('#evX').value;
              if (c === 1 && x === 1) return toast('Pick at least one multiplier above 1×.', 'err');
              if (!$('#evU').value) return toast('Set when the event ends.', 'err');
              try {
                await act(
                  A('pba_site_set', {
                    p_key: 'events',
                    p_value: { coin_mult: c, xp_mult: x, label: $('#evL').value, until: new Date($('#evU').value).toISOString() },
                  }),
                  'Live event is running. Players see it right away.'
                );
                this.render(v);
              } catch (e) {}
            };
          if ($('#evEnd'))
            $('#evEnd').onclick = async () => {
              try {
                await act(A('pba_site_set', { p_key: 'events', p_value: { coin_mult: 1, xp_mult: 1 } }), 'Event ended');
                this.render(v);
              } catch (e) {}
            };
          if ($('#gSave'))
            $('#gSave').onclick = async () => {
              const val = { daily_bonus: +$('#gDaily').value, free_pack_hours: +$('#gPack').value, vol_mult: +$('#gVol').value, news_every_s: +$('#gNews').value, market_events: +$('#gEvt').value, max_leverage: +$('#gLev').value };
              if (!(val.daily_bonus >= 0 && val.daily_bonus <= 10000)) return toast('Daily bonus must be 0 to 10,000 coins.', 'err');
              if (!(val.free_pack_hours >= 0.25 && val.free_pack_hours <= 168)) return toast('Free pack timer must be 0.25 to 168 hours.', 'err');
              if (!(val.news_every_s >= 10 && val.news_every_s <= 600)) return toast('Headlines: 10 to 600 seconds.', 'err');
              try {
                await act(A('pba_site_set', { p_key: 'game', p_value: val }), 'Game settings saved · live in every open game');
              } catch (e) {}
            };
          if ($('#gReset'))
            $('#gReset').onclick = async () => {
              try {
                await act(A('pba_site_set', { p_key: 'game', p_value: { daily_bonus: 50, free_pack_hours: 4, vol_mult: 1, news_every_s: 55, market_events: 1, max_leverage: 10 } }), 'Game settings back to defaults');

          if ($('#bwS'))

              const words = $('#bwT').value.split(/[\n,]+/).map(x => x.trim()).filter(Boolean);

          $('#mS').onclick = async () => {
            try {
              await act(
                A('pba_site_set', { p_key: 'maintenance', p_value: { on: !!m.on, message: $('#mM').value } }),
                'Message saved'
              );

          $$('[data-f]', v).forEach(

              (i.onchange = async () => {

                    `${label} ${on ? 'on' : 'off'}`

                  const p = $('#fp-' + k);
                  p.className = 'pill ' + (on ? 'p-ok' : 'p-mut');
                  p.textContent = on ? 'On' : 'Off';
                } catch (e) {
                  i.checked = !on;
                }
              })
          );
        },
      };

      /* ---------- market: add stocks, set prices, delist ---------- */
      const VOLS = [[0.2, 'Calm (index-fund energy)'], [0.35, 'Steady (blue chip)'], [0.55, 'Normal'], [0.85, 'Wild'], [1.3, 'Unhinged (meme stock)'], [2, 'Absolute chaos']];
      const symPill = t => `<span class="pill ${t === 'crypto' ? 'p-brand' : 'p-info'}">${t === 'crypto' ? 'Coin' : 'Stock'}</span>`;
      VIEWS.market = {
        rows: null,
        q: '',
        async render(v) {
          const ro = !can('admin');
          v.innerHTML =
            head(
              'Market',
              'Add your own stocks and coins, set any price, rename or delist. Every open game updates within a second.',
              ro ? '' : `<button class="btn" id="mkPrice">${IC.edit}Set a price</button><button class="btn pri" id="mkAdd">${IC.plus}Add a stock</button>`
            ) +
            `<div class="card"><div class="card-h"><h3>Your changes</h3><input class="in" id="mkQ" placeholder="Filter…" style="max-width:220px" value="${esc(this.q)}"></div><div id="mkBox">${skeleton(4)}</div></div>
      <div class="card"><div class="card-h"><h3>Built-in names</h3><span class="small muted">${GAME_ASSETS.length} featured + ~1,750 more real stocks and coins</span></div>
        <p class="small muted" style="margin:0 0 10px">These already exist in the game. Click one to set its price, rename it or take it off the market. Every other real ticker in the game (like KO, UBER, PEPE) works too when you type the exact symbol.</p>
        <div class="chips" id="mkKnown">${GAME_ASSETS.map(a => `<button type="button" class="btn sm" data-sym="${esc(a[0])}" title="${esc(a[1])}">${esc(a[0])}</button>`).join('')}</div></div>`;
          if (!ro) {
            $('#mkAdd').onclick = () => this.edit(null, true);
            $('#mkPrice').onclick = () => this.priceFor('');
            $$('#mkKnown [data-sym]').forEach(b => (b.onclick = () => this.priceFor(b.dataset.sym)));
          } else $$('#mkKnown [data-sym]').forEach(b => (b.disabled = true));
          $('#mkQ').oninput = () => {
            this.q = $('#mkQ').value.trim().toLowerCase();
            this.paint();
          };
          await this.load();
        },
        async load() {
          try {
            this.rows = await A('pba_market');
          } catch (e) {
            if ($('#mkBox')) $('#mkBox').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
            return;
          }
          this.paint();
        },
        onLive(k) {
          if (k === 'market' && $('#mkBox')) this.load();

        paint() {
          const box = $('#mkBox');
          if (!box || !this.rows) return;
          const ro = !can('admin');
          const rows = this.rows.filter(r => !this.q || r.sym.toLowerCase().includes(this.q) || (r.name || '').toLowerCase().includes(this.q));
          box.innerHTML = rows.length
            ? `<div class="tw"><table><thead><tr><th>Ticker</th><th>Name</th><th>Type</th><th class="r">Price</th><th>Sector</th><th>Status</th><th>Changed</th>${ro ? '' : '<th class="r">Actions</th>'}</tr></thead><tbody>${rows
                .map(
                  r => `<tr><td><b class="mono">${esc(r.sym)}</b>${r.custom ? ' <span class="pill p-ok" style="margin-left:6px">Added by you</span>' : ''}</td><td>${esc(r.name)}</td><td>${symPill(r.type)}</td>
          <td class="r mono">${r.price != null ? usd(+r.price) : '<span class="muted">simulated</span>'}${r.price_at ? `<div class="small muted">set ${ago(r.price_at)}</div>` : ''}</td><td>${esc(r.sector || '—')}</td>
          <td>${r.hidden ? '<span class="pill p-dn"><i></i>Delisted</span>' : '<span class="pill p-ok"><i></i>Listed</span>'}</td><td class="small">${ago(r.updated_at)}<div class="muted">${esc(r.updated_by || '')}</div></td>
          ${ro ? '' : `<td class="r"><div style="display:inline-flex;gap:6px;white-space:nowrap"><button class="btn sm" data-px="${esc(r.sym)}">Set price</button><button class="btn sm" data-ed="${esc(r.sym)}">Edit</button><button class="btn sm" data-hd="${esc(r.sym)}">${r.hidden ? 'Relist' : 'Delist'}</button><button class="btn sm dan" data-rm="${esc(r.sym)}">${IC.trash}</button></div></td>`}</tr>`
                )
                .join('')}</tbody></table></div>`
            : `<div class="empty">${this.q ? 'No matches.' : 'No changes yet. Add a stock or set a price to get started.'}</div>`;
          $$('[data-px]', box).forEach(b => (b.onclick = () => this.priceFor(b.dataset.px)));
          $$('[data-ed]', box).forEach(b => (b.onclick = () => this.edit(this.rows.find(r => r.sym === b.dataset.ed))));
          $$('[data-hd]', box).forEach(
            b =>
              (b.onclick = async () => {
                const r = this.rows.find(x => x.sym === b.dataset.hd);
                if (!r.hidden) {
                  const ok = await confirmBox({ title: `Delist ${r.sym}?`, text: 'It disappears from Markets and search. Players who hold it can still sell, nobody can buy more.', ok: 'Delist' });
                  if (!ok) return;
                }
                try {
                  await act(A('pba_market_set', { p: { sym: r.sym, hidden: !r.hidden } }), `${r.sym} ${r.hidden ? 'is back on the market' : 'delisted'}`);

                } catch (e) {}
              })
          );
          $$('[data-rm]', box).forEach(
            b =>
              (b.onclick = async () => {
                const r = this.rows.find(x => x.sym === b.dataset.rm);
                const ok = await confirmBox({
                  title: `Remove ${r.sym}?`,

        priceFor(sym) {

          modal({

        <div class="chips" style="margin:-6px 0 12px">${[['×2', 2], ['×1.5', 1.5], ['−25%', 0.75], ['−50%', 0.5]].map(([l, m]) => `<button type="button" class="btn sm" data-m="${m}" title="Relative to the last price you set">${l}</button>`).join('')}</div>
        <p class="small muted" style="margin:0">The price jumps to this the moment you save, then keeps trading normally from there. Players see a headline: “<b>${esc(r ? r.name : 'Company')} repriced by the exchange</b>”.</p><div class="err"></div>`,

              this.load();
            },
          });
        },
        edit(r, isNew) {
          const known = r && !r.custom;
          modal({
            title: isNew ? 'Add a stock or coin' : `Edit ${r.sym}`,
            ok: isNew ? 'Add to the market' : 'Save',
            body: `<div class="grid g2" style="gap:0 12px"><label class="f"><span>Ticker</span><input class="in mono" id="eS" maxlength="7" value="${esc(r ? r.sym : '')}" ${r ? 'disabled' : ''} placeholder="ZAP" style="text-transform:uppercase"></label>
        <label class="f"><span>Type</span><select class="in" id="eT" ${known ? 'disabled' : ''}><option value="stock" ${!r || r.type === 'stock' ? 'selected' : ''}>Stock</option><option value="crypto" ${r && r.type === 'crypto' ? 'selected' : ''}>Crypto coin</option></select></label></div>
        <label class="f"><span>Company / coin name</span><input class="in" id="eN" maxlength="40" value="${esc(r ? r.name : '')}" placeholder="Zap Energy"></label>
        <div class="grid g2" style="gap:0 12px"><label class="f"><span>${isNew ? 'Starting price (USD)' : 'Price (USD, blank = leave to the simulation)'}</span><input class="in mono" id="eP" type="number" min="0.000001" step="any" value="${r && r.price != null ? esc(r.price) : ''}" placeholder="42"></label>
        <label class="f"><span>Volatility</span><select class="in" id="eV">${(r && r.vol == null ? [[null, 'Keep as is']] : []).concat(VOLS).map(([x, l]) => `<option value="${x ?? ''}" ${r && r.vol != null ? (Math.abs(+r.vol - x) < 0.01 ? 'selected' : '') : x === 0.55 && isNew ? 'selected' : ''}>${l}</option>`).join('')}</select></label></div>
        <label class="f"><span>Sector (shown under the name)</span><input class="in" id="eSec" maxlength="24" value="${esc(r ? r.sector || '' : '')}" placeholder="Tech, Energy, Meme…"></label>
        <label class="f"><span>Note for other admins</span><input class="in" id="eNote" maxlength="200" value="${esc(r ? r.note || '' : '')}" placeholder="Optional"></label><div class="err"></div>`,
            onOk: async ov => {
              const s = (r ? r.sym : $('#eS', ov).value.trim().toUpperCase());

                p.custom = true;

      /* ---------- shop items: prices + on/off for every in-game item and pack ---------- */
      VIEWS.shop = {
        ov: null,
        q: '',
        t: '',
        async render(v) {
          const ro = !can('admin');

        },
        async load() {
          const box = $('#aT');
          let rows;
          try {
            rows = await A('pba_admins');
          } catch (e) {
            box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
            return;
          }
          this.rows = rows;
          box.innerHTML = `<div class="tw"><table><thead><tr><th>Admin</th><th>Role</th><th>Status</th><th>Last sign-in</th><th>Added</th><th class="r">Actions</th></tr></thead><tbody>${rows
            .map(
              a => `<tr><td><div class="who">${avatar(a.username)}<div><b>${esc(a.username)}${a.me ? ' <span class="pill p-brand" style="height:20px">You</span>' : ''}</b></div></div></td><td>${rolePill(a.role)}</td>
      <td>${a.disabled ? '<span class="pill p-mut"><i></i>Disabled</span>' : '<span class="pill p-ok"><i></i>Active</span>'}</td><td>${ago(a.last_login)}</td><td>${dday(a.created_at)}</td>
      <td class="r">${a.me ? '<span class="small muted">Use the key icon to change your password</span>' : `<div style="display:inline-flex;gap:6px"><button class="btn sm" data-ed="${esc(a.username)}">Edit</button><button class="btn sm" data-dis="${esc(a.username)}">${a.disabled ? 'Enable' : 'Disable'}</button><button class="btn sm icon" data-rm="${esc(a.username)}" aria-label="Remove" title="Remove">${IC.trash}</button></div>`}</td></tr>`
            )
            .join('')}</tbody></table></div>`;
          const by = u => this.rows.find(a => a.username === u);
          $$('[data-ed]', box).forEach(b => (b.onclick = () => this.edit(by(b.dataset.ed))));
          $$('[data-dis]', box).forEach(
            b =>
              (b.onclick = async () => {
                const a = by(b.dataset.dis);
                if (!a.disabled) {
                  const r = await confirmBox({
                    title: `Disable ${a.username}?`,
                    text: 'They’ll be signed out and can’t sign in until re-enabled.',
                    ok: 'Disable',
                  });
                  if (!r) return;
                }
                try {
                  await act(
                    A('pba_admin_save', {
                      p_username: a.username,
                      p_password: null,
                      p_role: a.role,
                      p_disabled: !a.disabled,
                    }),
                    a.disabled ? 'Admin enabled' : 'Admin disabled'
                  );
                  this.load();
                } catch (e) {}
              })
          );
          $$('[data-rm]', box).forEach(
            b =>
              (b.onclick = async () => {
                const a = by(b.dataset.rm);
                const r = await confirmBox({
                  title: `Remove ${a.username}?`,
                  text: 'Their admin account is deleted. The audit log keeps their past actions.',
                  ok: 'Remove admin',
                  type: a.username,
                });
                if (!r) return;
                try {
                  await act(A('pba_admin_delete', { p_username: a.username }), 'Admin removed');
                  this.load();
                } catch (e) {}
              })
          );
        },
        edit(a) {
          const n = !a;
          modal({
            title: n ? 'Add an admin' : `Edit ${a.username}`,
            ok: n ? 'Add admin' : 'Save',
            body: `
      <label class="f"><span>Username</span><input class="in" id="xU" ${n ? '' : 'disabled'} value="${esc(a ? a.username : '')}" autocomplete="off"></label>
      <label class="f"><span>Role</span><select class="in" id="xR">${['moderator', 'admin', 'owner'].map(r => `<option value="${r}" ${a && a.role === r ? 'selected' : ''}>${r[0].toUpperCase() + r.slice(1)}</option>`).join('')}</select></label>
      <label class="f"><span>${n ? 'Password (10+ characters)' : 'New password (leave empty to keep)'}</span><input class="in" id="xP" type="text" autocomplete="off"></label><div class="err"></div>`,
            onOk: async ov => {
              const role = $('#xR', ov).value;
              if (role === 'owner' && (!a || a.role !== 'owner')) {
                if (
                  !(await confirmBox({
                    title: 'Make them an owner?',
                    text: 'Owners have full control, including over other admins.',
                    ok: 'Yes, make owner',
                  }))
                )
                  return false;
              }
              await A('pba_admin_save', {
                p_username: n ? $('#xU', ov).value.trim() : a.username,
                p_password: $('#xP', ov).value || null,
                p_role: role,
                p_disabled: a ? a.disabled : false,
              });
              toast(n ? 'Admin added' : 'Admin updated');
              this.load();
            },
          });
        },
      };
      VIEWS.admins.role = 'owner';

      /* ---------- audit log ---------- */
      VIEWS.audit = {
        role: 'admin',
        st: { q: '', action: 'all', page: 1, per: 30 },
        render(v) {
          const st = this.st;
          v.innerHTML =
            head(
              'Audit log',
              'Every admin action: who did it, what changed and when. Entries can’t be edited or deleted.',
              `<button class="btn" id="lCsv">${IC.dl}Export CSV</button>`
            ) +
            `<div class="card"><div class="tools"><input class="in" id="lq" placeholder="Search admin, action or target" value="${esc(st.q)}">
      <select class="in" id="la">${[
        ['all', 'All actions'],
        ['user_', 'User actions'],
        ['gift_', 'Gifts'],
        ['content_', 'Content'],
        ['maintenance', 'Maintenance'],
        ['features', 'Features'],
        ['admin_', 'Admin accounts'],
        ['promo_', 'Promo codes'],
        ['login', 'Sign-ins'],
        ['code_', 'Access code'],
      ]
        .map(([k, l]) => `<option value="${k}" ${st.action === k ? 'selected' : ''}>${l}</option>`)
        .join('')}</select></div><div id="lt">${skeleton(6)}</div></div>`;
          $('#lCsv').onclick = async () => {
            const b = $('#lCsv');
            b.disabled = true;
            try {
              const all = [];
              for (let page = 1; page <= 100; page++) {
                const r = await A('pba_audit', { p_q: st.q, p_action: st.action, p_page: page, p_per: 100 });
                all.push(...r.rows);
                if (all.length >= r.total || !r.rows.length) break;
              }
              downloadCSV(all.map(x => ({ ...x, details: x.details ? JSON.stringify(x.details) : '' })), 'audit');
            } catch (e) {
              toast(e.message, 'err');
            }
            b.disabled = false;
          };
          $('#lq').oninput = debounce(e => {
            st.q = e.target.value;
            st.page = 1;
            this.load();
          });
          $('#la').onchange = e => {
            st.action = e.target.value;
            st.page = 1;
            this.load();
          };
          this.load();
        },
        async load() {
          const st = this.st,
            box = $('#lt');
          if (!box) return;
          let r;
          try {
            r = await A('pba_audit', { p_q: st.q, p_action: st.action, p_page: st.page, p_per: st.per });
          } catch (e) {
            box.innerHTML = `<div class="empty">${esc(e.message)}</div>`;
            return;
          }
          box.innerHTML = r.rows.length
            ? `<div class="tw"><table><thead><tr><th>When</th><th>Admin</th><th>Action</th><th>Target</th><th>Changes</th></tr></thead><tbody>${r.rows
                .map(
                  a => `<tr><td>${dt(a.created_at)}</td><td>${esc(a.admin_name || 'system')} ${a.admin_role ? `<span class="muted small">${esc(a.admin_role)}</span>` : ''}</td>
      <td><b>${esc(actLabel(a.action))}</b></td><td>${a.target_type === 'user' && a.target_id ? `<a href="#/user/${esc(a.target_id)}">${esc(a.target_label || a.target_id)}</a>` : esc(a.target_label || '—')}</td>
      <td style="white-space:normal">${a.details ? `<pre class="json">${esc(JSON.stringify(a.details, null, 1))}</pre>` : '<span class="muted">—</span>'}</td></tr>`
                )
                .join('')}</tbody></table></div>${pager(r.total, r.page, r.per)}`
            : '<div class="empty">No entries match.</div>';
          $$('[data-pg]', box).forEach(
            b =>
              (b.onclick = () => {
                st.page = +b.dataset.pg;
                this.load();
              })
          );
        },
      };

      /* ---------- global search ---------- */
/*__ADMIN_ABUSE__*/
/*__ADMIN_ITEMS__*/
      VIEWS.search = {
        async render(v, [q]) {
          q = q || '';
          if ($('#gs')) $('#gs').value = q;
          v.innerHTML =
            head(`Search: “${esc(q)}”`, 'Users, gifts, transactions and content.') +
            `<div class="card">${skeleton(5)}</div>`;
          let r;
          try {
            r = await A('pba_search', { p_q: q });
          } catch (e) {
            v.innerHTML += `<div class="card empty">${esc(e.message)}</div>`;
            return;
          }
          const none = !r.users.length && !r.gifts.length && !r.transactions.length && !r.content.length;
          v.innerHTML =
            head(`Search: “${esc(q)}”`, 'Users, gifts, transactions and content.') +
            `<div class="card sr">${none ? '<div class="empty">Nothing found. Try a username or part of a name.</div>' : ''}
      ${r.users.length ? `<h4>Users</h4><div class="list">${r.users.map(u => `<a class="li" href="#/user/${u.id}" style="text-decoration:none;color:inherit">${avatar(u.name)}<div class="t"><b>${esc(u.name)}</b><small>@${esc(u.username)} · joined ${dday(u.created_at)}</small></div>${statusPill(u.status)}</a>`).join('')}</div>` : ''}
      ${r.gifts.length ? `<h4>Gifts</h4><div class="list">${r.gifts.map(g => `<a class="li" href="#/gifts" style="text-decoration:none;color:inherit"><div class="t"><b>${esc(g.name)}</b><small>${g.price ? num(g.price) + ' coins' : 'Free'}</small></div>${g.deleted ? '<span class="pill p-mut">Removed</span>' : g.active ? '<span class="pill p-ok">On sale</span>' : '<span class="pill p-warn">Hidden</span>'}</a>`).join('')}</div>` : ''}
      ${r.transactions.length ? `<h4>Transactions</h4><div class="list">${r.transactions.map(t => `<div class="li"><div class="t"><b>${esc(t.what)}</b><small>${esc(t.kind)} · @${esc(t.who)} · ${dt(t.at)}</small></div><span class="mono">${num(t.amount)}</span></div>`).join('')}</div>` : ''}
      ${r.content.length ? `<h4>Content</h4><div class="list">${r.content.map(c => `<a class="li" href="#/content" style="text-decoration:none;color:inherit"><div class="t"><b>${esc(c.title)}</b><small>${esc(c.kind)}</small></div><span class="pill ${c.status === 'published' ? 'p-ok' : 'p-mut'}">${c.status === 'published' ? 'Live' : 'Hidden'}</span></a>`).join('')}</div>` : ''}</div>`;
        },
      };

      boot();
    </script>

    <style id="mobCards">

        .tw { margin: 0 !important; padding: 0 !important; overflow: visible !important; }
        .tw table, .tw tbody, .tw tr, .tw td { display: block; width: 100%; }

        .tw td:first-child::before { display: none; }
        .tw td:empty { display: none; }
        .tw td .row-act, .tw td:last-child { flex-wrap: wrap; }
        .tw td:last-child:not([data-l]) { justify-content: flex-end; padding-top: 8px !important; }
        .ab-grid { grid-template-columns: 1fr 1fr !important; gap: 8px !important; }
      }
      #mNav { display: none; }
      .nav2 { gap: 1px !important; overflow-y: auto; padding-bottom: 10px; }
      .nav2 .nav-h { font: 800 10.5px/1 var(--sans, system-ui); letter-spacing: .09em; text-transform: uppercase; color: var(--mut); padding: 14px 12px 6px; opacity: .8; }
      .nav2 .nav-h:first-child { padding-top: 4px; }
      .nav2 a { padding: 7px 10px !important; min-height: 38px; font-size: 13.5px !important; }
      .nav2 a .ni { width: 26px !important; height: 26px !important; border-radius: 8px !important; }
      .nav2 a .ni svg { width: 16px !important; height: 16px !important; }
      @media (min-width: 901px) { #subnav { display: none !important; } }
      .side .nav2 { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; margin-right: -6px; padding-right: 6px; }
      .side .live { margin-top: 8px; padding: 6px 10px; }
      .side .live small { display: none; }
      .nav2 .ni, .qt .ni, #mNav .ni, :root:not([data-theme='dark']) .nav2 .ni { color: #fff !important; background: linear-gradient(145deg, var(--n1), var(--n2)) !important; box-shadow: inset 0 1px 0 rgba(255,255,255,.3) !important; }
      .nav2 .ni svg .f, .qt .ni svg .f, #mNav .ni svg .f { opacity: .35; }
      .nav2 .ni svg .k, .qt .ni svg .k, #mNav .ni svg .k { fill: var(--n2); }
      .nav2 a.on { background: color-mix(in srgb, var(--n2, #ff9a1f) 14%, var(--panel2)) !important; font-weight: 700; }
      #mNav a .ni { width: 26px !important; height: 26px !important; border-radius: 8px !important; }
      #mNav a .ni svg { width: 16px !important; height: 16px !important; }
      #mNav a:not(.on) .ni { filter: saturate(.55) opacity(.8); }
      .qa-top { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin: 16px 0; }
      .qt { display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--tx, inherit); font: 700 14px var(--sans, system-ui); text-decoration: none; cursor: pointer; transition: transform .12s, border-color .12s, box-shadow .12s; text-align: left; }
      .qt:hover { transform: translateY(-2px); border-color: var(--acc, #ff9a1f); box-shadow: 0 10px 24px -14px rgba(0,0,0,.5); }
      .qt .qt-ic { flex: none; display: grid; place-items: center; }
      .qt .qt-ic .ni { width: 38px !important; height: 38px !important; border-radius: 12px !important; }
      .qt .qt-ic .ni svg, .qt .qt-ic > svg { width: 22px !important; height: 22px !important; }
      @media (max-width: 560px) { .qa-top { grid-template-columns: 1fr 1fr; gap: 8px; } .qt { padding: 11px; font-size: 13px; } .qt .qt-ic .ni { width: 32px !important; height: 32px !important; } }
      @media (max-width: 900px) {
        #mNav { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; gap: 2px; padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; box-shadow: 0 -8px 24px rgba(0,0,0,.18); }
        #mNav::-webkit-scrollbar { display: none; }
        #mNav a { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; border-radius: 12px; color: var(--mut); font-size: 10.5px; font-weight: 700; text-decoration: none; position: relative; white-space: nowrap; }
        #mNav a svg { width: 21px; height: 21px; flex: none; }
        #mNav a span:not(.cnt):not(:has(svg)) { max-width: 100%; overflow: hidden; text-overflow: ellipsis; font-size: 9.5px; }
        #mNav a.on, #mNav a.active, #mNav a[aria-current] { color: var(--acc, #ff9a1f); background: color-mix(in srgb, var(--acc, #ff9a1f) 12%, transparent); }
        #mNav .cnt { position: absolute; top: 2px; right: 10px; font-size: 9px; }
        .view { padding-bottom: calc(90px + env(safe-area-inset-bottom)) !important; }
        #subnav { overflow-x: auto; scrollbar-width: none; }
        #subnav::-webkit-scrollbar { display: none; }
        #subnav a, #subnav button { flex: none; }
        .ab-grid > * { padding: 10px !important; min-width: 0; }
        .ab-grid small, .ab-grid p { font-size: 11.5px; }
      }
    </style>
    <script>
      (function () {
        function label() {
          document.querySelectorAll('.tw table').forEach(function (t) {
            var hs = [].map.call(t.querySelectorAll('thead th'), function (h) { return h.textContent.replace(/[▲▼↑↓]/g, '').trim(); });
            if (!hs.length) return;
            t.querySelectorAll('tbody tr').forEach(function (tr) {
              [].forEach.call(tr.children, function (td, i) {
                if (td.tagName === 'TD' && !td.hasAttribute('data-l') && hs[i] && td.colSpan < 2) td.setAttribute('data-l', hs[i]);
              });
            });
          });
        }
        var q = 0;
        new MutationObserver(function () { if (!q) q = requestAnimationFrame(function () { q = 0; label(); }); }).observe(document.body, { childList: true, subtree: true });
        label();
      })();
      (function () {
        var KEYS = [['dashboard', 'Home'], ['users', 'Players'], ['gifts', 'Gifts'], ['abuse', 'Abuse']];
        function build() {
          var nav = document.getElementById('nav');
          if (!nav) return;
          var m = document.getElementById('mNav');
          if (!m) {
            m = document.createElement('nav');
            m.id = 'mNav';
            m.setAttribute('aria-label', 'Sections');
            document.body.appendChild(m);
            m.onclick = function (e) {
              if (e.target.closest('[data-menu]')) { e.preventDefault(); var b = document.getElementById('burger'); if (b) b.click(); }
            };
          }
          var cur = (location.hash.replace(/^#\//, '').split(/[/?]/)[0]) || 'dashboard';
          if (cur === 'user') cur = 'users';
          var h = KEYS.map(function (k) {
            var a = nav.querySelector('a[data-r="' + k[0] + '"]');
            var ic = a ? (a.querySelector('.ni, svg') || {}).outerHTML || '' : '';
            return a ? '<a href="#/' + k[0] + '" class="' + (cur === k[0] ? 'on' : '') + '">' + ic + '<span>' + k[1] + '</span></a>' : '';
          }).join('') + '<a href="#" data-menu class="' + (KEYS.some(function (k) { return k[0] === cur; }) ? '' : 'on') + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg><span>All pages</span></a>';
          if (m._h !== h) { m._h = h; m.innerHTML = h; }
        }
        setInterval(build, 800);
        addEventListener('hashchange', function () { setTimeout(build, 30); });
      })();
    </script>
  </body>
